<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https://translate.googleapis.com https://translate.google.com https://www.gstatic.com https://translate-pa.googleapis.com; style-src 'unsafe-inline' https://translate.googleapis.com https://www.gstatic.com; connect-src 'self' https://push-worker.27tb8s6fct.workers.dev https://rickroll-counter.27tb8s6fct.workers.dev https://translate.googleapis.com https://translate-pa.googleapis.com https://translate.google.com; img-src 'self' data: https://i.ibb.co https://translate.google.com https://translate.googleapis.com https://www.gstatic.com https://www.google.com https://fonts.gstatic.com; frame-src https://translate.google.com; object-src 'none'; base-uri 'self'; form-action 'none'; font-src https://fonts.gstatic.com;" />
  <title>Titan Canyon Activity Log - Server 2864</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #0d1117; --bg2: #161b22; --card: #1c2128; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #79c0ff;
      --army: #3fb950; --navy: #388bfd; --air: #d29922;
      --ce: #e3b341; --mm: #bc8cff; --tag: #21262d;
      --green: #3fb950; --gold: #e3b341; --red: #f85149;
      --shadow: rgba(0,0,0,.45);
    }
    :root[data-theme="light"] {
      --bg: #f6f8fa; --bg2: #ffffff; --card: #ffffff; --border: #d0d7de;
      --text: #1f2328; --muted: #656d76; --accent: #1f75d4;
      --army: #1a7f37; --navy: #0550ae; --air: #9a6700;
      --ce: #7d4e00; --mm: #6e40c9; --tag: #eaeef2;
      --green: #1a7f37; --gold: #9a6700; --red: #cf222e;
      --shadow: rgba(140,149,159,.2);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    header {
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: .85rem 2rem; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 200; box-shadow: 0 1px 0 var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 1.2rem; }
    .header-title { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    .header-sub { font-size: .75rem; color: var(--muted); margin-top: 3px; }
    .nav-row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .nav-link {
      font-size: .8rem; color: var(--muted); text-decoration: none; padding: .35rem .8rem;
      border: 1px solid var(--border); border-radius: 7px; transition: all .15s;
      display: inline-flex; align-items: center; gap: .35rem;
    }
    .nav-link:hover { border-color: var(--accent); color: var(--accent); }
    .hdr-btn {
      background: var(--tag); border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: .38rem .9rem; cursor: pointer; font-size: .8rem;
      display: flex; align-items: center; gap: .4rem; transition: all .15s; white-space: nowrap;
    }
    .hdr-btn:hover { border-color: var(--accent); color: var(--accent); }

    @keyframes egg-pulse {
      0%, 100% { opacity: .28; filter: drop-shadow(0 0 0px transparent); transform: scale(1); }
      50%       { opacity: .6;  filter: drop-shadow(0 0 5px rgba(255,200,80,.55)); transform: scale(1.12); }
    }
    .easter-egg {
      font-size: .9rem; text-decoration: none; line-height: 1; cursor: pointer;
      animation: egg-pulse 3.4s ease-in-out infinite; display: inline-block;
    }
    .easter-egg:hover {
      animation: none; opacity: 1;
      filter: drop-shadow(0 0 7px rgba(255,200,80,.85));
      transform: scale(1.22); transition: transform .15s, filter .15s;
    }

    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.4rem 1.5rem; margin-bottom: 1.25rem;
    }
    .card h2 {
      font-size: .72rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .07em; margin-bottom: 1rem;
    }
    .muted { color: var(--muted); }
    .row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }

    /* Identity bar */
    .id-bar { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; justify-content: space-between; }
    .id-who { display: flex; align-items: center; gap: .8rem; }
    .id-avatar {
      width: 46px; height: 46px; border-radius: 50%; background: var(--tag);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.1rem; color: var(--accent);
    }
    .id-name { font-size: 1.15rem; font-weight: 700; }
    .id-meta { font-size: .78rem; color: var(--muted); margin-top: 2px; }
    .pill {
      display: inline-flex; align-items: center; gap: .3rem; padding: .15rem .55rem;
      border-radius: 999px; font-size: .68rem; font-weight: 600; border: 1px solid var(--border);
      background: var(--tag); color: var(--muted);
    }
    .pill.dog { color: var(--army); border-color: color-mix(in srgb, var(--army) 45%, var(--border)); }
    .pill.mss { color: var(--navy); border-color: color-mix(in srgb, var(--navy) 45%, var(--border)); }
    .pill.pru { color: var(--air); border-color: color-mix(in srgb, var(--air) 45%, var(--border)); }
    .pill.cat { color: var(--mm); border-color: color-mix(in srgb, var(--mm) 45%, var(--border)); }
    .pill.ce  { color: var(--ce); border-color: color-mix(in srgb, var(--ce) 45%, var(--border)); }
    .pill.mm  { color: var(--mm); border-color: color-mix(in srgb, var(--mm) 45%, var(--border)); }

    select, .btn, .s-input {
      font-family: inherit; font-size: .85rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg2); color: var(--text);
      padding: .5rem .8rem; transition: all .15s;
    }
    select, .btn { cursor: pointer; }
    select:hover, .btn:hover { border-color: var(--accent); }
    .s-input { width: 100%; outline: none; }
    .s-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
    .btn-primary {
      background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
      padding: .7rem 1.2rem; font-size: .9rem;
    }
    .btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
    .btn-block { display: block; width: 100%; text-align: center; }
    a.btn { text-decoration: none; display: inline-flex; align-items: center; gap: .45rem; justify-content: center; }

    .squad-head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin-bottom: .2rem; }
    .squad-name { font-size: 1.3rem; font-weight: 800; color: var(--accent); }
    .squad-time { font-size: .9rem; color: var(--text); }
    .squad-time .et { color: var(--muted); font-size: .8rem; }
    .your-pos {
      display: inline-flex; align-items: center; gap: .4rem; margin-top: .8rem;
      padding: .45rem .8rem; border-radius: 8px; background: var(--tag); border: 1px solid var(--border);
      font-size: .85rem;
    }
    .your-pos b { color: var(--accent); }

    .swap-banner {
      margin-top: 1rem; padding: .8rem 1rem; border-radius: 10px;
      background: color-mix(in srgb, var(--gold) 12%, var(--card));
      border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--border));
      font-size: .85rem; color: var(--text); display: flex; gap: .6rem; align-items: flex-start;
    }
    .swap-banner svg { flex-shrink: 0; margin-top: 1px; color: var(--gold); }

    .mates { list-style: none; display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .9rem; }
    .mates li {
      font-size: .78rem; padding: .28rem .6rem; border-radius: 7px;
      background: var(--bg2); border: 1px solid var(--border);
    }
    .mates li.me { border-color: var(--accent); color: var(--accent); font-weight: 700; }

    .status-line { font-size: .82rem; color: var(--muted); margin-bottom: 1rem; }
    .status-line b { color: var(--text); }
    .cta-wrap { text-align: center; padding: 1rem 0 .25rem; }
    .cta-sub { font-size: .85rem; color: var(--muted); margin-top: .8rem; }

    /* Section title */
    .sec-title {
      font-size: .95rem; font-weight: 700; margin: 1.75rem 0 .9rem; color: var(--text);
      display: flex; align-items: center; gap: .5rem;
    }
    .sec-title::before {
      content: ''; display: inline-block; width: 3px; height: .95rem;
      background: var(--accent); border-radius: 2px; flex-shrink: 0;
    }

    /* All-squads search */
    .search-bar { position: relative; margin-bottom: 1.25rem; }
    .search-bar svg { position: absolute; left: .75rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .search-bar .s-input { padding-left: 2.2rem; }

    /* Squad grid */
    .squad-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 1.1rem; }
    .sq-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.2rem 1.3rem; display: flex; flex-direction: column;
    }
    .sq-card.dimmed { display: none; }
    .sq-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: .6rem; margin-bottom: .15rem; }
    .sq-card-name { font-size: 1.1rem; font-weight: 800; color: var(--accent); }
    .sq-card-time { font-size: .78rem; color: var(--muted); margin-top: 2px; }
    .count-badge {
      flex-shrink: 0; font-size: .74rem; font-weight: 700; padding: .25rem .6rem;
      border-radius: 999px; background: var(--tag); border: 1px solid var(--border); color: var(--text);
      white-space: nowrap;
    }
    .sq-meta-row { display: flex; gap: .4rem; flex-wrap: wrap; margin: .6rem 0 .35rem; }
    .sq-sec-label {
      font-size: .68rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em; margin: .85rem 0 .4rem;
    }
    .pos-list { list-style: none; display: flex; flex-direction: column; gap: .3rem; }
    .pos-row {
      display: flex; align-items: center; gap: .55rem; font-size: .82rem;
      padding: .3rem .5rem; border-radius: 7px; background: var(--bg2); border: 1px solid var(--border);
    }
    .pos-row.hidden { display: none; }
    .pos-row.me { border-color: var(--accent); }
    .pos-num {
      flex-shrink: 0; width: 1.4rem; height: 1.4rem; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: .72rem; font-weight: 700; background: var(--tag); color: var(--muted);
    }
    .pos-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pos-name.me { color: var(--accent); font-weight: 700; }
    .role-tag { flex-shrink: 0; font-size: .64rem; font-weight: 700; padding: .08rem .4rem; border-radius: 4px; }
    .role-tag.ce { background: rgba(227,179,65,.13); color: var(--ce); }
    .role-tag.mm { background: rgba(188,140,255,.13); color: var(--mm); }
    .sup-list { list-style: none; display: flex; flex-wrap: wrap; gap: .35rem; }
    .sup-list li {
      font-size: .76rem; padding: .22rem .55rem; border-radius: 6px;
      background: var(--bg2); border: 1px solid var(--border);
    }
    .sup-list li.hidden { display: none; }
    .sup-list li.me { border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .no-match { font-size: .8rem; color: var(--muted); padding: 2.5rem 1rem; text-align: center; }

    .empty-state { text-align: center; padding: 2.5rem 1.5rem; }
    .empty-state svg { color: var(--muted); margin-bottom: 1rem; }
    .empty-state p { color: var(--muted); font-size: .9rem; margin-bottom: 1.4rem; }

    .loading { text-align: center; color: var(--muted); padding: 3rem 1rem; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    @media (max-width: 640px) {
      main { padding: 1rem 1rem 2rem; }
      header { padding: .7rem 1rem; flex-wrap: wrap; gap: .5rem; }
      #themeLabel { display: none; }
      .squad-grid { grid-template-columns: 1fr; }
    }

    @keyframes footer-shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
    .site-footer { text-align: center; padding: 1.5rem 2rem; font-size: .75rem; border-top: 1px solid var(--border); }
    .site-footer .footer-text {
      display: inline-block;
      background: linear-gradient(90deg, var(--muted) 0%, var(--accent) 25%, var(--muted) 50%, var(--accent) 75%, var(--muted) 100%);
      background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; animation: footer-shimmer 6s linear infinite;
    }
    .site-footer a { color: var(--accent); text-decoration: none; -webkit-text-fill-color: var(--accent); }
    .site-footer a:hover { text-decoration: underline; }
    .rc-wrap { display: inline-flex; align-items: center; gap: .35rem; margin-top: .35rem; cursor: pointer; }
    .rc-wrap .rc-icon { display: inline-block; animation: egg-pulse 3.4s ease-in-out infinite; font-size: .85rem; line-height: 1; -webkit-text-fill-color: initial; }
    .rc-count { color: var(--muted); -webkit-text-fill-color: var(--muted); font-size: .65rem; font-weight: 600; opacity: 0; transition: opacity .2s; }
    .rc-count.visible { opacity: 1; }

    /* Needs-to-move indicator + modal */
    .swap-pill {
      flex-shrink: 0; font-size: .62rem; font-weight: 700; padding: .08rem .42rem;
      border-radius: 999px; white-space: nowrap; margin-left: .1rem;
      background: color-mix(in srgb, var(--gold) 15%, transparent);
      color: var(--gold); border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--border));
    }
    .move-cta { margin: 0 0 1.25rem; }
    .move-btn {
      display: inline-flex; align-items: center; gap: .5rem; cursor: pointer;
      font-family: inherit; font-size: .85rem; font-weight: 600;
      padding: .55rem 1rem; border-radius: 9px;
      background: color-mix(in srgb, var(--gold) 12%, var(--card));
      border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--border));
      color: var(--gold); transition: all .15s;
    }
    .move-btn:hover { background: color-mix(in srgb, var(--gold) 20%, var(--card)); }
    .move-btn svg { flex-shrink: 0; }
    .move-count { background: var(--gold); color: #1a1200; border-radius: 999px; font-size: .72rem; padding: .05rem .45rem; font-weight: 800; }
    .move-modal-overlay { display: none; position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,.6); align-items: center; justify-content: center; padding: 1rem; }
    .move-modal-overlay.active { display: flex; }
    .move-modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; max-width: 460px; width: 100%; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 32px var(--shadow); }
    .move-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .3rem; }
    .move-modal-title { font-size: 1rem; font-weight: 700; color: var(--text); }
    .move-modal-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.2rem; line-height: 1; padding: .2rem; }
    .move-modal-close:hover { color: var(--text); }
    .move-modal-sub { font-size: .78rem; margin-bottom: 1rem; }
    .mv-group { margin-bottom: 1rem; }
    .mv-group-head { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
    .mv-group-count { font-size: .72rem; color: var(--muted); }
    .mv-list { list-style: none; display: flex; flex-direction: column; gap: .35rem; }
    .mv-row { display: flex; align-items: center; gap: .6rem; font-size: .82rem; padding: .35rem .55rem; border-radius: 7px; background: var(--bg2); border: 1px solid var(--border); flex-wrap: wrap; }
    .mv-name { font-weight: 700; }
    .mv-arrow { color: var(--gold); font-weight: 600; }
    .mv-squad { color: var(--muted); margin-left: auto; font-size: .76rem; }

    /* Google Translate overrides */
    body { top: 0 !important; }
    body > .skiptranslate { display: none !important; }
    #google_translate_element { position: absolute; left: -9999px; opacity: 0; pointer-events: none; }
    .lang-btn {
      background: var(--tag); border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: .38rem .7rem; cursor: pointer; font-size: .8rem;
      display: flex; align-items: center; gap: .35rem; font-family: inherit;
      font-weight: 600; letter-spacing: .02em; white-space: nowrap; transition: border-color .2s;
    }
    .lang-btn:hover { border-color: var(--accent); color: var(--text); }
    .lang-modal-overlay { display: none; position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 1rem; }
    .lang-modal-overlay.active { display: flex; }
    .lang-modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; max-width: 400px; width: 100%; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 32px var(--shadow); }
    .lang-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .lang-modal-title { font-size: 1rem; font-weight: 700; color: var(--text); }
    .lang-modal-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.2rem; padding: .2rem; line-height: 1; }
    .lang-modal-close:hover { color: var(--text); }
    .lang-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; }
    .lang-option { display: flex; align-items: center; gap: .5rem; padding: .5rem .65rem; border-radius: 8px; border: 1px solid transparent; background: var(--bg); cursor: pointer; font-size: .82rem; color: var(--text); font-family: inherit; transition: border-color .15s, background .15s; }
    .lang-option:hover { border-color: var(--accent); background: var(--tag); }
    .lang-option.active { border-color: var(--accent); background: var(--tag); }
    .lang-option .lang-flag { font-size: 1.1rem; }
    .lang-option .lang-name { flex: 1; }
    @media (max-width: 640px) { .lang-grid { grid-template-columns: 1fr; } }
  </style>
  <style>
    .cl-wrap { max-width: 860px; margin: 0 auto; padding: 1rem; }
    .cl-title { font-size: 1.4rem; margin: .4rem 0 1rem; }
    .cl-tabs { display: flex; gap: .5rem; margin-bottom: 1rem; }
    .cl-tab { background: #1c2128; color: #8b949e; border: 1px solid #30363d; border-radius: 8px; padding: .5rem .9rem; cursor: pointer; font-size: .9rem; }
    .cl-tab.active { background: #388bfd; color: #fff; border-color: #388bfd; }
    .cl-muted { color: #8b949e; padding: 1rem 0; }
    .cl-row { display: grid; grid-template-columns: 150px auto 1fr; gap: .6rem; align-items: baseline; padding: .55rem .3rem; border-bottom: 1px solid #21262d; font-size: .88rem; }
    .cl-row .ts { color: #8b949e; font-size: .78rem; white-space: nowrap; }
    .cl-row .who { color: #e6edf3; font-weight: 600; }
    .cl-row .det { color: #adbac7; grid-column: 1 / -1; padding-left: 150px; }
    .cl-badge { display: inline-block; font-size: .72rem; padding: .1rem .45rem; border-radius: 999px; white-space: nowrap; }
    .b-reg { background: rgba(63,185,80,.15); color: #3fb950; }
    .b-rereg { background: rgba(210,153,34,.15); color: #d29922; }
    .b-cancel { background: rgba(248,81,73,.15); color: #f85149; }
    .b-admin { background: rgba(121,192,255,.15); color: #79c0ff; }
    .cl-empty { color: #8b949e; padding: 1.5rem .3rem; text-align: center; }
    @media (max-width: 600px) { .cl-row { grid-template-columns: 1fr; } .cl-row .det { padding-left: 0; } }
  </style>
</head>

<header>
  <div class="header-left">
    <div>
      <div class="header-title notranslate">&#9876; Titan Canyon Activity Log</div>
      <div class="header-sub">Server 2864</div>
    </div>
    <div class="nav-row">
      <a href="https://2864tw.com" class="nav-link" title="Home" style="padding:.35rem .6rem"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L10 3.5l7 7"/><path d="M5 9v7a1 1 0 001 1h3v-4h2v4h3a1 1 0 001-1V9"/></svg></a>

      <a href="titan.html" class="nav-link"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="8" width="3" height="7" rx="1"/><rect x="6" y="4" width="3" height="11" rx="1"/><rect x="11" y="1" width="3" height="14" rx="1"/></svg> Dashboard</a>
    </div>
  </div>
  <div style="display:flex;gap:.6rem;align-items:center">
    <a href="https://shattereddisk.github.io/rickroll/" target="_blank" rel="noopener noreferrer" class="easter-egg" title="">&#127828;</a>
    <button class="lang-btn notranslate" id="langBtn" aria-label="Change language">
      <span id="langFlag">&#127482;&#127480;</span>
      <span id="langCode">/en</span>
    </button>
    <div id="google_translate_element"></div>
    <button class="hdr-btn" onclick="toggleTheme()">
      <span id="themeIcon">&#9728;&#65039;</span>
      <span id="themeLabel">Light Mode</span>
    </button>
  </div>
</header>

<main id="main">
    <div class="cl-wrap">
      <h1 class="cl-title">Titan Canyon Activity</h1>
      <div class="cl-tabs">
        <button id="tabSignup" class="cl-tab active" type="button">Signup Activity</button>
        <button id="tabAdmin" class="cl-tab" type="button">Admin Changes</button>
      </div>
      <div id="loading" class="cl-muted">Loading...</div>
      <div id="cl-list"></div>
    </div>
</main>

<div class="lang-modal-overlay" id="langModal">
  <div class="lang-modal">
    <div class="lang-modal-header">
      <span class="lang-modal-title">Select Language</span>
      <button class="lang-modal-close" id="langModalClose" aria-label="Close">&#10005;</button>
    </div>
    <div class="lang-grid" id="langGrid"></div>
  </div>
</div>

<footer class="site-footer">
  <span class="footer-text">Brought to you by supporters of the fk boats movement</span><br>
  <a href="https://github.com/texnottexas/titan-canyon-rosters" target="_blank" rel="noopener noreferrer">GitHub</a>
  <br><span class="rc-wrap" id="rc-wrap"><span class="rc-icon">&#127871;</span><span class="rc-count" id="rc-count"></span></span>
</footer>

<script>
var TITAN_API = 'https://push-worker.27tb8s6fct.workers.dev';

function toggleTheme() {
  var d = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', d ? 'light' : 'dark');
  document.getElementById('themeIcon').textContent = d ? '🌙' : '☀️';
  document.getElementById('themeLabel').textContent = d ? 'Dark Mode' : 'Light Mode';
}

// --- Load -------------------------------------------------------------------
function getJSON(url) { return fetch(url).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); }); }

function clEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clFmt(ts){ try{ var d=new Date(ts); if(isNaN(d.getTime()))return clEsc(ts); return d.toLocaleString(); }catch(e){ return clEsc(ts); } }
function clBadge(a){ a=String(a||'').toLowerCase(); if(a.indexOf('cancel')>=0)return 'b-cancel'; if(a.indexOf('re-reg')>=0)return 'b-rereg'; if(a.indexOf('regist')>=0)return 'b-reg'; return 'b-admin'; }
var CL_CACHE={signup:null,admin:null};
function clRenderSignup(entries){
  if(!entries||!entries.length) return '<div class="cl-empty">No signup activity yet.</div>';
  return entries.map(function(e){
    return '<div class="cl-row">'+
      '<span class="ts">'+clFmt(e.timestamp)+'</span>'+
      '<span class="cl-badge '+clBadge(e.action)+'">'+clEsc(e.action)+'</span>'+
      '<span class="who notranslate">'+clEsc(e.name)+'</span>'+
      '<span class="det">'+clEsc(e.details)+'</span>'+
    '</div>';
  }).join('');
}
function clRenderAdmin(entries){
  if(!entries||!entries.length) return '<div class="cl-empty">No admin changes yet.</div>';
  return entries.map(function(e){
    return '<div class="cl-row">'+
      '<span class="ts">'+clFmt(e.timestamp)+'</span>'+
      '<span class="cl-badge b-admin">'+clEsc(e.action)+'</span>'+
      '<span class="who notranslate">'+clEsc(e.editor)+'</span>'+
      '<span class="det">'+clEsc(e.details)+'</span>'+
    '</div>';
  }).join('');
}
function clShow(view){
  document.getElementById('tabSignup').classList.toggle('active', view==='signup');
  document.getElementById('tabAdmin').classList.toggle('active', view==='admin');
  var list=document.getElementById('cl-list');
  list.innerHTML = view==='signup' ? clRenderSignup(CL_CACHE.signup) : clRenderAdmin(CL_CACHE.admin);
}
function clInit(){
  Promise.all([
    getJSON(TITAN_API+'/titan/signup-log').catch(function(){return [];}),
    getJSON(TITAN_API+'/titan/changelog').catch(function(){return [];})
  ]).then(function(res){
    CL_CACHE.signup = Array.isArray(res[0]) ? res[0] : [];
    CL_CACHE.admin  = Array.isArray(res[1]) ? res[1] : [];
    var l=document.getElementById('loading'); if(l) l.style.display='none';
    clShow('signup');
  });
  document.getElementById('tabSignup').addEventListener('click',function(){clShow('signup');});
  document.getElementById('tabAdmin').addEventListener('click',function(){clShow('admin');});
}
clInit();
</script>

<script>
// ---- RICKROLL COUNTER ------------------------------------------------------
(function() {
  var COUNTER_URL = 'https://rickroll-counter.27tb8s6fct.workers.dev';
  var rcCount = document.getElementById('rc-count');
  var rcWrap = document.getElementById('rc-wrap');
  var currentCount = 0;

  fetch(COUNTER_URL, { mode: 'cors' })
    .then(function(r) { return r.json(); })
    .then(function(d) { currentCount = d.count; })
    .catch(function() {});

  var egg = document.querySelector('.easter-egg');
  if (egg) {
    egg.addEventListener('click', function() {
      try {
        fetch(COUNTER_URL, { method: 'POST', mode: 'cors' })
          .then(function(r) { return r.json(); })
          .then(function(d) { currentCount = d.count; })
          .catch(function() {});
      } catch(e) {}
    });
  }

  if (rcWrap) {
    rcWrap.addEventListener('click', function() {
      rcCount.textContent = String(currentCount);
      rcCount.classList.toggle('visible');
    });
  }
})();
</script>

<script>
(function() {
  var LANGUAGES = [
    { code: 'en', flag: '\u{1F1FA}\u{1F1F8}', name: 'English' },
    { code: 'es', flag: '\u{1F1EA}\u{1F1F8}', name: 'Español' },
    { code: 'fr', flag: '\u{1F1EB}\u{1F1F7}', name: 'Français' },
    { code: 'de', flag: '\u{1F1E9}\u{1F1EA}', name: 'Deutsch' },
    { code: 'pt', flag: '\u{1F1E7}\u{1F1F7}', name: 'Português' },
    { code: 'it', flag: '\u{1F1EE}\u{1F1F9}', name: 'Italiano' },
    { code: 'ru', flag: '\u{1F1F7}\u{1F1FA}', name: 'Русский' },
    { code: 'ja', flag: '\u{1F1EF}\u{1F1F5}', name: '日本語' },
    { code: 'ko', flag: '\u{1F1F0}\u{1F1F7}', name: '한국어' },
    { code: 'zh-CN', flag: '\u{1F1E8}\u{1F1F3}', name: '中文' },
    { code: 'ar', flag: '\u{1F1F8}\u{1F1E6}', name: 'العربية' },
    { code: 'tr', flag: '\u{1F1F9}\u{1F1F7}', name: 'Türkçe' },
    { code: 'vi', flag: '\u{1F1FB}\u{1F1F3}', name: 'Tiếng Việt' },
    { code: 'th', flag: '\u{1F1F9}\u{1F1ED}', name: 'ไทย' },
    { code: 'hi', flag: '\u{1F1EE}\u{1F1F3}', name: 'हिन्दी' },
    { code: 'pl', flag: '\u{1F1F5}\u{1F1F1}', name: 'Polski' },
    { code: 'uk', flag: '\u{1F1FA}\u{1F1E6}', name: 'Українська' },
    { code: 'id', flag: '\u{1F1EE}\u{1F1E9}', name: 'Indonesia' }
  ];
  window._gtLoaded = false;
  function getLangData(code) {
    var base = code.split('-')[0];
    for (var i = 0; i < LANGUAGES.length; i++) { if (LANGUAGES[i].code === code || LANGUAGES[i].code === base) return LANGUAGES[i]; }
    return null;
  }
  window.updateLangBtn = function(code) {
    var data = getLangData(code);
    var flagEl = document.getElementById('langFlag'); var codeEl = document.getElementById('langCode');
    if (data && flagEl && codeEl) { flagEl.textContent = data.flag; codeEl.textContent = '/' + data.code; }
    else if (flagEl && codeEl) { flagEl.textContent = '\u{1F310}'; codeEl.textContent = '/' + code; }
    var options = document.querySelectorAll('.lang-option');
    for (var i = 0; i < options.length; i++) options[i].classList.toggle('active', options[i].getAttribute('data-lang') === code);
  };
  window.detectCurrentLang = function() {
    var match = document.cookie.match(/googtrans=\/en\/([a-zA-Z-]{2,10})/);
    if (match && match[1]) return match[1];
    return 'en';
  };
  function applyLangToCombo(code, delay, onSuccess) {
    var attempts = 0;
    var poll = setInterval(function() {
      var combo = document.querySelector('.goog-te-combo');
      if (combo) { combo.value = code; combo.dispatchEvent(new Event('change')); clearInterval(poll); window.updateLangBtn(code); if (onSuccess) onSuccess(); }
      if (++attempts > 30) clearInterval(poll);
    }, delay || 200);
  }
  function selectLanguage(code) {
    if (code === 'en') { restoreEnglish(); return; }
    try { sessionStorage.setItem('pendingLang', code); } catch(e) {}
    applyLangToCombo(code, 200, closeLangModal);
  }
  function restoreEnglish() {
    try { sessionStorage.removeItem('pendingLang'); } catch(e) {}
    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=Lax; Secure';
    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.2864tw.com; SameSite=Lax; Secure';
    closeLangModal(); location.reload();
  }
  var langModalEl = document.getElementById('langModal');
  function openLangModal() { if (langModalEl) langModalEl.classList.add('active'); }
  function closeLangModal() { if (langModalEl) langModalEl.classList.remove('active'); }
  var grid = document.getElementById('langGrid');
  if (grid) {
    var detected = window.detectCurrentLang();
    for (var i = 0; i < LANGUAGES.length; i++) {
      var l = LANGUAGES[i];
      var btn = document.createElement('button');
      btn.className = 'lang-option' + (l.code === detected ? ' active' : '');
      btn.setAttribute('data-lang', l.code);
      var flagSpan = document.createElement('span'); flagSpan.className = 'lang-flag'; flagSpan.textContent = l.flag;
      var nameSpan = document.createElement('span'); nameSpan.className = 'lang-name'; nameSpan.textContent = l.name;
      btn.appendChild(flagSpan); btn.appendChild(nameSpan);
      btn.addEventListener('click', (function(code) { return function() { selectLanguage(code); }; })(l.code));
      grid.appendChild(btn);
    }
    window.updateLangBtn(detected);
  }
  var langBtn = document.getElementById('langBtn');
  if (langBtn) langBtn.addEventListener('click', openLangModal);
  var langModalClose = document.getElementById('langModalClose');
  if (langModalClose) langModalClose.addEventListener('click', closeLangModal);
  if (langModalEl) langModalEl.addEventListener('click', function(e) { if (e.target === langModalEl) closeLangModal(); });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && langModalEl && langModalEl.classList.contains('active')) { closeLangModal(); e.stopPropagation(); } });
  setTimeout(function() { if (!window._gtLoaded) { var btn = document.getElementById('langBtn'); if (btn) { btn.style.opacity = '0.5'; btn.style.cursor = 'default'; btn.title = 'Translation unavailable'; btn.removeEventListener('click', openLangModal); } } }, 15000);
})();
function googleTranslateElementInit() {
  window._gtLoaded = true;
  new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'google_translate_element');
  var pendingLang = null;
  try { pendingLang = sessionStorage.getItem('pendingLang'); sessionStorage.removeItem('pendingLang'); } catch(e) {}
  if (pendingLang) {
    var a = 0; var poll = setInterval(function () { var c = document.querySelector('.goog-te-combo'); if (c) { c.value = pendingLang; c.dispatchEvent(new Event('change')); clearInterval(poll); window.updateLangBtn(pendingLang); } if (++a > 30) clearInterval(poll); }, 250);
  } else {
    try {
      var dismissed = localStorage.getItem('translate-dismissed');
      if (!dismissed) { var lang = (navigator.language || navigator.userLanguage || 'en').split('-')[0]; if (lang !== 'en') { var a2 = 0; var p2 = setInterval(function () { var c = document.querySelector('.goog-te-combo'); if (c) { c.value = lang; c.dispatchEvent(new Event('change')); clearInterval(p2); window.updateLangBtn(lang); } if (++a2 > 30) clearInterval(p2); }, 250); } }
    } catch(e) {}
    var detected = window.detectCurrentLang();
    if (detected !== 'en') window.updateLangBtn(detected);
  }
}
</script>
<script src="https://translate.googleapis.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script src="feedback-widget.js"></script>
</body>
