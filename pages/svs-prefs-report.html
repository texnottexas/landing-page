<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://translate.googleapis.com https://translate.google.com https://www.gstatic.com https://translate-pa.googleapis.com; style-src 'unsafe-inline' https://fonts.googleapis.com https://translate.googleapis.com https://www.gstatic.com; connect-src 'self' https://push-worker.27tb8s6fct.workers.dev https://translate.googleapis.com https://translate-pa.googleapis.com https://translate.google.com; img-src 'self' data: https://translate.google.com https://translate.googleapis.com https://www.gstatic.com https://www.google.com https://fonts.gstatic.com; frame-src https://translate.google.com; font-src https://fonts.gstatic.com; base-uri 'self'; form-action 'none'; object-src 'none';">
<title>SvS Preferences Report · Server 2864</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117; --surface:#161b22; --card:#1c2128; --raised:#222a35;
    --border:#30363d; --border2:#262c36;
    --text:#e6edf3; --muted:#8b949e; --faint:#6e7681;
    --blue:#58a6ff; --green:#3fb950; --red:#f85149; --yellow:#d29922; --purple:#bc8cff;
    --dog:#e3a008; --mss:#58a6ff; --dgen:#db61a2;  /* pink, NOT purple: #bc8cff scored OKLab dE 2.7 vs MSS #58a6ff under deuteranopia and 13.2 with normal vision (below the 15 floor). Every light purple fails against this blue -- validated with the dataviz validate_palette.js sweep, 2026-09-09. Pink scores 14.1 CVD / 24.3 normal. */
    --disp:"Chakra Petch", ui-sans-serif, system-ui, sans-serif;
    --sans:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased; background-image:radial-gradient(60% 40% at 85% -8%, rgba(88,166,255,.06), transparent 60%);}
a{color:inherit}
header{display:flex; align-items:center; gap:.7rem; padding:.9rem 1.1rem; border-bottom:1px solid var(--border); position:sticky; top:0; background:rgba(13,17,23,.9); backdrop-filter:blur(8px); z-index:10;}
.home-btn{display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border:1px solid var(--border); border-radius:9px; color:var(--muted);}
.home-btn:hover{color:var(--text); border-color:var(--blue)}
.wordmark{display:flex; align-items:baseline; gap:.4rem; font-family:var(--disp); font-weight:700; font-size:1.05rem; letter-spacing:.01em;}
.wordmark .s{font-family:var(--mono); color:var(--green); font-size:.72rem; font-weight:600; letter-spacing:.05em;}
.spacer{margin-left:auto}
#google_translate_element{position:absolute; left:-9999px; opacity:0; pointer-events:none}
.lang-btn{background:var(--card); border:1px solid var(--border2); color:var(--muted); border-radius:8px; padding:.38rem .7rem; cursor:pointer; font-size:.8rem; display:flex; align-items:center; gap:.35rem; font-family:inherit; font-weight:600; letter-spacing:.02em; white-space:nowrap;}
.lang-btn:hover{border-color:var(--blue); color:var(--text)}
.lang-modal-overlay{display:none; position:fixed; inset:0; z-index:400; background:rgba(0,0,0,.6); align-items:center; justify-content:center; padding:1rem}
.lang-modal-overlay.active{display:flex}
.lang-modal{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.25rem; max-width:400px; width:100%; max-height:80vh; overflow-y:auto; box-shadow:0 18px 50px -18px rgba(0,0,0,.85)}
.lang-modal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem}
.lang-modal-title{font-size:1rem; font-weight:700; color:var(--text); font-family:var(--disp)}
.lang-modal-close{background:none; border:none; color:var(--muted); cursor:pointer; font-size:1.2rem; padding:.2rem; line-height:1}
.lang-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:.5rem}
.lang-option{display:flex; align-items:center; gap:.5rem; padding:.5rem .65rem; border-radius:8px; border:1px solid transparent; background:var(--bg); cursor:pointer; font-size:.82rem; color:var(--text); font-family:inherit;}
.lang-option:hover{border-color:var(--blue); background:var(--card)}
.lang-flag{font-size:1.1rem}
  body > .skiptranslate{display:none !important}

  /* ---- report layout ---- */
  main{max-width:1080px; margin:0 auto; padding:1.4rem 1.1rem 4rem}
  .gate{max-width:420px; margin:4rem auto; text-align:center}
  .gate select{width:100%; margin-top:.9rem; padding:.6rem .7rem; background:var(--surface); color:var(--text);
    border:1px solid var(--border); border-radius:9px; font-family:var(--sans); font-size:.95rem}
  .gate p{color:var(--muted); font-size:.9rem}

  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:.7rem; margin-bottom:1.5rem}
  .kpi{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:.85rem .95rem}
  .kpi .n{font-family:var(--mono); font-size:1.55rem; font-weight:600; line-height:1.1; letter-spacing:-.02em}
  .kpi .l{font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; margin-top:.25rem}
  .kpi.sw .n{color:var(--yellow)}

  section{margin-bottom:1.6rem}
  h2{font-family:var(--disp); font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em;
    color:var(--muted); margin:0 0 .6rem; display:flex; align-items:baseline; gap:.5rem}
  h2 .sub{font-family:var(--mono); font-size:.68rem; color:var(--faint); text-transform:none; letter-spacing:0}
  .panel{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1rem 1.05rem}

  /* clickable bar rows */
  .bars{display:flex; flex-direction:column; gap:.5rem}
  .bar{display:grid; grid-template-columns:5.6rem 1fr auto; align-items:center; gap:.7rem;
    background:none; border:0; padding:.25rem .3rem; border-radius:8px; cursor:pointer; text-align:left; color:inherit; font:inherit}
  .bar:hover{background:var(--raised)}
  .bar:focus-visible{outline:2px solid var(--blue); outline-offset:1px}
  .bar .k{font-size:.82rem; font-weight:600}
  .bar .track{position:relative; height:26px; background:var(--surface); border-radius:6px; overflow:hidden}
  .bar .fill{position:absolute; inset:0 auto 0 0; border-radius:6px; transition:width .35s ease}
  .bar .seg{position:absolute; top:0; bottom:0; opacity:.95;
    background:repeating-linear-gradient(135deg, rgba(255,255,255,.40) 0 4px, rgba(255,255,255,0) 4px 8px), var(--green);}
  .bar .v{font-family:var(--mono); font-size:.82rem; font-weight:600; min-width:5.4rem; text-align:right; color:var(--muted)}
  .bar .v b{color:var(--text); font-size:.95rem}

  /* matrix */
  .mx{width:100%; border-collapse:separate; border-spacing:4px; font-size:.82rem}
  .mx th{font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600; padding:.15rem .3rem; text-align:center}
  .mx th.rh{text-align:right; width:4.2rem}
  .mx td{padding:0}
  .cell{width:100%; border:1px solid var(--border2); border-radius:8px; padding:.5rem .3rem; cursor:pointer;
    background:var(--surface); color:var(--text); font:inherit; text-align:center; transition:border-color .15s}
  .cell:hover{border-color:var(--blue)}
  .cell:focus-visible{outline:2px solid var(--blue); outline-offset:1px}
  .cell .c{font-family:var(--mono); font-size:1.05rem; font-weight:600; display:block; line-height:1.15}
  .cell .p{font-family:var(--mono); font-size:.64rem; color:var(--text); opacity:.72}
  .cell[data-empty="1"]{cursor:default; opacity:.35}
  .cell[data-empty="1"]:hover{border-color:var(--border2)}

  .hint{font-size:.72rem; color:var(--faint); margin:.5rem 0 0}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:1.1rem}

  /* names drawer */
  .dv{position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.62); display:none}
  .dv.open{display:block}
  .dw{position:absolute; top:0; right:0; bottom:0; width:min(420px,100%); background:var(--surface);
    border-left:1px solid var(--border); display:flex; flex-direction:column; box-shadow:-18px 0 50px -20px rgba(0,0,0,.9)}
  .dh{display:flex; align-items:flex-start; gap:.6rem; padding:1rem 1.1rem .8rem; border-bottom:1px solid var(--border)}
  .dh .t{font-family:var(--disp); font-weight:700; font-size:1rem}
  .dh .m{font-family:var(--mono); font-size:.72rem; color:var(--muted); margin-top:.2rem}
  .dx{margin-left:auto; background:none; border:1px solid var(--border); border-radius:8px; color:var(--muted);
    width:30px; height:30px; cursor:pointer; font-size:1rem; line-height:1; flex:none}
  .dx:hover{color:var(--text); border-color:var(--blue)}
  .dl{overflow-y:auto; padding:.5rem .6rem 1.2rem; -webkit-overflow-scrolling:touch}
  .pr{display:grid; grid-template-columns:1fr auto; gap:.15rem .6rem; padding:.5rem .55rem; border-radius:8px}
  .pr:nth-child(odd){background:var(--card)}
  .pr .nm{font-weight:600; font-size:.9rem; min-width:0; overflow-wrap:anywhere}
  .pr .cp{font-family:var(--mono); font-size:.9rem; font-weight:600; text-align:right; white-space:nowrap}
  .pr .tags{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.1rem}
  .tag{font-family:var(--mono); font-size:.63rem; padding:.1rem .34rem; border-radius:4px;
    border:1px solid var(--border); color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
  .tag.DOG{color:var(--dog); border-color:color-mix(in srgb, var(--dog) 45%, var(--border))}
  .tag.MSS{color:var(--mss); border-color:color-mix(in srgb, var(--mss) 45%, var(--border))}
  .tag.DGen{color:var(--dgen); border-color:color-mix(in srgb, var(--dgen) 45%, var(--border))}
  .tag.sw{color:var(--yellow); border-color:color-mix(in srgb, var(--yellow) 50%, var(--border))}

  @media(max-width:760px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .two{grid-template-columns:1fr}
    .bar{grid-template-columns:4.6rem 1fr auto; gap:.5rem}
    .bar .v{min-width:4.6rem; font-size:.75rem}
    .mx{font-size:.75rem; border-spacing:3px}
    .mx th.rh{width:3.2rem}
  }

</style>
</head>
<body>

<header>
  <a href="https://2864tw.com" class="home-btn" title="Back to 2864tw.com" aria-label="Home"><svg width="19" height="19" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2.5l-8 7h3v6a1 1 0 001 1h3v-4h2v4h3a1 1 0 001-1v-6h3z"/></svg></a>
  <div class="wordmark notranslate"><span class="t">SvS Preferences</span><span class="s">/ REPORT</span></div>
  <div class="spacer"></div>
  <button class="lang-btn notranslate" id="langBtn" aria-label="Change language"><span id="langFlag">&#127482;&#127480;</span><span id="langCode">/en</span></button>
  <div id="google_translate_element"></div>
</header>

<main>
  <div class="gate" id="gate" hidden>
    <p id="gateMsg"></p>
    <select id="gateSel" aria-label="Pick your name"><option value="">Loading roster…</option></select>
  </div>

  <div id="report" hidden>
    <div class="kpis">
      <div class="kpi"><div class="n notranslate" translate="no" id="kTotal">0</div><div class="l">Responses</div></div>
      <div class="kpi"><div class="n notranslate" translate="no" id="kCp">0M</div><div class="l">Total march CP</div></div>
      <div class="kpi"><div class="n notranslate" translate="no" id="kProf">0 / 0</div><div class="l">CE / MM</div></div>
      <div class="kpi sw"><div class="n notranslate" translate="no" id="kSwitch">0</div><div class="l">Will switch to MM</div></div>
    </div>

    <section>
      <h2>Role <span class="sub">attack · either · defend</span></h2>
      <div class="panel"><div class="bars" id="roleBars"></div></div>
      <p class="hint">Click any bar or cell for the player list.</p>
    </section>

    <div class="two">
      <section>
        <h2>Profession</h2>
        <div class="panel"><div class="bars" id="profBars"></div></div>
      </section>
      <section>
        <h2>Main unit</h2>
        <div class="panel"><div class="bars" id="unitBars"></div></div>
      </section>
    </div>

    <section>
      <h2>Alliance <span class="sub">× role</span></h2>
      <div class="panel"><table class="mx" id="mx"></table></div>
    </section>

    <section>
      <h2>March CP <span class="sub">millions</span></h2>
      <div class="panel"><div class="bars" id="cpBars"></div></div>
    </section>
  </div>
</main>

<div class="dv" id="drawer" role="dialog" aria-modal="true" aria-label="Player list">
  <div class="dw">
    <div class="dh">
      <div><div class="t" id="dTitle"></div><div class="m notranslate" translate="no" id="dMeta"></div></div>
      <button class="dx" id="dClose" type="button" aria-label="Close">&#10005;</button>
    </div>
    <div class="dl" id="dList"></div>
  </div>
</div>

<div class="lang-modal-overlay" id="langModal">
  <div class="lang-modal">
    <div class="lang-modal-header"><span class="lang-modal-title">Language</span><button type="button" class="lang-modal-close" id="langClose" aria-label="Close">&#10005;</button></div>
    <div class="lang-grid" id="langGrid"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var API = 'https://push-worker.27tb8s6fct.workers.dev';
  var SK_RE = /^[a-f0-9]{16}$/;
  var ALLIANCES = ['DOG', 'MSS', 'DGen'];
  var ROLES = [['attack', 'Attack'], ['either', 'Either'], ['defend', 'Defend']];
  var UNITS = ['Army', 'Navy', 'Air Force'];
  var BANDS = [
    { k: '200+',    lo: 200, hi: Infinity },
    { k: '150-199', lo: 150, hi: 200 },
    { k: '100-149', lo: 100, hi: 150 },
    { k: '50-99',   lo: 50,  hi: 100 },
    { k: '<50',     lo: 0,   hi: 50 }
  ];
  // Role is a DIVERGING dimension (attack <-> defend), so it gets two poles and a
  // neutral midpoint, not three categorical hues. The previous red/blue/green
  // paired green with blue, which reads as one colour to deuteranopes.
  var ROLE_COLOR = { attack: 'var(--red)', either: '#768390', defend: 'var(--blue)' };
  var ALLY_COLOR = { DOG: 'var(--dog)', MSS: 'var(--mss)', DGen: 'var(--dgen)' };

  var rows = [];
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function cpOf(r) { return typeof r.cpMillions === 'number' ? r.cpMillions : 0; }
  function sumCp(list) { var t = 0; for (var i = 0; i < list.length; i++) t += cpOf(list[i]); return t; }
  function fmtM(n) { return Math.round(n).toLocaleString('en-US') + 'M'; }

  // ---- identity: this endpoint is roster-gated, so we need a siteKey -------
  function storedKey() {
    try {
      var pid = JSON.parse(localStorage.getItem('playerIdentity') || 'null');
      if (pid && pid.siteKey && SK_RE.test(pid.siteKey) && !pid.guest) return pid.siteKey;
    } catch (e) {}
    var s = sessionStorage.getItem('svsReportKey');
    return (s && SK_RE.test(s)) ? s : '';
  }

  function showGate(msg) {
    $('report').hidden = true;
    var g = $('gate');
    g.hidden = false;
    $('gateMsg').textContent = msg;
    var sel = $('gateSel');
    if (sel.dataset.built) return;
    fetch('player-data.json').then(function (r) { return r.json(); }).then(function (data) {
      var arr = (data && data.players) || data || [];
      var opts = ['<option value="">Select your name…</option>'];
      arr.slice().sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); })
        .forEach(function (p) {
          if (p && p.siteKey && SK_RE.test(p.siteKey)) {
            opts.push('<option value="' + esc(p.siteKey) + '">' + esc(p.name) + '</option>');
          }
        });
      sel.innerHTML = opts.join('');
      sel.dataset.built = '1';
      sel.addEventListener('change', function () {
        if (!sel.value) return;
        // Session-only: a read-only report must not overwrite the site-wide
        // playerIdentity that the signup/vote pages write to.
        sessionStorage.setItem('svsReportKey', sel.value);
        load(sel.value);
      });
    }).catch(function () { sel.innerHTML = '<option value="">Roster unavailable</option>'; });
  }

  function load(key) {
    fetch(API + '/svs/report?siteKey=' + encodeURIComponent(key))
      .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (res) {
        if (res.s === 403) { sessionStorage.removeItem('svsReportKey'); return showGate('That name is not on the S2864 roster. Pick your name to view the report.'); }
        if (!res.j || !res.j.ok) return showGate('Could not load the report. Try again in a moment.');
        rows = res.j.rows || [];
        $('gate').hidden = true;
        $('report').hidden = false;
        render();
      })
      .catch(function () { showGate('Could not reach the server. Try again in a moment.'); });
  }

  // ---- drawer -------------------------------------------------------------
  function openDrawer(title, list) {
    list = list.slice().sort(function (a, b) { return cpOf(b) - cpOf(a) || a.name.localeCompare(b.name); });
    $('dTitle').textContent = title;
    $('dMeta').textContent = list.length + (list.length === 1 ? ' player · ' : ' players · ') + fmtM(sumCp(list));
    $('dList').innerHTML = list.length ? list.map(function (r) {
      var tags = [];
      if (r.alliance) tags.push('<span class="tag ' + esc(r.alliance) + '">' + esc(r.alliance) + '</span>');
      if (r.profession) tags.push('<span class="tag">' + esc(r.profession) + '</span>');
      if (r.role) tags.push('<span class="tag">' + esc(r.role) + '</span>');
      if (r.unit) tags.push('<span class="tag">' + esc(r.unit) + '</span>');
      if (r.willingSwitchMM === true) tags.push('<span class="tag sw">will switch MM</span>');
      return '<div class="pr"><span class="nm notranslate" translate="no">' + esc(r.name) + '</span>' +
        '<span class="cp notranslate" translate="no">' + (r.cpMillions ? esc(r.cpMillions) + 'M' : '—') + '</span>' +
        '<span class="tags">' + tags.join('') + '</span></div>';
    }).join('') : '<p class="hint" style="padding:.6rem">No players in this group.</p>';
    $('drawer').classList.add('open');
    $('dClose').focus();
  }
  function closeDrawer() { $('drawer').classList.remove('open'); }

  // ---- rendering ----------------------------------------------------------
  function barRow(key, label, list, color, max, segList, lum) {
    var n = list.length;
    var pct = max ? (n / max * 100) : 0;
    var seg = '';
    if (segList && segList.length) {
      seg = '<span class="seg" style="left:0;width:' + (max ? segList.length / max * 100 : 0) + '%"></span>';
    }
    return '<button class="bar" type="button" data-b="' + esc(key) + '">' +
      '<span class="k">' + esc(label) + '</span>' +
      '<span class="track"><span class="fill" style="width:' + pct.toFixed(1) + '%;background:' + color + ';opacity:' + (lum == null ? 0.55 : lum) + '"></span>' + seg + '</span>' +
      '<span class="v notranslate" translate="no"><b>' + n + '</b> · ' + fmtM(sumCp(list)) + '</span>' +
      '</button>';
  }

  var buckets = {};   // key -> {title, list}
  function reg(key, title, list) { buckets[key] = { title: title, list: list }; return list; }

  function render() {
    buckets = {};
    var total = rows.length;
    var ce = rows.filter(function (r) { return r.profession === 'CE'; });
    var mm = rows.filter(function (r) { return r.profession === 'MM'; });
    var sw = rows.filter(function (r) { return r.willingSwitchMM === true; });

    $('kTotal').textContent = total;
    $('kCp').textContent = fmtM(sumCp(rows));
    $('kProf').textContent = ce.length + ' / ' + mm.length;
    $('kSwitch').textContent = sw.length;

    // role
    var roleLists = ROLES.map(function (r) {
      return reg('role:' + r[0], r[1], rows.filter(function (x) { return x.role === r[0]; }));
    });
    var roleMax = Math.max.apply(null, roleLists.map(function (l) { return l.length; }).concat([1]));
    $('roleBars').innerHTML = ROLES.map(function (r, i) {
      return barRow('role:' + r[0], r[1], roleLists[i], ROLE_COLOR[r[0]], roleMax);
    }).join('');

    // profession, with the switchers marked inside the CE bar
    reg('prof:CE', 'Combat Elite', ce);
    reg('prof:MM', 'Mechanical Master', mm);
    reg('switch', 'CE willing to switch to MM', sw);
    var pMax = Math.max(ce.length, mm.length, 1);
    $('profBars').innerHTML =
      barRow('prof:CE', 'CE', ce, 'var(--green)', pMax, sw) +
      barRow('prof:MM', 'MM', mm, 'var(--purple)', pMax) +
      barRow('switch', '\u21b3 will switch', sw, 'var(--green)', pMax, sw);

    // unit
    var unitLists = UNITS.map(function (u) {
      return reg('unit:' + u, u, rows.filter(function (x) { return x.unit === u; }));
    });
    var uMax = Math.max.apply(null, unitLists.map(function (l) { return l.length; }).concat([1]));
    $('unitBars').innerHTML = UNITS.map(function (u, i) {
      return barRow('unit:' + u, u, unitLists[i], '#6e8bb5', uMax);
    }).join('');

    // CP bands
    var bandLists = BANDS.map(function (b) {
      return reg('band:' + b.k, b.k + 'M march CP', rows.filter(function (x) {
        var c = cpOf(x); return c >= b.lo && c < b.hi;
      }));
    });
    var bMax = Math.max.apply(null, bandLists.map(function (l) { return l.length; }).concat([1]));
    $('cpBars').innerHTML = BANDS.map(function (b, i) {
      // dim -> bright as CP rises; BANDS is ordered high..low so invert the index
      var lum = 0.35 + 0.65 * ((BANDS.length - 1 - i) / (BANDS.length - 1));
      return barRow('band:' + b.k, b.k, bandLists[i], 'var(--yellow)', bMax, null, lum);
    }).join('');

    // alliance x role matrix
    var mxMax = 1;
    ALLIANCES.forEach(function (a) {
      ROLES.forEach(function (r) {
        var l = rows.filter(function (x) { return x.alliance === a && x.role === r[0]; });
        reg('mx:' + a + ':' + r[0], a + ' · ' + r[1], l);
        if (l.length > mxMax) mxMax = l.length;
      });
    });
    var html = '<tr><th class="rh"></th>' + ROLES.map(function (r) { return '<th>' + r[1] + '</th>'; }).join('') +
      '<th>All</th></tr>';
    ALLIANCES.forEach(function (a) {
      html += '<tr><th class="rh" style="color:' + ALLY_COLOR[a] + '">' + a + '</th>';
      ROLES.forEach(function (r) {
        var l = buckets['mx:' + a + ':' + r[0]].list;
        var o = l.length ? (0.12 + 0.55 * (l.length / mxMax)) : 0;
        html += '<td><button class="cell" type="button" data-b="mx:' + a + ':' + r[0] + '"' +
          (l.length ? '' : ' data-empty="1" disabled') +
          ' style="background:color-mix(in srgb, ' + ALLY_COLOR[a] + ' ' + (o * 100).toFixed(0) + '%, var(--surface))">' +
          '<span class="c notranslate" translate="no">' + l.length + '</span>' +
          '<span class="p notranslate" translate="no">' + (l.length ? fmtM(sumCp(l)) : '—') + '</span></button></td>';
      });
      var all = reg('ally:' + a, a, rows.filter(function (x) { return x.alliance === a; }));
      html += '<td><button class="cell" type="button" data-b="ally:' + a + '">' +
        '<span class="c notranslate" translate="no">' + all.length + '</span>' +
        '<span class="p notranslate" translate="no">' + fmtM(sumCp(all)) + '</span></button></td></tr>';
    });
    $('mx').innerHTML = html;
  }

  // one delegated handler for every clickable element
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-b]') : null;
    if (!el) return;
    var b = buckets[el.getAttribute('data-b')];
    if (b) openDrawer(b.title, b.list);
  });
  $('dClose').addEventListener('click', closeDrawer);
  $('drawer').addEventListener('click', function (e) { if (e.target === this) closeDrawer(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

  var k = storedKey();
  if (k) load(k); else showGate('This report lists player names, so it is limited to the S2864 roster.');
})();

</script>
<script>
(function(){
  "use strict";
  function $(id){ return document.getElementById(id); }
  var LANGUAGES=[
    {code:'en',name:'English',flag:'🇺🇸'},{code:'zh-CN',name:'简体中文',flag:'🇨🇳'},
    {code:'zh-TW',name:'繁體中文',flag:'🇹🇼'},{code:'ko',name:'한국어',flag:'🇰🇷'},
    {code:'ja',name:'日本語',flag:'🇯🇵'},{code:'es',name:'Español',flag:'🇪🇸'},
    {code:'pt',name:'Português',flag:'🇧🇷'},{code:'fr',name:'Français',flag:'🇫🇷'},
    {code:'de',name:'Deutsch',flag:'🇩🇪'},{code:'ru',name:'Русский',flag:'🇷🇺'},
    {code:'ar',name:'العربية',flag:'🇸🇦'},{code:'vi',name:'Tiếng Việt',flag:'🇻🇳'},
    {code:'th',name:'ไทย',flag:'🇹🇭'},{code:'id',name:'Indonesia',flag:'🇮🇩'},{code:'tr',name:'Türkçe',flag:'🇹🇷'}
  ];
  window.applyLangToCombo=function(code,delay){ var a=0; var t=setInterval(function(){ var c=document.querySelector('.goog-te-combo'); if(c){ c.value=code; c.dispatchEvent(new Event('change')); clearInterval(t); updateLangBtn(code); } if(++a>30) clearInterval(t); }, delay||200); };
  function updateLangBtn(code){ var l=LANGUAGES.filter(function(x){return x.code===code;})[0]; var f=$('langFlag'), c=$('langCode'); if(l&&f){ f.textContent=l.flag; c.textContent='/'+code.split('-')[0]; } else if(f){ f.textContent='🌐'; c.textContent='/'+code; } }
  function detectCurrentLang(){ var m=document.cookie.match(/googtrans=\/en\/([a-zA-Z-]{2,10})/); return m&&m[1]?m[1]:'en'; }
  function selectLanguage(code){
    if(code==='en'){ document.cookie='googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=Lax; Secure'; document.cookie='googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.2864tw.com; SameSite=Lax; Secure'; sessionStorage.removeItem('svsLang'); closeLangModal(); location.reload(); return; }
    sessionStorage.setItem('svsLang',code); window.applyLangToCombo(code,200); closeLangModal();
  }
  function openLangModal(){
    var g=$('langGrid');
    if(g && !g.dataset.built){
      g.innerHTML=LANGUAGES.map(function(l){ return '<button type="button" class="lang-option" data-code="'+l.code+'"><span class="lang-flag">'+l.flag+'</span><span class="lang-name">'+l.name+'</span></button>'; }).join('');
      g.dataset.built='1';
      g.querySelectorAll('.lang-option').forEach(function(b){ b.addEventListener('click', function(){ selectLanguage(b.getAttribute('data-code')); }); });
    }
    $('langModal').classList.add('active');
  }
  function closeLangModal(){ $('langModal').classList.remove('active'); }
  $('langBtn').addEventListener('click', openLangModal);
  $('langClose').addEventListener('click', closeLangModal);
  $('langModal').addEventListener('click', function(e){ if(e.target===this) closeLangModal(); });
  setTimeout(function(){ if(!window._gtLoaded){ var b=$('langBtn'); if(b){ b.style.opacity='0.5'; b.style.cursor='default'; b.title='Translation unavailable'; b.removeEventListener('click', openLangModal); } } }, 15000);
  updateLangBtn(detectCurrentLang());
})();
function googleTranslateElementInit(){
  window._gtLoaded=true;
  new google.translate.TranslateElement({ pageLanguage:'en', autoDisplay:false }, 'google_translate_element');
  var p=sessionStorage.getItem('svsLang'); if(p && p!=='en' && window.applyLangToCombo) window.applyLangToCombo(p,250);
}
</script>
<script src="https://translate.googleapis.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
