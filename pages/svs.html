<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://translate.googleapis.com https://translate.google.com https://www.gstatic.com https://translate-pa.googleapis.com; style-src 'unsafe-inline' https://fonts.googleapis.com https://translate.googleapis.com https://www.gstatic.com; connect-src 'self' https://push-worker.27tb8s6fct.workers.dev https://translate.googleapis.com https://translate-pa.googleapis.com https://translate.google.com; img-src 'self' data: https://translate.google.com https://translate.googleapis.com https://www.gstatic.com https://www.google.com https://fonts.gstatic.com; frame-src https://translate.google.com; font-src https://fonts.gstatic.com; base-uri 'self'; form-action 'none'; object-src 'none';">
<title>SvS Preferences · Server 2864</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1117; --surface:#161b22; --card:#1c2128; --raised:#222a35;
    --border:#30363d; --border2:#262c36;
    --text:#e6edf3; --muted:#8b949e; --faint:#6e7681;
    --blue:#58a6ff; --green:#3fb950; --red:#f85149; --yellow:#d29922; --purple:#bc8cff;
    --dog:#e3a008; --mss:#58a6ff; --dgen:#bc8cff;
    --disp:"Chakra Petch", ui-sans-serif, system-ui, sans-serif;
    --sans:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased; background-image:radial-gradient(60% 40% at 85% -8%, rgba(88,166,255,.06), transparent 60%);}
  a{color:inherit}
  header{display:flex; align-items:center; gap:.7rem; padding:.9rem 1.1rem; border-bottom:1px solid var(--border); position:sticky; top:0; background:rgba(13,17,23,.9); backdrop-filter:blur(8px); z-index:10;}
  .home-btn{display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border:1px solid var(--border); border-radius:9px; color:var(--muted);}
  .home-btn:hover{color:var(--text); border-color:var(--blue)}
  .wordmark{display:flex; align-items:baseline; gap:.4rem; font-family:var(--disp); font-weight:700; font-size:1.05rem; letter-spacing:.01em;}
  .wordmark .s{font-family:var(--mono); color:var(--green); font-size:.72rem; font-weight:600; letter-spacing:.05em;}
  .spacer{margin-left:auto}
  main{max-width:640px; margin:0 auto; padding:1.6rem 1.1rem 4rem;}
  .kicker{font-family:var(--mono); font-size:.66rem; letter-spacing:.2em; text-transform:uppercase; color:var(--blue);}
  h1{font-family:var(--disp); font-weight:700; font-size:1.75rem; margin:.5rem 0 .5rem; line-height:1.15;}
  .lede{color:var(--muted); font-size:.98rem; max-width:56ch;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.15rem 1.15rem 1.25rem; margin-top:1.3rem;}
  .field{margin-top:1.1rem;}
  .field:first-child{margin-top:0;}
  label.lab{display:block; font-size:.8rem; font-weight:600; color:var(--text); margin-bottom:.45rem;}
  label.lab .hint{font-weight:400; color:var(--faint); font-size:.74rem; margin-left:.4rem;}

  select, input[type=text], input[type=number]{
    width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:.6rem .7rem; font-family:inherit; font-size:.95rem;}
  select:focus, input:focus{outline:none; border-color:var(--blue);}
  .cp-wrap{position:relative;}
  .cp-wrap .suffix{position:absolute; right:.8rem; top:50%; transform:translateY(-50%); color:var(--faint); font-family:var(--mono); font-size:.82rem; pointer-events:none;}
  .cp-wrap input{padding-right:2.6rem;}

  .seg{display:flex; gap:.4rem; flex-wrap:wrap;}
  .seg button{flex:1 1 auto; min-width:72px; background:var(--surface); border:1px solid var(--border); color:var(--muted);
    border-radius:10px; padding:.55rem .5rem; cursor:pointer; font-family:inherit; font-size:.9rem; font-weight:600; transition:border-color .15s, color .15s, background .15s;}
  .seg button:hover{border-color:var(--border2); color:var(--text);}
  .seg button.on{border-color:var(--blue); background:color-mix(in srgb, var(--blue) 14%, transparent); color:var(--text);}
  .seg.alli button.on[data-val=DOG]{border-color:var(--dog); background:color-mix(in srgb,var(--dog) 15%,transparent);}
  .seg.alli button.on[data-val=MSS]{border-color:var(--mss); background:color-mix(in srgb,var(--mss) 15%,transparent);}
  .seg.alli button.on[data-val=DGen]{border-color:var(--dgen); background:color-mix(in srgb,var(--dgen) 15%,transparent);}

  .idrow{display:flex; align-items:flex-end; gap:.6rem;}
  .idrow > div{flex:1;}
  .link{background:none; border:none; color:var(--blue); cursor:pointer; font-family:inherit; font-size:.8rem; padding:.2rem 0; text-decoration:underline; text-underline-offset:2px;}
  .prefill-note{font-size:.76rem; color:var(--faint); margin-top:.5rem; min-height:1em;}

  .save{margin-top:1.5rem; width:100%; background:var(--green); color:#04160b; border:none; border-radius:11px;
    padding:.8rem; font-family:var(--disp); font-weight:700; font-size:1rem; letter-spacing:.02em; cursor:pointer;}
  .save:hover{filter:brightness(1.06);}
  .save:disabled{opacity:.5; cursor:default; filter:none;}
  .status{margin-top:.9rem; font-size:.9rem; min-height:1.2em; text-align:center;}
  .status.ok{color:var(--green);} .status.err{color:var(--red);}
  .editing{margin-top:.2rem; font-size:.78rem; color:var(--yellow); font-family:var(--mono);}
  .hidden{display:none !important;}

  /* Google Translate widget */
  body{top:0 !important}
  body > .skiptranslate{display:none !important}
  #google_translate_element{position:absolute; left:-9999px; opacity:0; pointer-events:none}
  .lang-btn{background:var(--card); border:1px solid var(--border2); color:var(--muted); border-radius:8px; padding:.38rem .7rem; cursor:pointer; font-size:.8rem; display:flex; align-items:center; gap:.35rem; font-family:inherit; font-weight:600; letter-spacing:.02em; white-space:nowrap;}
  .lang-btn:hover{border-color:var(--blue); color:var(--text)}
  .lang-modal-overlay{display:none; position:fixed; inset:0; z-index:400; background:rgba(0,0,0,.6); align-items:center; justify-content:center; padding:1rem}
  .lang-modal-overlay.active{display:flex}
  .lang-modal{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.25rem; max-width:400px; width:100%; max-height:80vh; overflow-y:auto; box-shadow:0 18px 50px -18px rgba(0,0,0,.85)}
  .lang-modal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem}
  .lang-modal-title{font-size:1rem; font-weight:700; color:var(--text); font-family:var(--disp)}
  .lang-modal-close{background:none; border:none; color:var(--muted); cursor:pointer; font-size:1.2rem; padding:.2rem; line-height:1}
  .lang-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:.5rem}
  .lang-option{display:flex; align-items:center; gap:.5rem; padding:.5rem .65rem; border-radius:8px; border:1px solid transparent; background:var(--bg); cursor:pointer; font-size:.82rem; color:var(--text); font-family:inherit;}
  .lang-option:hover{border-color:var(--blue); background:var(--card)}
  .lang-flag{font-size:1.1rem}
</style>
</head>
<body>
<header>
  <a href="https://2864tw.com" class="home-btn" title="Back to 2864tw.com" aria-label="Home"><svg width="19" height="19" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2.5l-8 7h3v6a1 1 0 001 1h3v-4h2v4h3a1 1 0 001-1v-6h3z"/></svg></a>
  <div class="wordmark notranslate"><span class="t">SvS Preferences</span><span class="s">/ S2864</span></div>
  <div class="spacer"></div>
  <button class="lang-btn notranslate" id="langBtn" aria-label="Change language"><span id="langFlag">&#127482;&#127480;</span><span id="langCode">/en</span></button>
  <div id="google_translate_element"></div>
</header>

<main>
  <div class="kicker">Server vs Server</div>
  <h1>What are your SvS preferences?</h1>
  <p class="lede">Set your Server vs Server preferences once. We use them to build the battle plan. Update anytime; there's no deadline.</p>

  <div class="card">
    <!-- identity -->
    <div class="field">
      <label class="lab" for="rosterSel">Your name</label>
      <div id="rosterWrap">
        <select id="rosterSel" translate="no" class="notranslate"><option value="">Loading roster…</option></select>
        <div style="margin-top:.5rem"><button type="button" class="link" id="notListedBtn">My name isn't in the list</button></div>
      </div>
      <div id="nameWrap" class="hidden">
        <input type="text" id="nameInput" maxlength="40" placeholder="Type your in-game name" autocomplete="off">
        <div style="margin-top:.5rem"><button type="button" class="link" id="backToRosterBtn">Back to the roster list</button></div>
      </div>
      <div class="prefill-note" id="prefillNote"></div>
      <div class="editing hidden" id="editingNote">Editing your saved preferences.</div>
    </div>

    <!-- alliance -->
    <div class="field">
      <label class="lab">Alliance</label>
      <div class="seg alli notranslate" data-seg="alliance" translate="no">
        <button type="button" data-val="DOG">DOG</button>
        <button type="button" data-val="MSS">MSS</button>
        <button type="button" data-val="DGen">DGen</button>
      </div>
    </div>

    <!-- profession -->
    <div class="field">
      <label class="lab">Profession <span class="hint">CE = Combat Elite, MM = Mechanical Master</span></label>
      <div class="seg" data-seg="profession">
        <button type="button" data-val="CE">Combat Elite</button>
        <button type="button" data-val="MM">Mechanical Master</button>
      </div>
    </div>

    <!-- role -->
    <div class="field">
      <label class="lab">Attack or defend?</label>
      <div class="seg" data-seg="role">
        <button type="button" data-val="attack">Attack</button>
        <button type="button" data-val="defend">Defend</button>
        <button type="button" data-val="either">Either</button>
      </div>
    </div>

    <!-- cp -->
    <div class="field">
      <label class="lab" for="cpInput">Main march CP <span class="hint">in millions, e.g. 73.5</span></label>
      <div class="cp-wrap">
        <input type="number" id="cpInput" min="0" step="0.1" inputmode="decimal" placeholder="0">
        <span class="suffix notranslate" translate="no">M</span>
      </div>
    </div>

    <!-- unit -->
    <div class="field">
      <label class="lab">Main unit type</label>
      <div class="seg" data-seg="unit">
        <button type="button" data-val="Army">Army</button>
        <button type="button" data-val="Navy">Navy</button>
        <button type="button" data-val="Air Force">Air Force</button>
      </div>
    </div>

    <!-- MM switch (CE only) -->
    <div class="field hidden" id="switchField">
      <label class="lab">Willing / able to switch to Mechanical Master for this battle?</label>
      <div class="seg" data-seg="switch">
        <button type="button" data-val="yes">Yes</button>
        <button type="button" data-val="no">No</button>
      </div>
    </div>

    <button type="button" class="save" id="saveBtn">Save my preferences</button>
    <div class="status" id="status"></div>
  </div>
</main>

<div class="lang-modal-overlay" id="langModal">
  <div class="lang-modal">
    <div class="lang-modal-header"><span class="lang-modal-title">Language</span><button type="button" class="lang-modal-close" id="langClose" aria-label="Close">&#10005;</button></div>
    <div class="lang-grid" id="langGrid"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var API = 'https://push-worker.27tb8s6fct.workers.dev';
  var SK_RE = /^[a-f0-9]{16}$/;
  var state = { name:'', siteKey:'', notListed:false, roster:[], byKey:{} };
  var $ = function(id){ return document.getElementById(id); };
  var ERR_MSG = {
    bad_cp:'Enter CP in millions, e.g. 73.5.', rate_limited:'Please wait a moment and try again.',
    no_identity:'Pick your name (or type it) first.', bad_alliance:'Pick your alliance.',
    bad_profession:'Pick your profession.', bad_role:'Attack, Defend, or Either?',
    bad_unit:'Pick your main unit type.', bad_switch:'Answer the Mechanical Master question.',
    bad_json:'Something went wrong. Please try again.'
  };

  // ---- segmented controls ----
  function segEl(name){ return document.querySelector('.seg[data-seg="'+name+'"]'); }
  function getSeg(name){ var s=segEl(name); if(!s) return ''; var b=s.querySelector('button.on'); return b?b.getAttribute('data-val'):''; }
  function setSeg(name,val){ var s=segEl(name); if(!s) return; s.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-val')===val); }); }
  document.querySelectorAll('.seg').forEach(function(s){
    s.addEventListener('click', function(e){
      var b=e.target.closest('button'); if(!b) return;
      s.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x===b); });
      if(s.getAttribute('data-seg')==='profession') updateSwitchVisibility();
      clearStatus();
    });
  });
  function updateSwitchVisibility(){
    var ce = getSeg('profession')==='CE';
    $('switchField').classList.toggle('hidden', !ce);
    if(!ce) setSeg('switch','');
  }
  var PROF_LONG = { 'Combat Elite':'CE', 'Mechanical Master':'MM' };

  // ---- identity ----
  function currentIdentity(){
    if(state.notListed){
      var nm=($('nameInput').value||'').trim();
      return { name:nm, siteKey:'' };
    }
    var v=$('rosterSel').value||'';
    if(SK_RE.test(v)){ var p=state.byKey[v]; return { name:p?p.name:'', siteKey:v }; }
    return { name:'', siteKey:'' };
  }
  var myReqToken = 0;
  function resetForm(){
    ['alliance','profession','role','unit','switch'].forEach(function(n){ setSeg(n,''); });
    $('cpInput').value = '';
    $('switchField').classList.add('hidden');
    $('editingNote').classList.add('hidden');
  }
  function prefillFromRoster(siteKey){
    var p = state.byKey[siteKey]; var note=$('prefillNote');
    if(!p){ note.textContent=''; return; }
    var did=[];
    if(p.alliance && ['DOG','MSS','DGen'].indexOf(p.alliance)>=0){ setSeg('alliance', p.alliance); did.push('alliance'); }
    var prof = PROF_LONG[p.profession];
    if(prof){ setSeg('profession', prof); did.push('profession'); }
    updateSwitchVisibility();
    note.textContent = did.length
      ? ('Pre-filled your ' + did.join(' and ') + ' from the roster; confirm or change below.')
      : 'Confirm your alliance and profession below.';
  }
  function loadMyRecord(){
    var id=currentIdentity();
    if(!id.siteKey && !id.name){ return; }
    var q = id.siteKey ? ('siteKey='+encodeURIComponent(id.siteKey)) : ('name='+encodeURIComponent(id.name||''));
    var token = ++myReqToken;
    fetch(API+'/svs/my?'+q).then(function(r){ return r.json(); }).then(function(d){
      if(token !== myReqToken) return;   // a newer name selection superseded this response
      var rec = d && d.record;
      if(!rec) { $('editingNote').classList.add('hidden'); return; }
      // overlay the player's saved answers on top of the reset form
      if(rec.alliance) setSeg('alliance', rec.alliance);
      if(rec.profession) setSeg('profession', rec.profession);
      if(rec.role) setSeg('role', rec.role);
      if(rec.unit) setSeg('unit', rec.unit);
      if(rec.cpMillions!=null) $('cpInput').value = rec.cpMillions;
      updateSwitchVisibility();
      if(rec.profession==='CE' && typeof rec.willingSwitchMM==='boolean') setSeg('switch', rec.willingSwitchMM?'yes':'no');
      $('editingNote').classList.remove('hidden');
    }).catch(function(){});
  }
  function onPlayerChosen(){
    clearStatus();
    resetForm();                 // clear stale answers before prefill / overlay
    myReqToken++;                // invalidate any in-flight /svs/my from a prior pick
    var id=currentIdentity();
    if(id.siteKey){ prefillFromRoster(id.siteKey); }
    else { $('prefillNote').textContent = id.name ? 'Not on the roster; pick your alliance and profession below.' : ''; }
    loadMyRecord();
  }

  $('rosterSel').addEventListener('change', onPlayerChosen);
  $('nameInput').addEventListener('blur', onPlayerChosen);
  $('notListedBtn').addEventListener('click', function(){
    state.notListed=true; $('rosterWrap').classList.add('hidden'); $('nameWrap').classList.remove('hidden');
    $('prefillNote').textContent=''; $('editingNote').classList.add('hidden'); $('nameInput').focus();
  });
  $('backToRosterBtn').addEventListener('click', function(){
    state.notListed=false; $('nameWrap').classList.add('hidden'); $('rosterWrap').classList.remove('hidden'); onPlayerChosen();
  });

  // ---- load roster ----
  fetch('player-data.json').then(function(r){ return r.json(); }).then(function(list){
    state.roster = Array.isArray(list) ? list : [];
    var sel=$('rosterSel'); var opts=['<option value="">Pick your name…</option>'];
    state.roster.slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); }).forEach(function(p){
      if(p.siteKey) state.byKey[p.siteKey]=p;
      var val = p.siteKey || '';
      if(val) opts.push('<option value="'+val+'">'+esc(p.name||'')+'</option>');
    });
    sel.innerHTML = opts.join('');
    // auto-select stored identity
    try {
      var pid = JSON.parse(localStorage.getItem('playerIdentity')||'null');
      if(pid && pid.siteKey && SK_RE.test(pid.siteKey) && state.byKey[pid.siteKey]){ sel.value = pid.siteKey; onPlayerChosen(); }
    } catch(e){}
  }).catch(function(){ $('rosterSel').innerHTML='<option value="">Roster unavailable; use "name isn’t listed"</option>'; });

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function clearStatus(){ var s=$('status'); s.textContent=''; s.className='status'; }
  function setStatus(msg, ok){ var s=$('status'); s.textContent=msg; s.className='status '+(ok?'ok':'err'); }

  // ---- submit ----
  $('saveBtn').addEventListener('click', function(){
    var id=currentIdentity();
    if(!id.siteKey && !id.name){ setStatus('Pick your name (or type it) first.', false); return; }
    var alliance=getSeg('alliance'), profession=getSeg('profession'), role=getSeg('role'), unit=getSeg('unit');
    var cp = parseFloat($('cpInput').value);
    if(!alliance){ setStatus('Pick your alliance.', false); return; }
    if(!profession){ setStatus('Pick your profession.', false); return; }
    if(!role){ setStatus('Attack, Defend, or Either?', false); return; }
    if(!(cp>0)){ setStatus('Enter your main march CP (in millions).', false); return; }
    if(cp>2000){ setStatus('That looks like raw CP. Enter it in millions, e.g. 73.5.', false); return; }
    if(!unit){ setStatus('Pick your main unit type.', false); return; }
    var body = { name:id.name, siteKey:id.siteKey, alliance:alliance, profession:profession, role:role, cpMillions:cp, unit:unit };
    if(profession==='CE'){
      var sw=getSeg('switch');
      if(!sw){ setStatus('Would you switch to Mechanical Master for this battle?', false); return; }
      body.willingSwitchMM = (sw==='yes');
    }
    var btn=$('saveBtn'); btn.disabled=true; setStatus('Saving…', true);
    fetch(API+'/svs/preference', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(res){
        btn.disabled=false;
        if(res.ok && res.d && res.d.ok){ setStatus('Saved. You can update anytime.', true); $('editingNote').classList.remove('hidden'); }
        else { setStatus((res.d && res.d.message) || ERR_MSG[res.d && res.d.error] || 'Could not save. Please try again.', false); }
      }).catch(function(){ btn.disabled=false; setStatus('Network error. Try again.', false); });
  });

  // ---- Google Translate flag switcher ----
  var LANGUAGES=[
    {code:'en',name:'English',flag:'🇺🇸'},{code:'zh-CN',name:'简体中文',flag:'🇨🇳'},
    {code:'zh-TW',name:'繁體中文',flag:'🇹🇼'},{code:'ko',name:'한국어',flag:'🇰🇷'},
    {code:'ja',name:'日本語',flag:'🇯🇵'},{code:'es',name:'Español',flag:'🇪🇸'},
    {code:'pt',name:'Português',flag:'🇧🇷'},{code:'fr',name:'Français',flag:'🇫🇷'},
    {code:'de',name:'Deutsch',flag:'🇩🇪'},{code:'ru',name:'Русский',flag:'🇷🇺'},
    {code:'ar',name:'العربية',flag:'🇸🇦'},{code:'vi',name:'Tiếng Việt',flag:'🇻🇳'},
    {code:'th',name:'ไทย',flag:'🇹🇭'},{code:'id',name:'Indonesia',flag:'🇮🇩'},{code:'tr',name:'Türkçe',flag:'🇹🇷'}
  ];
  window.applyLangToCombo=function(code,delay){ var a=0; var t=setInterval(function(){ var c=document.querySelector('.goog-te-combo'); if(c){ c.value=code; c.dispatchEvent(new Event('change')); clearInterval(t); updateLangBtn(code); } if(++a>30) clearInterval(t); }, delay||200); };
  function updateLangBtn(code){ var l=LANGUAGES.filter(function(x){return x.code===code;})[0]; var f=$('langFlag'), c=$('langCode'); if(l&&f){ f.textContent=l.flag; c.textContent='/'+code.split('-')[0]; } else if(f){ f.textContent='🌐'; c.textContent='/'+code; } }
  function detectCurrentLang(){ var m=document.cookie.match(/googtrans=\/en\/([a-zA-Z-]{2,10})/); return m&&m[1]?m[1]:'en'; }
  function selectLanguage(code){
    if(code==='en'){ document.cookie='googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=Lax; Secure'; document.cookie='googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.2864tw.com; SameSite=Lax; Secure'; sessionStorage.removeItem('svsLang'); closeLangModal(); location.reload(); return; }
    sessionStorage.setItem('svsLang',code); window.applyLangToCombo(code,200); closeLangModal();
  }
  function openLangModal(){
    var g=$('langGrid');
    if(g && !g.dataset.built){
      g.innerHTML=LANGUAGES.map(function(l){ return '<button type="button" class="lang-option" data-code="'+l.code+'"><span class="lang-flag">'+l.flag+'</span><span class="lang-name">'+l.name+'</span></button>'; }).join('');
      g.dataset.built='1';
      g.querySelectorAll('.lang-option').forEach(function(b){ b.addEventListener('click', function(){ selectLanguage(b.getAttribute('data-code')); }); });
    }
    $('langModal').classList.add('active');
  }
  function closeLangModal(){ $('langModal').classList.remove('active'); }
  $('langBtn').addEventListener('click', openLangModal);
  $('langClose').addEventListener('click', closeLangModal);
  $('langModal').addEventListener('click', function(e){ if(e.target===this) closeLangModal(); });
  setTimeout(function(){ if(!window._gtLoaded){ var b=$('langBtn'); if(b){ b.style.opacity='0.5'; b.style.cursor='default'; b.title='Translation unavailable'; b.removeEventListener('click', openLangModal); } } }, 15000);
  updateLangBtn(detectCurrentLang());
})();
function googleTranslateElementInit(){
  window._gtLoaded=true;
  new google.translate.TranslateElement({ pageLanguage:'en', autoDisplay:false }, 'google_translate_element');
  var p=sessionStorage.getItem('svsLang'); if(p && p!=='en' && window.applyLangToCombo) window.applyLangToCombo(p,250);
}
</script>
<script src="https://translate.googleapis.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
