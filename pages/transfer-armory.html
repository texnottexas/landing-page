<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Armory - Server 2864</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' https://knight-cdn.akamaized.net https://h5.topwargame.com https://raw.githubusercontent.com data:; connect-src 'self' https://fight-report-va.oss-accelerate.aliyuncs.com https://fight-report.oss-accelerate.aliyuncs.com; base-uri 'self'; form-action 'none'; object-src 'none';">
<style>
  :root{--bg:#0d1117;--surface:#161b22;--card:#1c2128;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#79c0ff;--green:#3fb950;--red:#f85149;--yellow:#d29922}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:1rem}
  .ta-wrap{max-width:900px;margin:0 auto}
  .ta-status{color:var(--muted);font-size:.85rem;padding:1rem 0}
  .ta-status.error{color:#f85149}
  .ta-overview{display:flex;gap:.8rem;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.9rem 1rem;margin-bottom:1rem}
  .ta-ov-avatar{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--surface)}
  .ta-ov-name{font-size:1.05rem;font-weight:700}
  .ta-ov-sub{font-size:.75rem;color:var(--muted)}
  .ta-ov-cp{font-size:.85rem;color:var(--accent);font-weight:600;margin-top:.15rem}
  .ta-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.9rem 1rem;margin-bottom:1rem}
  .ta-section-title{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:.6rem}
  .ta-empty{color:var(--muted);font-size:.8rem}
  .ta-picker button{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.6rem .8rem;margin-bottom:.5rem;cursor:pointer}
  .ta-picker button:hover{border-color:var(--accent)}

  /* Attributes modal (copied from battle-report.html:354-390) */
  .attr-modal-body { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media(max-width:700px){ .attr-modal-body { grid-template-columns: 1fr; } }
  .attr-side-label { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: .5rem; }
  .attr-hero-card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; margin-bottom: .5rem; overflow: hidden; }
  .attr-hero-header { display: flex; align-items: center; gap: .5rem; padding: .5rem .65rem; cursor: pointer; background: var(--surface); }
  .attr-hero-header:hover { background: #1c2128; }
  .attr-hero-hname { font-size: .82rem; font-weight: 600; flex: 1; }
  .attr-hero-lv { font-size: .72rem; color: var(--muted); }
  .attr-hero-body { padding: .5rem .65rem; display: none; }
  .attr-hero-body.open { display: block; }
  .attr-excl { display: flex; align-items: center; gap: .35rem; margin-bottom: .4rem; padding: .25rem .4rem; background: rgba(88,166,255,.08); border-radius: 4px; }
  .attr-excl img { width: 22px; height: 22px; border-radius: 3px; }
  .attr-excl-name { font-size: .76rem; color: var(--accent); }
  .attr-excl-lv { font-size: .72rem; color: var(--muted); margin-left: auto; }
  .attr-skills-row { display: flex; flex-wrap: wrap; gap: .25rem; margin-bottom: .5rem; }
  .attr-skill-chip { display: flex; align-items: center; gap: .2rem; background: var(--surface); border-radius: 4px; padding: .15rem .3rem; }
  .attr-skill-chip img { width: 18px; height: 18px; border-radius: 2px; }
  .attr-skill-lv { font-size: .67rem; color: var(--muted); }
  .attr-gear-slot { margin-bottom: .4rem; border-top: 1px solid var(--border); padding-top: .35rem; }
  .attr-gear-slot:first-of-type { border-top: none; padding-top: 0; }
  .attr-slot-head { display: flex; align-items: center; gap: .35rem; margin-bottom: .25rem; }
  .attr-slot-name { font-size: .72rem; color: var(--muted); }
  .attr-rune-wrap { display: flex; align-items: center; gap: .25rem; }
  .attr-rune-wrap img { width: 16px; height: 16px; }
  .attr-rune-name { font-size: .71rem; color: #e3b341; }
  .attr-stats { display: flex; flex-direction: column; gap: .15rem; margin-top: .2rem; }
  .attr-stat-row { display: flex; align-items: center; gap: .35rem; font-size: .71rem; }
  .attr-stat-name { color: var(--muted); min-width: 110px; flex-shrink: 0; font-size: .68rem; }
  .attr-stat-val { font-weight: 600; }
  .attr-stat-bar { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .attr-stat-fill { height: 100%; border-radius: 2px; }
  .attr-stat-enh { font-size: .65rem; font-weight: 600; white-space: nowrap; }
  .attr-stat-enh.active { color: #7ee787; opacity: .55; }
  .attr-stat-enh.inactive { color: var(--muted); opacity: .6; }
  .attr-stat-total { font-size: .63rem; color: #56d364; white-space: nowrap; text-shadow: 0 0 6px rgba(86,211,100,0.4); }
  .attr-enh { font-size: .69rem; color: var(--muted); margin-top: .2rem; }
  .attr-enh span { color: #56d364; }

  /* Enigma Beasts modal (copied from battle-report.html:393-485) */
  .enigma-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: .75rem; }
  @media(max-width:700px){ .enigma-grid { grid-template-columns: 1fr; } }
  .enigma-side-label { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: .4rem; }
  .enigma-summary { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .5rem; font-size: .72rem; }
  .enigma-summary-item { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: .2rem .5rem; }
  .enigma-summary-item strong { color: var(--accent); }
  .enigma-field { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; margin-bottom: .5rem; overflow: hidden; }
  .enigma-field-hdr { display: flex; align-items: center; gap: .4rem; padding: .4rem .6rem; background: var(--surface); cursor: pointer; }
  .enigma-field-hdr:hover { background: #1c2128; }
  .enigma-field-name { font-size: .78rem; font-weight: 600; flex: 1; }
  .enigma-field-badge { font-size: .6rem; border-radius: 3px; padding: .1rem .35rem; font-weight: 700; }
  .enigma-field-badge.active { background: var(--green); color: var(--bg); }
  .enigma-field-badge.inactive { background: var(--border); color: var(--muted); }
  .enigma-field-toggle { color: var(--muted); font-size: .6rem; }
  .enigma-field-body { padding: .35rem .5rem; display: none; }
  .enigma-field-body.open { display: block; }
  .enigma-slot { display: flex; align-items: center; gap: .4rem; padding: .3rem .2rem; border-bottom: 1px solid var(--border); }
  .enigma-slot:last-child { border-bottom: none; }
  .enigma-slot-num { font-size: .65rem; color: var(--muted); min-width: 18px; text-align: center; }
  .enigma-beast-icon-wrap { position: relative; width: 28px; height: 28px; flex-shrink: 0; }
  .enigma-beast-icon { width: 28px; height: 28px; border-radius: 4px; object-fit: cover; background: var(--card); }
  .enigma-beast-icon.q5 { border: 1.5px solid #e3b341; }
  .enigma-beast-icon.q4 { border: 1.5px solid #a371f7; }
  .enigma-elem-overlay { position: absolute; bottom: -2px; right: -2px; width: 14px; height: 14px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; background: var(--bg); border: 1px solid var(--border); }
  .enigma-beast-info { flex: 1; min-width: 0; }
  .enigma-beast-name { font-size: .72rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .enigma-beast-stars { font-size: .6rem; color: #e3b341; letter-spacing: -.02em; }
  .enigma-beast-lv { font-size: .65rem; color: var(--muted); }
  .enigma-beast-main { font-size: .64rem; color: var(--accent); margin-top: .1rem; }
  .enigma-slot-buffs { display: flex; flex-wrap: wrap; gap: .15rem; margin-top: .15rem; }
  .enigma-slot-buff { font-size: .62rem; background: rgba(121,192,255,.08); border-radius: 3px; padding: .1rem .3rem; color: var(--text); }
  .enigma-empty-slot { font-size: .7rem; color: var(--muted); font-style: italic; padding: .2rem 0; }
  .enigma-no-data { font-size: .78rem; color: var(--muted); text-align: center; padding: 1.5rem; }
  .enigma-field-buffs { display: flex; flex-wrap: wrap; gap: .2rem; padding: .25rem .5rem; border-top: 1px solid var(--border); background: rgba(121,192,255,.03); }
  .enigma-field-buff-chip { font-size: .62rem; color: var(--accent); }
  .ta-decor-row{display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-top:1px solid var(--border);font-size:.8rem}
  .ta-decor-row:first-child{border-top:none}
  .ta-decor-row img{width:28px;height:28px;object-fit:contain}
  .ta-decor-name{flex:0 0 auto;color:var(--text)}
  .ta-decor-lvl{color:var(--accent)}
  .ta-decor-buff{color:var(--muted);margin-left:auto;text-align:right}
  /* Base Skin cells (copied from battle-report.html:256-289) */
  .bskin-header-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: .5rem; padding: .5rem 1rem .4rem; align-items: center; }
  .bskin-header-row .bskin-left { text-align: right; font-size: .85rem; font-weight: 700; }
  .bskin-header-row .bskin-center { text-align: center; font-size: .72rem; color: var(--muted); }
  .bskin-header-row .bskin-right { text-align: left; font-size: .85rem; font-weight: 700; }
  .bskin-section { margin-bottom: .5rem; }
  .bskin-section-title { font-size: .7rem; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; padding: .5rem 1rem .25rem; border-top: 1px solid var(--border); margin-top: .25rem; cursor: pointer; user-select: none; }
  .bskin-section-title .bskin-toggle { display: inline-block; width: 1em; font-size: .65rem; margin-right: .25rem; transition: transform .15s; }
  .bskin-section-title.collapsed .bskin-toggle { transform: rotate(-90deg); }
  .bskin-section-content { overflow: hidden; }
  .bskin-section-content.collapsed { display: none; }
  .bskin-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: .25rem; padding: 0 .75rem; }
  .bskin-cell { display: flex; align-items: center; gap: .35rem; padding: .3rem .25rem; font-size: .78rem; }
  .bskin-cell.right { justify-content: flex-end; flex-direction: row-reverse; }
  .bskin-cell.empty { opacity: .3; }
  .bskin-icon { width: 44px; height: 44px; border-radius: 5px; object-fit: cover; background: var(--card); flex-shrink: 0; border: 1px solid var(--border); }
  .bskin-icon.equipped { border-color: var(--yellow); box-shadow: 0 0 6px rgba(210,153,34,.4); }
  .bskin-info { display: flex; flex-direction: column; min-width: 0; }
  .bskin-name { font-weight: 500; font-size: .75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
  .bskin-badge { font-size: .6rem; font-weight: 600; }
  .bskin-badge.equipped { color: var(--yellow); }
  .bskin-badge.owned { color: var(--green); }
  .bskin-badge.notowned { color: var(--muted); }
  .bskin-label { text-align: center; font-size: .72rem; color: var(--muted); padding: .3rem .15rem; align-self: center; white-space: nowrap; }
  .bskin-summary { display: grid; grid-template-columns: 1fr auto 1fr; gap: .5rem; padding: .4rem 1rem; align-items: center; border-bottom: 1px solid var(--border); margin-bottom: .25rem; }
  .bskin-summary .bskin-left { text-align: right; font-size: .85rem; font-weight: 600; }
  .bskin-summary .bskin-center { text-align: center; font-size: .72rem; color: var(--muted); }
  .bskin-summary .bskin-right { text-align: left; font-size: .85rem; font-weight: 600; }
  .bskin-att { color: var(--green); }
  .bskin-def { color: var(--red); }
  .bskin-placeholder { width: 44px; height: 44px; border-radius: 5px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1rem; color: var(--muted); flex-shrink: 0; }
  @media (max-width: 640px) {
    .bskin-icon, .bskin-placeholder { width: 36px; height: 36px; }
    .bskin-name { max-width: 100px; font-size: .7rem; }
    .bskin-cell { gap: .25rem; padding: .2rem .15rem; }
  }
  .ta-bases-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem;margin-top:.4rem}
</style>
</head>
<body>
<div class="ta-wrap">
  <div id="ta-status" class="ta-status">Loading report...</div>
  <div id="ta-body"></div>
</div>
<script src="report-render.js"></script>
<script>
(function () {
  'use strict';
  var R = window.ReportRender;
  var params = new URLSearchParams(location.search);
  var id = (params.get('id') || '').trim();
  var sk = (params.get('sk') || '').trim().toLowerCase();
  var nameOverride = params.get('n') || '';
  var serverOverride = params.get('sv') || '';
  var statusEl = document.getElementById('ta-status');
  var bodyEl = document.getElementById('ta-body');

  function fail(msg) { statusEl.textContent = msg; statusEl.className = 'ta-status error'; }

  if (!id || !/^\d{14,22}$/.test(id)) { fail('Missing or invalid report id.'); return; }

  // Collect {player, side, index} for every player on both sides.
  function allPlayers(battle) {
    var out = [];
    ['attacker', 'defender'].forEach(function (sideName) {
      var side = battle[sideName];
      var players = (side && side.players) || [];
      var tag = sideName === 'attacker' ? 'att' : 'def';
      players.forEach(function (p, i) { out.push({ player: p, side: tag, index: i }); });
    });
    return out;
  }

  // Render the chosen player: Overview now; sections wired in later tasks.
  function renderPlayer(battle, entry) {
    statusEl.textContent = '';
    bodyEl.innerHTML = '';
    var march = (battle.fightMarches && battle.fightMarches[0]) || null;
    bodyEl.appendChild(R.renderOverview(entry.player, entry.side, march, nameOverride, serverOverride));
    // SECTION HOOKS (later tasks append here):
    appendSection('Heroes & Gear', R.buildHeroGearSide([entry.player], '', ''));
    appendSection('Enigma Beasts', R.buildEnigmaSide([entry.player], ''));
    appendSection('Decorations', R.buildDecorationSide(entry.player));
    appendSection('Bases', R.buildBaseSkinSide(entry.player));
  }

  function appendSection(title, node) {
    var sec = R.el('div', { className: 'ta-section' }, [
      R.el('div', { className: 'ta-section-title' }, title),
      node || R.el('div', { className: 'ta-empty' }, 'No data in this report.')
    ]);
    bodyEl.appendChild(sec);
  }
  window._taAppendSection = appendSection; // used by section-render steps

  function showPicker(battle, entries) {
    statusEl.textContent = 'Could not auto-identify this player. Choose who to view:';
    bodyEl.innerHTML = '';
    var wrap = R.el('div', { className: 'ta-picker' });
    entries.forEach(function (e) {
      var pi = R.getPlayerInfoRaw(e.player);
      var label = (pi.username || ('Player ' + (e.index + 1))) + ' (' + (e.side === 'att' ? 'attacker' : 'defender') + ')';
      var btn = R.el('button', {}, label);
      btn.addEventListener('click', function () { renderPlayer(battle, e); });
      wrap.appendChild(btn);
    });
    bodyEl.appendChild(wrap);
  }

  R.fetchReportResponse(id)
    .then(function (r) { if (!r.ok) throw new Error('Report not found (HTTP ' + r.status + ')'); return r.json(); })
    .then(function (data) {
      if (!data.battle) throw new Error('Invalid report format');
      R.loadAwakeningRef();
      var entries = allPlayers(data.battle);
      if (!entries.length) throw new Error('No players in report');
      if (!sk) { showPicker(data.battle, entries); return; }
      // Hash each player's uid; first match wins.
      Promise.all(entries.map(function (e) { return R.sha256hex(e.player.uid == null ? '' : e.player.uid); }))
        .then(function (hashes) {
          var idx = hashes.indexOf(sk);
          if (idx === -1) { showPicker(data.battle, entries); return; }
          renderPlayer(data.battle, entries[idx]);
        });
    })
    .catch(function (err) { fail(err.message); });
})();
</script>
</body>
</html>
