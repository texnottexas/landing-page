<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https://translate.googleapis.com https://translate.google.com https://www.gstatic.com https://translate-pa.googleapis.com; style-src 'unsafe-inline' https://translate.googleapis.com https://www.gstatic.com; connect-src 'self' https://push-worker.27tb8s6fct.workers.dev https://translate.googleapis.com https://translate-pa.googleapis.com https://translate.google.com; img-src 'self' data: https://i.ibb.co https://knight-cdn.akamaized.net https://h5.topwargame.com https://translate.google.com https://translate.googleapis.com https://www.gstatic.com https://www.google.com https://fonts.gstatic.com; frame-src https://translate.google.com; object-src 'none'; base-uri 'self'; form-action 'none'; font-src https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self';" />
  <link rel="manifest" href="/manifest.json">
  <title>Titan Canyon - Server 2864</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #0d1117; --bg2: #161b22; --card: #1c2128; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #79c0ff;
      --army: #3fb950; --navy: #388bfd; --air: #d29922;
      --ce: #e3b341; --mm: #bc8cff; --tag: #21262d;
      --green: #3fb950; --gold: #e3b341; --red: #f85149;
      --shadow: rgba(0,0,0,.45);
    }
    :root[data-theme="light"] {
      --bg: #f6f8fa; --bg2: #ffffff; --card: #ffffff; --border: #d0d7de;
      --text: #1f2328; --muted: #656d76; --accent: #1f75d4;
      --army: #1a7f37; --navy: #0550ae; --air: #9a6700;
      --ce: #7d4e00; --mm: #6e40c9; --tag: #eaeef2;
      --green: #1a7f37; --gold: #9a6700; --red: #cf222e;
      --shadow: rgba(140,149,159,.2);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    header {
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: .85rem 2rem; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 200; box-shadow: 0 1px 0 var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 1.2rem; }
    .header-title { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    .header-sub { font-size: .75rem; color: var(--muted); margin-top: 3px; }
    .nav-link {
      font-size: .8rem; color: var(--muted); text-decoration: none; padding: .35rem .8rem;
      border: 1px solid var(--border); border-radius: 7px; transition: all .15s;
    }
    .nav-link:hover { border-color: var(--accent); color: var(--accent); }
    .hdr-btn {
      background: var(--tag); border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: .38rem .9rem; cursor: pointer; font-size: .8rem;
      display: flex; align-items: center; gap: .4rem; transition: all .15s; white-space: nowrap;
    }
    .hdr-btn:hover { border-color: var(--accent); color: var(--accent); }

    main { max-width: 920px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.4rem 1.5rem; margin-bottom: 1.25rem;
    }
    .card h2 {
      font-size: .72rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .07em; margin-bottom: 1rem;
    }
    .muted { color: var(--muted); }
    .row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }

    /* Identity bar */
    .id-bar { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; justify-content: space-between; }
    .id-who { display: flex; align-items: center; gap: .8rem; }
    .id-avatar {
      width: 46px; height: 46px; border-radius: 50%; background: var(--tag);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.1rem; color: var(--accent);
      position: relative; overflow: hidden; flex-shrink: 0;
    }
    .id-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .id-name { font-size: 1.15rem; font-weight: 700; }
    .id-meta { font-size: .78rem; color: var(--muted); margin-top: 2px; }
    .pill {
      display: inline-flex; align-items: center; gap: .3rem; padding: .15rem .55rem;
      border-radius: 999px; font-size: .68rem; font-weight: 600; border: 1px solid var(--border);
      background: var(--tag); color: var(--muted);
    }
    .pill.dog { color: var(--army); border-color: color-mix(in srgb, var(--army) 45%, var(--border)); }
    .pill.mss { color: var(--navy); border-color: color-mix(in srgb, var(--navy) 45%, var(--border)); }
    .pill.pru { color: var(--air); border-color: color-mix(in srgb, var(--air) 45%, var(--border)); }
    .pill.cat { color: var(--mm); border-color: color-mix(in srgb, var(--mm) 45%, var(--border)); }

    select, .btn {
      font-family: inherit; font-size: .85rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg2); color: var(--text);
      padding: .5rem .8rem; cursor: pointer; transition: all .15s;
    }
    select:hover, .btn:hover { border-color: var(--accent); }
    .btn-primary {
      background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
      padding: .7rem 1.2rem; font-size: .9rem;
    }
    .btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
    /* Registration CTA — glowing border, dark bg, light text (mirrors the landing-page Armory hero card) */
    @keyframes titan-glow {
      0%   { border-color: var(--accent); box-shadow: 0 0 15px rgba(121,192,255,.25); }
      33%  { border-color: var(--army);   box-shadow: 0 0 15px rgba(63,185,80,.25); }
      66%  { border-color: var(--air);    box-shadow: 0 0 15px rgba(210,153,34,.25); }
      100% { border-color: var(--accent); box-shadow: 0 0 15px rgba(121,192,255,.25); }
    }
    .btn-register {
      display: inline-block; text-decoration: none; background: var(--bg2); color: var(--text);
      font-weight: 800; font-size: 1rem; letter-spacing: .01em; padding: .85rem 1.8rem;
      border-radius: 12px; border: 2px solid var(--accent);
      animation: titan-glow 6s ease-in-out infinite; transition: transform .2s, box-shadow .2s;
    }
    .btn-register:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(121,192,255,.3); animation: none; border-color: var(--accent); color: var(--text); }
    .btn-block { display: block; width: 100%; text-align: center; }
    a.btn { text-decoration: none; display: inline-flex; align-items: center; gap: .45rem; justify-content: center; }
    .btn-cancel { color: var(--muted); }
    .btn-cancel:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
    .btn-cancel:disabled { opacity: .45; cursor: not-allowed; }
    .cancel-note { font-size: .72rem; color: var(--muted); text-align: center; margin-top: .4rem; }

    .kv { display: grid; grid-template-columns: max-content 1fr; gap: .45rem 1rem; font-size: .88rem; }
    .kv dt { color: var(--muted); }
    .kv dd { font-weight: 600; }

    .squad-head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin-bottom: .2rem; }
    .squad-name { font-size: 1.3rem; font-weight: 800; color: var(--accent); }
    .squad-time { font-size: .9rem; color: var(--text); }
    .squad-time .et { color: var(--muted); font-size: .8rem; }
    .your-pos {
      display: inline-flex; align-items: center; gap: .4rem; margin-top: .8rem;
      padding: .45rem .8rem; border-radius: 8px; background: var(--tag); border: 1px solid var(--border);
      font-size: .85rem;
    }
    .your-pos b { color: var(--accent); }

    .swap-banner {
      margin-top: 1rem; padding: .8rem 1rem; border-radius: 10px;
      background: color-mix(in srgb, var(--gold) 12%, var(--card));
      border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--border));
      font-size: .85rem; color: var(--text); display: flex; gap: .6rem; align-items: flex-start;
    }
    .swap-banner svg { flex-shrink: 0; margin-top: 1px; color: var(--gold); }
    .swap-deadline { margin-top: .55rem; padding-top: .55rem; border-top: 1px solid color-mix(in srgb, var(--gold) 28%, var(--border)); font-size: .8rem; }
    .swap-deadline.closed { color: var(--muted); border-top-color: var(--border); }

    .mates { list-style: none; display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .9rem; }
    .mates li {
      font-size: .78rem; padding: .28rem .6rem; border-radius: 7px;
      background: var(--bg2); border: 1px solid var(--border);
    }
    .mates li.me { border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .role-tag { font-size: .62rem; font-weight: 700; padding: .05rem .35rem; border-radius: 4px; margin-left: .3rem; }
    .role-tag.ce { background: rgba(227,179,65,.13); color: var(--ce); }
    .role-tag.mm { background: rgba(188,140,255,.13); color: var(--mm); }

    .cta-wrap { text-align: center; padding: 1rem 0 .25rem; }
    .cta-sub { font-size: .85rem; color: var(--muted); margin-top: .8rem; }
    .status-line { font-size: .82rem; color: var(--muted); margin-bottom: 1rem; }
    .status-line b { color: var(--text); }
    .countdown { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
    .links-row { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin-top: .25rem; }
    @media (max-width: 540px) { .links-row { grid-template-columns: 1fr; } .kv { grid-template-columns: 1fr; gap: .15rem; } .kv dt { margin-top: .5rem; } }

    .loading { text-align: center; color: var(--muted); padding: 3rem 1rem; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    @media (max-width: 640px) {
      main { padding: 1rem 1rem 2rem; }
      header { padding: .7rem 1rem; flex-wrap: wrap; gap: .5rem; }
    }

    .site-footer { text-align: center; padding: 1.5rem 2rem; font-size: .75rem; color: var(--muted); border-top: 1px solid var(--border); }
    .site-footer a { color: var(--accent); text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; }

    /* Google Translate overrides */
    body { top: 0 !important; }
    body > .skiptranslate { display: none !important; }
    #google_translate_element { position: absolute; left: -9999px; opacity: 0; pointer-events: none; }
    .lang-btn {
      background: var(--tag); border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: .38rem .7rem; cursor: pointer; font-size: .8rem;
      display: flex; align-items: center; gap: .35rem; font-family: inherit;
      font-weight: 600; letter-spacing: .02em; white-space: nowrap; transition: border-color .2s;
    }
    .lang-btn:hover { border-color: var(--accent); color: var(--text); }
    .lang-modal-overlay { display: none; position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 1rem; }
    .lang-modal-overlay.active { display: flex; }
    .lang-modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; max-width: 400px; width: 100%; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 32px var(--shadow); }
    .lang-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .lang-modal-title { font-size: 1rem; font-weight: 700; color: var(--text); }
    .lang-modal-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.2rem; padding: .2rem; line-height: 1; }
    .lang-modal-close:hover { color: var(--text); }
    .lang-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; }
    .lang-option { display: flex; align-items: center; gap: .5rem; padding: .5rem .65rem; border-radius: 8px; border: 1px solid transparent; background: var(--bg); cursor: pointer; font-size: .82rem; color: var(--text); font-family: inherit; transition: border-color .15s, background .15s; }
    .lang-option:hover { border-color: var(--accent); background: var(--tag); }
    .lang-option.active { border-color: var(--accent); background: var(--tag); }
    .lang-option .lang-flag { font-size: 1.1rem; }
    .lang-option .lang-name { flex: 1; }
    /* "Who are you?" identity prompt (mirrors the homepage) */
    .who-overlay { display:none; position:fixed; inset:0; z-index:500; background:rgba(0,0,0,.7); align-items:center; justify-content:center; padding:1rem; }
    .who-overlay.active { display:flex; }
    .who-modal { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1.5rem; max-width:420px; width:100%; max-height:82vh; overflow-y:auto; box-shadow:0 18px 50px -18px rgba(0,0,0,.85); }
    .who-modal h2 { font-size:1.2rem; font-weight:800; margin-bottom:.4rem; }
    .who-sub { font-size:.82rem; color:var(--muted); margin-bottom:1rem; }
    .who-search { width:100%; padding:.65rem .8rem; border-radius:10px; border:1px solid var(--border); background:var(--bg2); color:var(--text); font-size:.9rem; margin-bottom:.7rem; outline:none; font-family:inherit; }
    .who-search:focus { border-color:var(--accent); }
    .who-list { max-height:46vh; overflow-y:auto; display:flex; flex-direction:column; gap:.3rem; }
    .who-item { text-align:left; padding:.55rem .7rem; border-radius:8px; border:1px solid transparent; background:var(--bg2); color:var(--text); cursor:pointer; font-size:.88rem; display:flex; justify-content:space-between; align-items:center; gap:.5rem; font-family:inherit; }
    .who-item:hover { border-color:var(--accent); }
    .who-item .a { color:var(--muted); font-size:.72rem; }
    .who-skip { margin-top:.9rem; width:100%; background:none; border:none; color:var(--muted); cursor:pointer; font-size:.82rem; padding:.4rem; font-family:inherit; }
    .who-skip:hover { color:var(--text); }
    .bell-btn{background:none;border:1px solid var(--border,#30363d);color:var(--text,#e6edf3);border-radius:8px;width:36px;height:32px;cursor:pointer;font-size:1rem}
    .bell-btn.subscribed{border-color:var(--accent,#79c0ff)}
    .tc-install-banner{position:fixed;left:1rem;right:1rem;bottom:1rem;z-index:2000;display:flex;align-items:center;gap:.6rem;background:var(--card,#1c2128);border:1px solid var(--border,#30363d);border-radius:12px;padding:.7rem .9rem;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:520px;margin:0 auto}
    .tc-install-text{display:flex;flex-direction:column;flex:1;font-size:.8rem;color:var(--muted,#8b949e)}
    .tc-install-text strong{color:var(--accent,#79c0ff);font-size:.9rem}
    .tc-install-steps{font-size:.72rem;color:var(--muted,#8b949e);margin-top:.25rem}
    .tc-install-steps strong{font-size:inherit}
    .tc-install-note{font-size:.68rem;color:var(--muted,#8b949e);margin-top:.2rem}
    .tc-install-btn{background:var(--accent,#79c0ff);color:#0d1117;border:none;border-radius:8px;padding:.45rem 1rem;font-weight:700;cursor:pointer;font-family:inherit}
    .tc-install-dismiss{background:none;border:none;color:var(--muted,#8b949e);font-size:1.3rem;cursor:pointer;line-height:1}

    /* --- Battle-map preview (ported from titan-battle-plan.html, in-game 8x8 diamond) --- */
    .sq-map-head { display:flex; align-items:baseline; justify-content:space-between; gap:.5rem; margin:1rem 0 .5rem; }
    .sq-map-head .t { font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; }
    .sq-map-head a { font-size:.72rem; color:var(--accent); text-decoration:none; }
    .sq-map-head a:hover { text-decoration:underline; }
    .dm-wrap { width:100%; max-width:340px; aspect-ratio:1; margin:0 auto;
      display:flex; align-items:center; justify-content:center;
      background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--navy) 10%, transparent), transparent 62%);
      border-radius:10px; container-type:inline-size; }
    .dm-grid { width:70.5%; aspect-ratio:1; display:grid;
      grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr); gap:2px; transform:rotate(45deg); }
    .dm-cell { border-radius:3px; background:var(--bg2); border:1px solid color-mix(in srgb, var(--border) 60%, transparent); }
    .dm-zone { background:var(--card); display:flex; align-items:center; justify-content:center; }
    .dm-zone.empty { opacity:.55; }
    .dm-zc { transform:rotate(-45deg); text-align:center; line-height:1.15; width:23cqi; }
    .dm-zc .num { font-weight:800; font-size:4.6cqi; display:block; }
    .dm-zc .role { font-size:2.1cqi; font-weight:600; color:var(--muted); display:block; margin-top:1px; }
    .dm-zc .player { font-size:2.5cqi; font-weight:700; display:block; margin-top:3px;
      background:color-mix(in srgb, var(--text) 8%, transparent); border:1px solid var(--border);
      color:var(--text); border-radius:999px; padding:1px 7px; width:fit-content; margin-left:auto; margin-right:auto;
      max-width:22cqi; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .zCE { border:2px solid var(--ce); box-shadow:0 0 14px color-mix(in srgb, var(--ce) 25%, transparent), inset 0 0 12px color-mix(in srgb, var(--ce) 8%, transparent); }
    .zUC { border:2px solid var(--army); box-shadow:0 0 14px color-mix(in srgb, var(--army) 22%, transparent), inset 0 0 12px color-mix(in srgb, var(--army) 7%, transparent); }
    .zMM { border:2px solid var(--mm); box-shadow:0 0 14px color-mix(in srgb, var(--mm) 22%, transparent), inset 0 0 12px color-mix(in srgb, var(--mm) 7%, transparent); }
    .zCE .num { color:var(--ce); } .zUC .num { color:var(--army); } .zMM .num { color:var(--mm); }
    .dm-hub { background:var(--bg); border:1px dashed var(--navy);
      box-shadow:0 0 18px color-mix(in srgb, var(--navy) 20%, transparent); display:flex; align-items:center; justify-content:center; }
    .dm-hub .dm-zc { color:var(--accent); font-size:2.2cqi; font-weight:700; width:26cqi; }
    .dm-fac { display:flex; align-items:center; justify-content:center; font-size:2.9cqi; opacity:.85; }
    .dm-fac span { transform:rotate(-45deg); }
    .dm-fac.fU span { color:var(--army); font-weight:800; font-size:3.3cqi; }
    .me-zone { outline:2px solid var(--accent); outline-offset:2px; animation:mePulse 2.4s ease-in-out infinite; }
    .me-zone .player { background:var(--accent) !important; color:var(--bg) !important; border-color:var(--accent) !important; }
    @keyframes mePulse { 0%,100%{ outline-color:color-mix(in srgb,var(--accent) 50%,transparent);} 50%{ outline-color:var(--accent);} }
    .dm-legend { margin-top:.55rem; display:flex; gap:.75rem; flex-wrap:wrap; justify-content:center; font-size:.64rem; color:var(--muted); }
    .dm-legend .k { display:inline-flex; align-items:center; gap:.3rem; }
    .dm-legend .sw { width:8px; height:8px; border-radius:2px; display:inline-block; }
    @media (prefers-reduced-motion:reduce){ .me-zone{ animation:none; } }

    /* --- Training completion badges --- */
    .badges-head { display:flex; align-items:baseline; gap:.5rem; }
    .badges-head h2 { margin:0; }
    .badges-head .cnt { font-size:.7rem; color:var(--muted); font-weight:600; }
    .badge-row { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.75rem; }
    .tbadge { display:flex; flex-direction:column; align-items:center; gap:.25rem; width:3.7rem; text-align:center; }
    .tbadge .ic { width:2.4rem; height:2.4rem; border-radius:50%; display:grid; place-items:center;
      background:var(--tag); border:1px solid var(--border); color:var(--muted); filter:grayscale(1); opacity:.5; }
    .tbadge .ic svg { width:1.3rem; height:1.3rem; }
    .tbadge .ic img { width:1.5rem; height:1.5rem; object-fit:contain; }
    .tbadge .lbl { font-size:.6rem; color:var(--muted); line-height:1.15; }
    .tbadge.earned .ic { filter:none; opacity:1; color:var(--army);
      border-color:color-mix(in srgb,var(--army) 55%,var(--border));
      background:color-mix(in srgb,var(--army) 16%,var(--tag)); box-shadow:0 0 10px color-mix(in srgb,var(--army) 22%,transparent); }
    .tbadge.earned .lbl { color:var(--text); font-weight:600; }
    .badges-note { font-size:.7rem; color:var(--muted); margin-top:.75rem; }
    .badges-note a { color:var(--accent); text-decoration:none; }
    .badges-note a:hover { text-decoration:underline; }

    /* --- Tighter mobile layout: condense the top-to-content stack --- */
    @media (max-width:600px) {
      main { padding:.9rem .85rem 2.25rem; }
      .card { padding:.95rem 1rem; margin-bottom:.7rem; }
      .card h2 { margin-bottom:.7rem; }
      .badge-row { gap:.2rem; margin-top:.6rem; flex-wrap:nowrap; }
      .tbadge { width:2.95rem; gap:.2rem; }
      .tbadge .ic { width:2.05rem; height:2.05rem; }
      .tbadge .ic svg { width:1.1rem; height:1.1rem; }
      .tbadge .ic img { width:1.25rem; height:1.25rem; }
      .tbadge .lbl { font-size:.56rem; }
      .dm-wrap { max-width:300px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div>

<script>
var TITAN_API = 'https://push-worker.27tb8s6fct.workers.dev';

// Canonical squad metadata — alliance + timeslot per squad name. Mirrors the
// worker's SQUAD_NAMES map (titan-alloc.js). Slot ids are hours offset from the
// noon-ET reset on the battle Saturday.
var SQUAD_META = {
  'Dog Squad A': { alliance: 'DOG',  slot: '+10' },
  'Dog Squad B': { alliance: 'DOG',  slot: '-2'  },
  'MSS Squad A': { alliance: 'MSS',  slot: '+2'  },
  'MSS Squad B': { alliance: 'MSS',  slot: '+10' },
  'PRU Squad A': { alliance: 'PRU',  slot: '-6'  },
  'DGen Squad A': { alliance: 'DGen', slot: '+2'  },
  'DGen Squad B': { alliance: 'DGen', slot: '-2'  }
};
var RESET_HOUR_ET = 12;
// DGen = rebrand of the alliance formerly labelled Cat+; legacy key kept so any
// residual pre-rebrand data still displays the new brand.
var ALL_DISPLAY = { 'DOG': 'Dog', 'MSS': 'MSS', 'PRU': 'PRU', 'DGen': 'DGen', 'Cat+': 'DGen' };
var SUPPORT_BUCKETS = ['goon', 'standby', 'hover', 'crystal'];
var BUCKET_LABEL = { goon: 'Goon Squad', standby: 'Standby', hover: 'Hover Captain', crystal: 'Crystal Lab Captain' };

var ESC_MAP = { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC_MAP[c]; }); }
function normName(s) { return String(s == null ? '' : s).toLowerCase().trim(); }
function allianceDisplay(a) { return ALL_DISPLAY[a] || a || ''; }
function allianceClass(a) { return a === 'DOG' ? 'dog' : a === 'MSS' ? 'mss' : a === 'PRU' ? 'pru' : (a === 'DGen' || a === 'Cat+') ? 'cat' : ''; }
function normAll(a) { var u = String(a == null ? '' : a).trim().toUpperCase(); if (u === 'DOG') return 'DOG'; if (u === 'MSS') return 'MSS'; if (u === 'PRU') return 'PRU'; if (u === 'CAT' || u === 'CAT+' || u === 'DGEN') return 'DGen'; return u; }
// CE / MM(-uc) profession tag for a squad member, from the battleplan meta. '' if unknown.
function memberTag(meta, name) {
  var m = (meta && meta[name]) || null;
  if (!m || !m.prof) return '';
  if (m.prof === 'MM') return '<span class="role-tag mm">MM' + (m.uc != null ? '-' + m.uc : '') + '</span>';
  return '<span class="role-tag ce">CE</span>';
}
// Resolve a player's avatarurl to an image URL (full URLs pass through; sprite
// keys map to the Top War headpic CDN). Mirrors the homepage resolver.
function resolveAvatar(url) {
  if (!url || typeof url !== 'string') return null;
  if (url.indexOf('http') === 0) return url;
  return 'https://h5.topwargame.com/DynRes/images/headpic/' + url + '.png?t=21.jpg';
}

function toggleTheme() {
  var d = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', d ? 'light' : 'dark');
  document.getElementById('themeIcon').textContent = d ? '🌙' : '☀️';
  document.getElementById('themeLabel').textContent = d ? 'Dark Mode' : 'Light Mode';
}

// --- DST-safe ET wall-clock -> UTC instant (no library) ---------------------
function etWallToUTC(year, month, day, hour) {
  var guess = Date.UTC(year, month - 1, day, hour, 0, 0);
  var dtf = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  var p = {};
  dtf.formatToParts(new Date(guess)).forEach(function (x) { p[x.type] = x.value; });
  var asET = Date.UTC(+p.year, +p.month - 1, +p.day, +(p.hour === '24' ? 0 : p.hour), +p.minute);
  return guess - (asET - guess);
}
// UTC instant (ms) a slot's battle starts on the given battle-Saturday ISO date.
function slotBattleUTC(weekISO, slotId) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(weekISO || ''));
  var off = parseInt(slotId, 10);
  if (!m || isNaN(off)) return null;
  return etWallToUTC(+m[1], +m[2], +m[3], RESET_HOUR_ET + off);
}
// Local time string for a slot on the given battle-Saturday ISO date.
function slotLocalTime(weekISO, slotId) {
  var utc = slotBattleUTC(weekISO, slotId);
  if (utc == null) return '';
  try {
    return new Date(utc).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' });
  } catch (e) { return ''; }
}

// Alliance-swap deadline = in-game alliance registration, Thursday before the
// battle Saturday at the +10 slot (noon-ET reset + 10h = 10 PM ET). After this
// you can no longer swap alliances for the week. Returns a UTC instant (ms).
var SWAP_DEADLINE_DAYS_BEFORE = 2;   // Saturday battle -> Thursday
var SWAP_DEADLINE_SLOT = 10;         // +10 (10 PM ET)
function swapDeadlineUTC(weekISO) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(weekISO || ''));
  if (!m) return null;
  // Date.UTC inside etWallToUTC normalizes day underflow, so (day - 2) is safe.
  return etWallToUTC(+m[1], +m[2], (+m[3]) - SWAP_DEADLINE_DAYS_BEFORE, RESET_HOUR_ET + SWAP_DEADLINE_SLOT);
}
function swapDeadlineLocal(weekISO) {
  var utc = swapDeadlineUTC(weekISO);
  if (utc == null) return '';
  try {
    return new Date(utc).toLocaleString(undefined, { weekday: 'long', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  } catch (e) { return ''; }
}

// --- State ------------------------------------------------------------------
var state = { cfg: null, plan: {}, players: [], me: null, signup: null };
var countdownTimer = null;
var swapCountdownTimer = null;

function getStoredIdentity() {
  try {
    var v = localStorage.getItem('playerIdentity');
    if (!v || v === 'anonymous') return null;
    return JSON.parse(v);
  } catch (e) { return null; }
}
function getPickedChoice() {
  try { return localStorage.getItem('titanDashChoice') || ''; } catch (e) { return ''; }
}
function setPickedChoice(v) { try { localStorage.setItem('titanDashChoice', v); } catch (e) {} }

function findPlayer(siteKey, name) {
  var sk = (typeof siteKey === 'string' && /^[a-f0-9]{16}$/.test(siteKey)) ? siteKey : '';
  if (sk) { for (var i = 0; i < state.players.length; i++) if (state.players[i].siteKey === sk) return state.players[i]; }
  var nn = normName(name);
  if (nn) { for (var j = 0; j < state.players.length; j++) if (normName(state.players[j].name) === nn) return state.players[j]; }
  return null;
}
// Resolve a plan's stored (signup-time) name to the player's CURRENT roster name
// via the siteKey the worker stores in meta. Keeps the hub fresh across renames.
// Falls back to the stored name (name-only signups / pre-siteKey plans).
function currentName(data, name) {
  var m = (data && data.meta && data.meta[name]) || null;
  if (m && typeof m.siteKey === 'string' && /^[a-f0-9]{16}$/.test(m.siteKey)) {
    var p = findPlayer(m.siteKey, name);
    if (p && p.name) return p.name;
  }
  return name;
}

// Resolve "me": explicit picker choice first, else the site identity.
function resolveMe() {
  var choice = getPickedChoice();
  if (choice) {
    var p = choice.indexOf('name:') === 0 ? findPlayer('', choice.slice(5)) : findPlayer(choice, '');
    if (p) return { name: p.name, siteKey: p.siteKey || '', alliance: p.alliance || '', avatarurl: p.avatarurl || '' };
    if (choice.indexOf('name:') === 0) return { name: choice.slice(5), siteKey: '', alliance: '' };
  }
  var id = getStoredIdentity();
  if (id && (id.siteKey || id.name) && !id.guest) {
    var pp = findPlayer(id.siteKey, id.name);
    return { name: (pp && pp.name) || id.name, siteKey: (pp && pp.siteKey) || (/^[a-f0-9]{16}$/.test(id.siteKey || '') ? id.siteKey : ''), alliance: (pp && pp.alliance) || id.alliance || '', avatarurl: (pp && pp.avatarurl) || '' };
  }
  return null;
}

// Find the player's assignment in the battleplan. Returns { squad, position, bucket, mates[] } or null.
function findAssignment(name) {
  var nn = normName(name);
  for (var sq in state.plan) {
    if (!state.plan.hasOwnProperty(sq)) continue;
    var data = state.plan[sq];
    if (!data) continue;
    var found = null;
    if (data.positions) {
      for (var pos in data.positions) {
        if (data.positions.hasOwnProperty(pos) && data.positions[pos] && normName(currentName(data, data.positions[pos])) === nn) found = { squad: sq, position: pos, bucket: null };
      }
    }
    for (var b = 0; b < SUPPORT_BUCKETS.length; b++) {
      var arr = data[SUPPORT_BUCKETS[b]] || [];
      for (var k = 0; k < arr.length; k++) if (arr[k] && normName(currentName(data, arr[k])) === nn) found = { squad: sq, position: null, bucket: SUPPORT_BUCKETS[b] };
    }
    if (found) {
      found.mates = squadMembers(data);
      return found;
    }
  }
  return null;
}
function squadMembers(data) {
  var out = [];
  if (data.positions) for (var pos in data.positions) if (data.positions.hasOwnProperty(pos) && data.positions[pos]) out.push(data.positions[pos]);
  for (var b = 0; b < SUPPORT_BUCKETS.length; b++) { var arr = data[SUPPORT_BUCKETS[b]] || []; for (var k = 0; k < arr.length; k++) if (arr[k]) out.push(arr[k]); }
  return out;
}

// --- Render -----------------------------------------------------------------
function render() {
  var el = document.getElementById('dash');
  document.getElementById('loading').style.display = 'none';
  el.style.display = 'block';
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  if (swapCountdownTimer) { clearInterval(swapCountdownTimer); swapCountdownTimer = null; }

  var html = renderIdentityBar();

  if (!state.me) {
    html += '<div class="card"><div class="cta-wrap"><p class="muted">Pick your in-game name above to see your Titan Canyon status.</p></div></div>';
    el.innerHTML = html;
    wireIdentityPicker();
    return;
  }

  html += renderStatus();

  // Training badges sit near the top — a quick sense of accomplishment.
  html += renderTrainingCard();

  // Squad + battle-map preview next, so the map is reachable high on mobile.
  var assignment = findAssignment(state.me.name);
  if (assignment) {
    html += renderSquadCard(assignment);
  }
  // Titan Canyon quick links sit below the squad (nav after content).
  html += renderLinks();
  if (state.signup) {
    html += renderSignupCard(assignment);
  } else {
    html += renderRegisterCta();
  }

  el.innerHTML = html;
  wireIdentityPicker();
  startCountdown();
  startSwapCountdown();
}

function renderIdentityBar() {
  var me = state.me;
  var initial = me && me.name ? esc(me.name.trim().charAt(0).toUpperCase()) : '?';
  var avatarSrc = me ? resolveAvatar(me.avatarurl) : null;
  var allianceTag = (me && me.alliance) ? '<span class="pill ' + allianceClass(me.alliance) + '">' + esc(allianceDisplay(me.alliance)) + '</span>' : '';
  var options = ['<option value="">Change player&hellip;</option>'];
  var meChoice = me ? (me.siteKey ? me.siteKey : 'name:' + me.name) : '';
  state.players.forEach(function (p) {
    var val = p.siteKey ? p.siteKey : 'name:' + p.name;
    options.push('<option value="' + esc(val) + '"' + (val === meChoice ? ' selected' : '') + '>' + esc(p.name) + '</option>');
  });
  return '' +
    '<div class="card"><div class="id-bar">' +
      '<div class="id-who">' +
        '<div class="id-avatar"><span class="id-avatar-init notranslate">' + initial + '</span>' + (avatarSrc ? '<img src="' + esc(avatarSrc) + '" alt="" onerror="this.style.display=\'none\'">' : '') + '</div>' +
        '<div>' +
          '<div class="id-name notranslate">' + (me ? esc(me.name) : 'Welcome') + '</div>' +
          '<div class="id-meta">' + (me ? allianceTag : 'Server 2864 Titan Canyon') + '</div>' +
        '</div>' +

function signupsOpen() { var cfg = state.cfg || {}; return !!(cfg.week && cfg.week !== 'unset' && !(cfg.closesAt && Date.now() > Date.parse(cfg.closesAt))); }

function renderStatus() {
  var cfg = state.cfg || {};
  if (!cfg.week || cfg.week === 'unset') {
    return '<div class="card"><div class="status-line">Signups for the next Titan Canyon are <b>not open yet</b>. Check back soon.</div></div>';
  }
  if (!signupsOpen()) {
    return '<div class="card"><div class="status-line">Signups for <b>' + esc(cfg.week) + '</b> are <b>closed</b>. Your assignment is below.</div></div>';
  }
  return '<div class="card"><div class="status-line">Signups for <b>' + esc(cfg.week) + '</b> are open, closing in <span class="countdown notranslate" id="cd" translate="no">&hellip;</span></div></div>';
}

function fmtCountdown(ms) { var d = Math.floor(ms / 86400000), h = Math.floor(ms % 86400000 / 3600000), m = Math.floor(ms % 3600000 / 60000), s = Math.floor(ms % 60000 / 1000); return (d ? d + 'd ' : '') + h + 'h ' + m + 'm ' + s + 's'; }

function startCountdown() {
  var cfg = state.cfg || {};
  if (!cfg.closesAt || cfg.week === 'unset') return;
  var elc = document.getElementById('cd');
  if (!elc) return;
  function tick() {
    var ms = Date.parse(cfg.closesAt) - Date.now();
    if (isNaN(ms)) { elc.textContent = ''; return; }
    if (ms <= 0) { elc.textContent = 'closed'; clearInterval(countdownTimer); return; }
    elc.textContent = fmtCountdown(ms);
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

// Live countdowns inside the swap banner (only rendered for players who need to
// swap): #swapcd counts down to the alliance-registration deadline (+10 Thursday),
// #battlecd counts down to the squad's battle time. One timer drives both.
function startSwapCountdown() {
  var cfg = state.cfg || {};
  var swapEl = document.getElementById('swapcd');
  var battleEl = document.getElementById('battlecd');
  if (!swapEl && !battleEl) return;
  var a = findAssignment(state.me && state.me.name);
  var meta = a ? (SQUAD_META[a.squad] || {}) : {};
  var dl = swapDeadlineUTC(cfg.week);
  var battle = a ? slotBattleUTC(cfg.week, meta.slot) : null;
  function fill(el, target) {
    if (!el || target == null) return;
    var ms = target - Date.now();
    if (isNaN(ms)) { el.textContent = ''; return; }
    if (ms <= 0) { el.textContent = 'closed'; return; }
    el.textContent = fmtCountdown(ms);
  }
  function tick() {
    fill(swapEl, dl);
    fill(battleEl, battle);
    var swapDone = !swapEl || dl == null || dl - Date.now() <= 0;
    var battleDone = !battleEl || battle == null || battle - Date.now() <= 0;
    if (swapDone && battleDone && swapCountdownTimer) clearInterval(swapCountdownTimer);
  }
  tick();
  swapCountdownTimer = setInterval(tick, 1000);
}

// --- Load -------------------------------------------------------------------
function getJSON(url) { return fetch(url).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); }); }

// Re-resolve "me" + fetch their signup, then render. Called on first load and
// whenever the player picker changes.
function loadMine() {
  state.me = resolveMe();
  state.signup = null;
  state.training = null;
  if (!state.me) { render(); openWho(); return; }
  var week = (state.cfg && state.cfg.week) || '';
  var q = '?week=' + encodeURIComponent(week);
  if (state.me.siteKey) q += '&siteKey=' + encodeURIComponent(state.me.siteKey);
  if (state.me.name) q += '&name=' + encodeURIComponent(state.me.name);
  // Signup + training status in parallel; training needs a valid siteKey.
  var jobs = [ getJSON(TITAN_API + '/titan/my-signup' + q)
    .then(function (d) { state.signup = (d && d.signup) || null; }).catch(function () {}) ];
  if (/^[a-f0-9]{16}$/.test(state.me.siteKey || '')) {
    jobs.push(getJSON(TITAN_API + '/titan/training/status?siteKey=' + encodeURIComponent(state.me.siteKey))
      .then(function (d) { state.training = (d && d.status) || null; }).catch(function () {}));
  }
  Promise.all(jobs).then(function () { render(); });
}

// Player self-cancel: removes their own registration (the "can't make it" path).
// Gated to the signup deadline server-side and client-side (button greys out).
function cancelRegistration() {
  if (!state.me) return;
  if (!window.confirm('Cancel your Titan Canyon registration for this week? Your squad spot will be freed up. You can register again anytime while signups are open.')) return;
  var week = (state.cfg && state.cfg.week) || (state.signup && state.signup.week) || '';
  var btn = document.getElementById('cancelRegBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Cancelling...'; }
  fetch(TITAN_API + '/titan/cancel', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ week: week, siteKey: state.me.siteKey || '', name: state.me.name || '' })
  })
    .then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; });
    })
    .then(function (res) {
      if (!res.ok || !res.j || !res.j.ok) throw new Error((res.j && res.j.message) || 'Cancel failed');
      // The battleplan was rebuilt — refetch it, then re-resolve my signup (now gone).
      return getJSON(TITAN_API + '/titan/battleplan')
        .catch(function () { return {}; })
        .then(function (bp) {
          state.plan = (bp && typeof bp === 'object' && !Array.isArray(bp)) ? bp : {};
          loadMine();
        });
    })
    .catch(function (e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Cancel my registration'; }
      window.alert('Could not cancel your registration: ' + (e && e.message ? e.message : 'please try again.'));
    });
}

function init() {
  Promise.all([
    getJSON(TITAN_API + '/titan/slotconfig').catch(function () { return null; }),
    getJSON(TITAN_API + '/titan/battleplan').catch(function () { return {}; }),
    getJSON('player-data.json').catch(function () { return []; })
  ]).then(function (res) {
    state.cfg = res[0] || {};
    state.plan = (res[1] && typeof res[1] === 'object' && !Array.isArray(res[1])) ? res[1] : {};
    state.players = Array.isArray(res[2]) ? res[2].slice().sort(function (a, b) { return normName(a.name) < normName(b.name) ? -1 : 1; }) : [];
    loadMine();
  });
}

  var siteKey = /^[a-f0-9]{16}$/.test(sk || '') ? sk : null;
  try { localStorage.setItem('playerIdentity', JSON.stringify({ name: name, siteKey: siteKey, alliance: all || null, guest: false })); } catch (e) {}
  setPickedChoice(siteKey ? siteKey : 'name:' + name);
  closeWho();
  loadMine();
}
(function () {
  var s = document.getElementById('who-search');
  if (s) s.addEventListener('input', function () { buildWhoList(s.value); });
  var list = document.getElementById('who-list');
  if (list) list.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.who-item') : null;
    if (b) pickWho(b.getAttribute('data-name'), b.getAttribute('data-sk'), b.getAttribute('data-all'));
  });
  var skip = document.getElementById('who-skip');
  if (skip) skip.addEventListener('click', closeWho);
  var ov = document.getElementById('who-modal');
  if (ov) ov.addEventListener('click', function (e) { if (e.target === ov) closeWho(); });
})();
init();
(function () {
  var PUSH_WORKER = 'https://push-worker.27tb8s6fct.workers.dev';
  var VAPID_PUBLIC_KEY = 'BKbuearRTBpH6pAjoky9HVOYehah7lQ1Uti3APPMAYvdZJCUI8COAmVK7hym7zmefTGnI9_-vQY86IXa_nCHXHc';
  var bellBtn = document.getElementById('bellBtn');
  var swReg = null, pushSub = null;
  function urlB64ToUint8Array(b64){ var pad='='.repeat((4-b64.length%4)%4); var s=(b64+pad).replace(/-/g,'+').replace(/_/g,'/'); var raw=atob(s); return Uint8Array.from(raw,function(c){return c.charCodeAt(0);}); }
  function bufToB64u(buf){ return btoa(String.fromCharCode.apply(null,new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,''); }
  function storedIdentity(){ try{ var v=localStorage.getItem('playerIdentity'); if(!v||v==='anonymous') return null; return JSON.parse(v);}catch(e){return null;} }
  function setBell(on){ if(!bellBtn) return; bellBtn.textContent = on?'\u{1F514}':'\u{1F515}'; bellBtn.title = on?'Notifications on':'Enable notifications'; bellBtn.classList.toggle('subscribed', !!on); }
  function saveSub(sub){ var id=storedIdentity(); fetch(PUSH_WORKER+'/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint,keys:{p256dh:bufToB64u(sub.getKey('p256dh')),auth:bufToB64u(sub.getKey('auth'))},player:id?(id.guest?{name:id.name,guest:true}:{name:id.name,alliance:id.alliance,siteKey:id.siteKey||null}):null})}).catch(function(){}); }
  function hideBanner(){ var b=document.getElementById('tc-install-banner'); if(b) b.style.display='none'; }
  function subscribe(){
    if(!swReg) return;
    Notification.requestPermission().then(function(p){
      if(p!=='granted') return;
      swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8Array(VAPID_PUBLIC_KEY)})
        .then(function(sub){ pushSub=sub; setBell(true); saveSub(sub); hideBanner(); })
        .catch(function(e){ console.warn('push subscribe failed:', e); });
    });
  }
  function detectPlatform(){ var ua=navigator.userAgent||''; return { isIOS:/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1), isAndroid:/Android/.test(ua) }; }
  function isStandalone(){ return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true; }
  function wasDismissed(){ try{return localStorage.getItem('tc_install_dismissed')==='1';}catch(e){return false;} }
  function showBanner(){ var b=document.getElementById('tc-install-banner'); if(b) b.style.display='flex'; }
  function dismissInstall(){ hideBanner(); try{localStorage.setItem('tc_install_dismissed','1');}catch(e){} }
  // Build "Tap <action> then Add to Home Screen" + push note (safe DOM, mirrors landing page).
  function buildHint(action){ var steps=document.getElementById('tcInstallSteps'); if(!steps) return; steps.textContent=''; steps.appendChild(document.createTextNode('Tap ')); var a=document.createElement('strong'); a.textContent=action; steps.appendChild(a); steps.appendChild(document.createTextNode(' then ')); var b=document.createElement('strong'); b.textContent='Add to Home Screen'; steps.appendChild(b); var note=document.createElement('div'); note.className='tc-install-note'; note.textContent='Enables push notifications and reminders'; steps.appendChild(note); }
  var deferredPrompt=null;

  // Bell subscribes (works once installed / on desktop).
  if('serviceWorker' in navigator && 'PushManager' in window){
    if(bellBtn){ bellBtn.style.display=''; bellBtn.addEventListener('click', subscribe); }
    navigator.serviceWorker.register('/sw.js').then(function(reg){ swReg=reg; return reg.pushManager.getSubscription(); })
      .then(function(sub){ if(sub){ pushSub=sub; setBell(true); } else setBell(false); })
      .catch(function(){ if(bellBtn) bellBtn.style.display='none'; });
  }

  // Install banner (platform-aware, mirrors the landing page). Deferred to
  // DOMContentLoaded: this script is parsed BEFORE the banner markup near </body>.
  function initInstallBanner(){
    if(isStandalone() || wasDismissed()) return;
    var btn=document.getElementById('tcInstallBtn');
    var dm=document.getElementById('tcInstallDismiss'); if(dm) dm.addEventListener('click', dismissInstall);
    var plat=detectPlatform();
    if(plat.isIOS){
      buildHint('Share ☝'); if(btn){ btn.textContent='Got it'; btn.addEventListener('click', dismissInstall); } showBanner();
    } else if(plat.isAndroid){
      window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt=e; var s=document.getElementById('tcInstallSteps'); if(s) s.textContent='Install this app for push notifications and reminders'; if(btn) btn.textContent='Install'; showBanner(); });
      if(btn) btn.addEventListener('click', function(){ if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(function(){ deferredPrompt=null; dismissInstall(); }); } else { dismissInstall(); } });
      setTimeout(function(){ if(!deferredPrompt && !isStandalone() && !wasDismissed()){ buildHint('⋮ Menu'); if(btn) btn.textContent='Got it'; showBanner(); } }, 3000);
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', initInstallBanner); else initInstallBanner();
})();
</script>
<script>
(function() {
  var LANGUAGES = [
    { code: 'en', flag: '\u{1F1FA}\u{1F1F8}', name: 'English' },
    { code: 'es', flag: '\u{1F1EA}\u{1F1F8}', name: 'Español' },
    { code: 'fr', flag: '\u{1F1EB}\u{1F1F7}', name: 'Français' },
    { code: 'de', flag: '\u{1F1E9}\u{1F1EA}', name: 'Deutsch' },
    { code: 'pt', flag: '\u{1F1E7}\u{1F1F7}', name: 'Português' },
    { code: 'it', flag: '\u{1F1EE}\u{1F1F9}', name: 'Italiano' },
    { code: 'ru', flag: '\u{1F1F7}\u{1F1FA}', name: 'Русский' },
    { code: 'ja', flag: '\u{1F1EF}\u{1F1F5}', name: '日本語' },
    { code: 'ko', flag: '\u{1F1F0}\u{1F1F7}', name: '한국어' },
    { code: 'zh-CN', flag: '\u{1F1E8}\u{1F1F3}', name: '中文' },
    { code: 'ar', flag: '\u{1F1F8}\u{1F1E6}', name: 'العربية' },
    { code: 'tr', flag: '\u{1F1F9}\u{1F1F7}', name: 'Türkçe' },
    { code: 'vi', flag: '\u{1F1FB}\u{1F1F3}', name: 'Tiếng Việt' },
    { code: 'th', flag: '\u{1F1F9}\u{1F1ED}', name: 'ไทย' },
    { code: 'hi', flag: '\u{1F1EE}\u{1F1F3}', name: 'हिन्दी' },
    { code: 'pl', flag: '\u{1F1F5}\u{1F1F1}', name: 'Polski' },
    { code: 'uk', flag: '\u{1F1FA}\u{1F1E6}', name: 'Українська' },
    { code: 'id', flag: '\u{1F1EE}\u{1F1E9}', name: 'Indonesia' }
  ];
  window._gtLoaded = false;
  function getLangData(code) {
    var base = code.split('-')[0];
    for (var i = 0; i < LANGUAGES.length; i++) { if (LANGUAGES[i].code === code || LANGUAGES[i].code === base) return LANGUAGES[i]; }
    return null;
  }
  window.updateLangBtn = function(code) {
    var data = getLangData(code);
    var flagEl = document.getElementById('langFlag'); var codeEl = document.getElementById('langCode');
    if (data && flagEl && codeEl) { flagEl.textContent = data.flag; codeEl.textContent = '/' + data.code; }
    else if (flagEl && codeEl) { flagEl.textContent = '\u{1F310}'; codeEl.textContent = '/' + code; }
    var options = document.querySelectorAll('.lang-option');
    for (var i = 0; i < options.length; i++) options[i].classList.toggle('active', options[i].getAttribute('data-lang') === code);
  };
  window.detectCurrentLang = function() {
    var match = document.cookie.match(/googtrans=\/en\/([a-zA-Z-]{2,10})/);
    if (match && match[1]) return match[1];
    return 'en';
  };
  function applyLangToCombo(code, delay, onSuccess) {
    var attempts = 0;
    var poll = setInterval(function() {
      var combo = document.querySelector('.goog-te-combo');
      if (combo) { combo.value = code; combo.dispatchEvent(new Event('change')); clearInterval(poll); window.updateLangBtn(code); if (onSuccess) onSuccess(); }
      if (++attempts > 30) clearInterval(poll);
    }, delay || 200);
  }
  function selectLanguage(code) {
    if (code === 'en') { restoreEnglish(); return; }
    // Persist the pick site-wide so the browser-locale auto-detect doesn't
    // override an explicit choice on the next page load.
    try { localStorage.setItem('langOverride', code); localStorage.setItem('translate-dismissed', '1'); } catch(e) {}
    try { sessionStorage.setItem('pendingLang', code); } catch(e) {}
    applyLangToCombo(code, 200, closeLangModal);
  }
  function restoreEnglish() {
    try { sessionStorage.removeItem('pendingLang'); } catch(e) {}
    // English is an explicit choice too — record it so the browser-locale
    // auto-detect on the next load doesn't translate the page straight back.
    try { localStorage.setItem('translate-dismissed', '1'); localStorage.setItem('langOverride', 'en'); } catch(e) {}
    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=Lax; Secure';
    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.2864tw.com; SameSite=Lax; Secure';
    closeLangModal(); location.reload();
  }
  var langModalEl = document.getElementById('langModal');
  function openLangModal() { if (langModalEl) langModalEl.classList.add('active'); }
  function closeLangModal() { if (langModalEl) langModalEl.classList.remove('active'); }
  var grid = document.getElementById('langGrid');
  if (grid) {
    var detected = window.detectCurrentLang();
    for (var i = 0; i < LANGUAGES.length; i++) {
      var l = LANGUAGES[i];
      var btn = document.createElement('button');
      btn.className = 'lang-option' + (l.code === detected ? ' active' : '');
      btn.setAttribute('data-lang', l.code);
      var flagSpan = document.createElement('span'); flagSpan.className = 'lang-flag'; flagSpan.textContent = l.flag;
      var nameSpan = document.createElement('span'); nameSpan.className = 'lang-name'; nameSpan.textContent = l.name;
      btn.appendChild(flagSpan); btn.appendChild(nameSpan);
      btn.addEventListener('click', (function(code) { return function() { selectLanguage(code); }; })(l.code));
      grid.appendChild(btn);
    }
    window.updateLangBtn(detected);
  }
  var langBtn = document.getElementById('langBtn');
  if (langBtn) langBtn.addEventListener('click', openLangModal);
  var langModalClose = document.getElementById('langModalClose');
  if (langModalClose) langModalClose.addEventListener('click', closeLangModal);
  if (langModalEl) langModalEl.addEventListener('click', function(e) { if (e.target === langModalEl) closeLangModal(); });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && langModalEl && langModalEl.classList.contains('active')) { closeLangModal(); e.stopPropagation(); } });
  setTimeout(function() { if (!window._gtLoaded) { var btn = document.getElementById('langBtn'); if (btn) { btn.style.opacity = '0.5'; btn.style.cursor = 'default'; btn.title = 'Translation unavailable'; btn.removeEventListener('click', openLangModal); } } }, 15000);
})();
function googleTranslateElementInit() {
  window._gtLoaded = true;
  new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'google_translate_element');
  var pendingLang = null;
  try { pendingLang = sessionStorage.getItem('pendingLang'); sessionStorage.removeItem('pendingLang'); } catch(e) {}
  if (pendingLang) {
    var a = 0; var poll = setInterval(function () { var c = document.querySelector('.goog-te-combo'); if (c) { c.value = pendingLang; c.dispatchEvent(new Event('change')); clearInterval(poll); window.updateLangBtn(pendingLang); } if (++a > 30) clearInterval(poll); }, 250);
  } else {
    try {
      var dismissed = localStorage.getItem('translate-dismissed');
      if (!dismissed) { var lang = (navigator.language || navigator.userLanguage || 'en').split('-')[0]; if (lang !== 'en') { var a2 = 0; var p2 = setInterval(function () { var c = document.querySelector('.goog-te-combo'); if (c) { c.value = lang; c.dispatchEvent(new Event('change')); clearInterval(p2); window.updateLangBtn(lang); } if (++a2 > 30) clearInterval(p2); }, 250); } }
    } catch(e) {}
    var detected = window.detectCurrentLang();
    if (detected !== 'en') window.updateLangBtn(detected);
  }
}
</script>
<script src="https://translate.googleapis.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <div class="tc-install-text"><strong>Add to Home Screen</strong><span class="tc-install-steps" id="tcInstallSteps"></span></div>
