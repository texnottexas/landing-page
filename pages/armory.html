<style>
:root{
  /* surfaces (site standard) */
  --bg:#0d1117; --surface:#161b22; --card:#1c2128; --card-hi:#222933;
  --border:#30363d; --rule:#262c35;
  --text:#e6edf3; --muted:#8b949e; --dim:#6e7681;
  --accent:#79c0ff;                       /* links, active nav, focus ring only */
  --ok:#3fb950; --warn:#d29922; --bad:#f85149;

  /* game quality tiers: card and icon borders ONLY */
  --q3:#388bfd; --q4:#a371f7; --q5:#d29922; --q6:#f85149;
  /* roll / progress ramp (the client's tier colours): meter fills ONLY */
  --roll-lo:#6cb6ff; --roll-mid:#a371f7; --roll-hi:#e3b341; --roll-max:#56d364;
  /* unit branches (site standard): pills ONLY */
  --army:#3fb950; --navy:#388bfd; --air:#d29922;
  /* alliances (chart memory rule 1c): pills ONLY */
  --dog:#e3a008; --mss:#58a6ff; --dgen:#db61a2; --pru:#57606a;

  /* type */
  --display:"Bahnschrift","DIN Condensed","DIN Alternate","Avenir Next Condensed","Arial Narrow",
            "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",
         "PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-15:15px; --fs-17:17px;
  --fs-20:20px; --fs-24:24px; --fs-32:32px;

  /* space, shape */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-6:24px; --s-8:32px;
  --gutter:16px; --maxw:1200px;
  --r-chip:4px; --r-card:6px; --r-sheet:12px;     /* nav and segmented control: 0 */
  --tap:44px; --tap-min:40px; --row:56px;

  /* layout, motion */
  --hdr:52px; --bar:56px; --z-sheet:1000; --z-toast:1100; --t:150ms ease-out;
  /* 12% tints for pills (same hues as the pill colours) */
  --army-t:rgba(63,185,80,.12); --navy-t:rgba(56,139,253,.12); --air-t:rgba(210,153,34,.12);
  --dog-t:rgba(227,160,8,.12); --mss-t:rgba(88,166,255,.12); --dgen-t:rgba(219,97,162,.12); --pru-t:rgba(87,96,106,.12);
}
@media (min-width:768px){ :root{ --gutter:24px; } }

*{ box-sizing:border-box; }
html{ background:var(--bg); color-scheme:dark; -webkit-text-size-adjust:100%; scroll-padding-top:110px; }
body{ margin:0; background:var(--bg); color:var(--text); font:400 var(--fs-14)/1.45 var(--sans); font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
@media (min-width:768px){ body{ font-size:var(--fs-15); } }
button,input,select,textarea{ font:inherit; color:inherit; font-family:inherit; }
button{ cursor:pointer; background:none; border:0; padding:0; text-align:inherit; border-radius:0; }
img{ display:block; max-width:100%; }
a{ color:var(--accent); }
h1,h2,h3,p,ul,ol{ margin:0; padding:0; }
ul,ol{ list-style:none; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
[hidden]{ display:none !important; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; font-size:var(--fs-12); }
.skip{ position:absolute; left:8px; top:-80px; z-index:2000; background:var(--surface); border:1px solid var(--border); padding:10px 14px; border-radius:var(--r-chip); color:var(--accent); }
.skip:focus{ top:8px; }
svg.i{ width:24px; height:24px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
svg.i.sm{ width:16px; height:16px; }
svg.star{ width:12px; height:12px; fill:var(--q5); stroke:none; }
svg.star.off{ fill:var(--dim); }

/* type roles */
.disp{ font-family:var(--display); font-weight:700; line-height:1.25; }
.title{ font:700 var(--fs-20)/1.25 var(--display); text-transform:uppercase; letter-spacing:.04em; }
.muted{ color:var(--muted); }
.t12{ font-size:var(--fs-12); } .t13{ font-size:var(--fs-13); }
.code{ font-family:var(--mono); font-size:var(--fs-12); }
html.translated-ltr .title, html[lang="zh-CN"] .title{ text-transform:none; letter-spacing:0; }

/* header */
.hdr{ position:sticky; top:0; z-index:50; height:var(--hdr); background:var(--surface); border-bottom:1px solid var(--rule); }
.hdr-in{ display:flex; align-items:center; height:100%; max-width:var(--maxw); margin:0 auto; padding:0 8px; }
@media (min-width:768px){ .hdr-in{ padding:0 16px; } }
.ib{ width:40px; height:40px; flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:var(--r-chip); color:var(--text); transition:background var(--t); }
.ib:hover,.ib:active{ background:var(--card-hi); }
.tb{ min-height:40px; min-width:40px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 12px; border-radius:var(--r-chip); color:var(--text); font-size:var(--fs-13); font-weight:600; white-space:nowrap; transition:background var(--t); }
.tb:hover,.tb:active{ background:var(--card-hi); }
.tb.link{ color:var(--accent); }
.who{ flex:1; min-width:0; padding:0 8px; line-height:1.15; }
.who-n{ font:700 var(--fs-17)/1.15 var(--display); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.who-s{ font-size:var(--fs-12); color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chip-hit{ height:40px; display:inline-flex; align-items:center; padding:0 4px; flex:none; }
.chip{ display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 10px; border:1px solid var(--border); border-radius:var(--r-chip); background:var(--surface); font-size:var(--fs-12); white-space:nowrap; }
.dot{ width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
.dot.ok{ background:var(--ok); } .dot.warn{ background:var(--warn); } .dot.bad{ background:var(--bad); }
.dt{ display:none; }
.bagb{ display:none; }
@media (min-width:600px){ .bagb{ display:inline-flex; } }
@media (min-width:768px){ .dt{ display:inline-flex; } }
.pop-wrap{ position:relative; flex:none; }
.pop{ position:absolute; top:calc(100% + 6px); left:0; width:260px; max-width:calc(100vw - 16px); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:4px; z-index:60; }
.pop button{ display:flex; align-items:center; width:100%; min-height:40px; padding:0 12px; border-radius:var(--r-chip); font-size:var(--fs-14); }
.pop button:hover{ background:var(--card-hi); }
.pop .pop-h{ padding:8px 12px 4px; font-size:var(--fs-12); color:var(--muted); }

/* navigation */
.tabs{ display:none; position:sticky; top:var(--hdr); z-index:45; background:var(--surface); border-bottom:1px solid var(--rule); }
.tabs-in{ max-width:var(--maxw); margin:0 auto; padding:0 var(--gutter); display:flex; }
.tab{ height:44px; padding:0 16px; display:inline-flex; align-items:center; gap:8px; color:var(--muted); text-decoration:none; border-bottom:2px solid transparent; font-size:var(--fs-15); font-weight:600; border-radius:0; position:relative; transition:color var(--t); }
.tab:hover{ color:var(--text); }
.tab[aria-current="page"]{ color:var(--text); border-bottom-color:var(--accent); }
.bar{ position:fixed; left:0; right:0; bottom:0; z-index:45; padding-bottom:env(safe-area-inset-bottom); background:var(--surface); border-top:1px solid var(--rule); display:grid; grid-template-columns:repeat(5,1fr); }
.bar a{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:var(--bar); color:var(--muted); text-decoration:none; font-size:var(--fs-12); border-radius:0; }
.bar a[aria-current="page"]{ color:var(--text); }
.bar a[aria-current="page"]::before{ content:""; position:absolute; top:-1px; left:0; right:0; height:2px; background:var(--accent); }
.badge{ position:absolute; top:8px; left:calc(50% + 8px); width:6px; height:6px; border-radius:50%; background:var(--accent); }
@media (min-width:768px){ .tabs{ display:block; } .bar{ display:none; } }

main{ display:block; max-width:var(--maxw); margin:0 auto; outline:0; padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom) + 24px); }
@media (min-width:768px){ main{ padding-bottom:48px; } }
.view{ animation:none; }
.view.in{ animation:fadein var(--t); }
@keyframes fadein{ from{ opacity:0; } to{ opacity:1; } }
.vb{ padding:12px var(--gutter) 0; }
.vb > * + *{ margin-top:16px; }
.sechead{ display:flex; align-items:center; gap:4px; }
.sechead .title{ flex:1; }

/* segmented control (radius 0) */
.segs{ position:sticky; top:var(--hdr); z-index:40; background:var(--bg); border-bottom:1px solid var(--rule); }
@media (min-width:768px){ body{ overflow-x:clip; } .segs{ border-bottom:0; } .segs::after{ content:""; position:absolute; bottom:0; left:calc(50% - 50vw); width:100vw; height:1px; background:var(--rule); } }
@media (min-width:768px){ .segs{ top:calc(var(--hdr) + 44px); } }
.segs-in{ display:flex; max-width:var(--maxw); margin:0 auto; }
@media (min-width:768px){ .segs-in{ max-width:520px; margin:0 0 0 var(--gutter); } }
.segs button{ flex:1; min-height:44px; min-width:44px; color:var(--muted); border-left:1px solid var(--rule); font-size:var(--fs-14); font-weight:600; text-align:center; border-radius:0; transition:background var(--t),color var(--t); }
.segs button:first-child{ border-left:0; }
.segs button[aria-selected="true"]{ background:var(--card-hi); color:var(--accent); }
.bar a.has-new::after{ content:""; position:absolute; top:8px; left:calc(50% + 10px); width:6px; height:6px; border-radius:50%; background:var(--accent); }
.tab.has-new::after{ content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); }
.segs button.has-new::after{ content:""; display:inline-block; width:6px; height:6px; margin-left:6px; border-radius:50%; background:var(--accent); vertical-align:middle; }

/* card, pill, number, meter */
.card{ background:var(--card); border:1px solid var(--border); border-radius:var(--r-card); padding:12px; }
@media (min-width:768px){ .card{ padding:16px; } }
.card.sel{ border-color:var(--accent); }
.pill{ display:inline-flex; align-items:center; height:20px; padding:0 6px; font-size:var(--fs-12); line-height:1; border:1px solid currentColor; border-radius:var(--r-chip); white-space:nowrap; color:var(--muted); }
.p-army{ color:var(--army); background:var(--army-t); } .p-navy{ color:var(--navy); background:var(--navy-t); } .p-air{ color:var(--air); background:var(--air-t); }
.p-dog{ color:var(--dog); background:var(--dog-t); } .p-mss{ color:var(--mss); background:var(--mss-t); } .p-dgen{ color:var(--dgen); background:var(--dgen-t); } .p-pru{ color:var(--pru); background:var(--pru-t); }
.p-eff{ color:var(--text); border-color:var(--border); background:var(--card-hi); }
.p-lv{ color:var(--text); border-color:var(--border); }
.nb .n{ font:700 var(--fs-24)/1.25 var(--display); }
.nb .n.big{ font-size:var(--fs-24); }
@media (min-width:768px){ .nb .n.big{ font-size:var(--fs-32); } }
.nb .l{ font-size:var(--fs-13); }
.nb .s{ font-size:var(--fs-12); color:var(--muted); }
.meter{ height:4px; background:var(--border); border-radius:0; overflow:hidden; }
.meter.lg{ height:8px; }
.meter > i{ display:block; height:100%; width:0; background:var(--roll-lo); transition:width var(--t); }
.r-lo > i, i.r-lo{ background:var(--roll-lo); } .r-mid > i, i.r-mid{ background:var(--roll-mid); }
.r-hi > i, i.r-hi{ background:var(--roll-hi); } .r-max > i, i.r-max{ background:var(--roll-max); }
.c-lo{ color:var(--roll-lo); } .c-mid{ color:var(--roll-mid); } .c-hi{ color:var(--roll-hi); } .c-max{ color:var(--roll-max); }
.ico{ border:1.5px solid var(--border); border-radius:var(--r-chip); background:var(--surface); object-fit:cover; flex:none; }
.q3{ border-color:var(--q3); } .q4{ border-color:var(--q4); } .q5{ border-color:var(--q5); } .q6{ border-color:var(--q6); }
.fb{ display:inline-flex; align-items:center; justify-content:center; background:var(--card-hi); color:var(--muted); font:700 var(--fs-15)/1 var(--display); flex:none; overflow:hidden; }
.empty{ padding:16px; border:1px solid var(--border); border-radius:var(--r-card); background:var(--card); color:var(--muted); }
.phase{ font-size:var(--fs-12); color:var(--muted); }
/* fk boats loader: the classic page's particle swirl, load-driven. Orbs orbit while a load is pending, converge into "fk boats"
   when it resolves, the shield reveals, then the content fades in. Transform and opacity only; the orbit loop exists only while
   #main is aria-busy (?check=1 skips it then); will-change is set only while it runs. Its 350-500 ms steps are the one deliberate
   exception to the 150 ms motion rule: a ceremony, not a control. */
.fkl{ display:flex; flex-direction:column; align-items:center; padding:var(--s-8) 0; opacity:0; transition:opacity var(--t); }
.fkl.on,.fkl.hero{ opacity:1; }
.fkl-st{ position:relative; width:calc(var(--s-8)*4); height:calc(var(--s-8)*4); }
.fkl .o{ position:absolute; left:50%; top:50%; width:0; height:0; animation:fkl-orbit var(--d,3s) linear infinite; animation-delay:var(--dl,0s); }
.fkl .o i{ position:absolute; left:calc(var(--s-1)*-1.25); top:calc(var(--s-1)*-1.25); width:calc(var(--s-1)*2.5); height:calc(var(--s-1)*2.5); border-radius:50%; background:var(--c); transform:translateX(var(--r)); transition:transform 350ms ease-in,opacity 350ms ease-in; }
.fkl .o:nth-child(1){ --c:var(--q3); --r:calc(var(--s-6)*2.5); --d:2.8s; --dl:-.0s; }
.fkl .o:nth-child(2){ --c:var(--roll-mid); --r:calc(var(--s-6)*1.5); --d:2.2s; --dl:-.7s; animation-direction:reverse; }
.fkl .o:nth-child(3){ --c:var(--q5); --r:calc(var(--s-6)*2.5); --d:2.8s; --dl:-.7s; }
.fkl .o:nth-child(4){ --c:var(--roll-max); --r:calc(var(--s-6)*1.5); --d:2.2s; --dl:-1.4s; animation-direction:reverse; }
.fkl .o:nth-child(5){ --c:var(--q6); --r:calc(var(--s-6)*2.5); --d:2.8s; --dl:-1.4s; }
.fkl .o:nth-child(6){ --c:var(--roll-lo); --r:calc(var(--s-6)*1.5); --d:2.2s; --dl:-.2s; animation-direction:reverse; }
.fkl .o:nth-child(7){ --c:var(--roll-hi); --r:calc(var(--s-6)*2.5); --d:2.8s; --dl:-2.1s; }
.fkl .o:nth-child(8){ --c:var(--q4); --r:calc(var(--s-6)*1.5); --d:2.2s; --dl:-1.8s; animation-direction:reverse; }
.fkl[data-run] .o,.fkl[data-run] i{ will-change:transform; }
.fkl .fk{ position:absolute; left:50%; top:50%; margin:0; transform:translate(-50%,-50%) scale(.9); opacity:0; font-family:var(--display); font-size:var(--fs-32); font-weight:700; line-height:1.1; text-align:center; white-space:nowrap; color:var(--text); }
.fkl .sh{ position:absolute; left:50%; top:50%; width:calc(var(--s-8)*2.25); height:calc(var(--s-8)*2.25); margin:calc(var(--s-8)*-1.125) 0 0 calc(var(--s-8)*-1.125); color:var(--text); opacity:0; transform:scale(.6); }
.fkl.form .o i,.fkl.settle .o i{ transform:translateX(0) scale(.3); opacity:0; }
.fkl.settle .o{ animation-play-state:paused; }
.fkl.form .fk{ animation:fkl-fk 350ms ease-out 200ms both; }
.fkl.form .sh{ animation:fkl-sh 250ms ease-out 450ms both; }
.fkl.hero .o{ animation:fkl-orbit .8s linear 1 both; }
@keyframes fkl-orbit{ to{ transform:rotate(360deg); } }
@keyframes fkl-fk{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(.9); } 35%,65%{ opacity:1; transform:translate(-50%,-50%) scale(1); } 100%{ opacity:0; transform:translate(-50%,-50%) scale(1.05); } }
@keyframes fkl-sh{ from{ opacity:0; transform:scale(.6); } to{ opacity:1; transform:scale(1); } }
/* the loader region keeps the page footer at the bottom while loading (vh fallback first) */
.fkl-vb{ min-height:calc(100vh - var(--hdr) - 96px); min-height:calc(100dvh - var(--hdr) - 96px); display:flex; flex-direction:column; justify-content:center; }
.fkl-cap{ margin:var(--s-3) 0 0; font-size:var(--fs-13); color:var(--muted); text-align:center; }
@media (prefers-reduced-motion:reduce){
  .fkl .o{ display:none; }
  .fkl,.fkl .fk,.fkl .sh{ opacity:1 !important; transform:none; }
  .fkl .fk{ top:auto; bottom:0; left:0; right:0; transform:none; font-size:var(--fs-20); }
  .fkl .fk br{ display:none; }
  .fkl .sh{ top:40%; transform:none; }
}
.skel{ height:12px; background:var(--card-hi); border-radius:0; }

/* overview */
.hcard{ display:flex; flex-direction:column; gap:8px; }
.hc-top{ display:flex; align-items:center; gap:12px; }
.ava{ width:48px; height:48px; border-radius:50%; border:1.5px solid var(--border); object-fit:cover; flex:none; background:var(--surface); }
.hc-name{ font:700 var(--fs-24)/1.2 var(--display); overflow:hidden; text-overflow:ellipsis; }
.hc-pills{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:4px; }
.hc-meta{ display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; }
.fresh{ font-size:var(--fs-13); color:var(--muted); display:flex; flex-wrap:wrap; align-items:center; gap:0 8px; }
.ov{ display:flex; flex-direction:column; gap:16px; }
.ov > .ov-col{ display:contents; }
#hdrCard{ order:0; } #bandCard{ order:1; } #movesCard{ order:2; } #areasCard{ order:3; } #shareCard{ order:4; }

  .ov{ display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:24px; align-items:start; }
  .ov > .ov-col{ display:flex; flex-direction:column; gap:16px; }
  #hdrCard,#bandCard,#movesCard,#areasCard,#shareCard{ order:0; }
}
.hd{ font:700 var(--fs-17)/1.25 var(--display); margin-bottom:12px; }
.sub{ font:700 var(--fs-17)/1.25 var(--display); }

@media (min-width:1024px){ .band{ grid-template-columns:1fr; gap:16px; } }
.bm .n{ font:700 var(--fs-20)/1.25 var(--display); }
.plink{ display:block; border-radius:50%; flex:none; }
.hc-por{ display:flex; gap:8px; }
.hc-meta .nb{ display:grid; grid-template-columns:auto 1fr; align-items:baseline; gap:0 8px; }

.bm-top{ min-height:40px; align-items:flex-start; }
.hc-meta .nb .n{ font:700 var(--fs-24)/1.25 var(--display); }
.fresh .fl{ display:inline-flex; align-items:center; gap:0 4px; }
.fresh .tb.link{ padding:0 4px; margin:-10px 0 -10px -4px; }
.c-warn{ color:var(--warn); }
.hdr.who-off .who{ visibility:hidden; }
.mico{ width:40px; height:40px; align-self:flex-start; }
.bm-top{ display:flex; align-items:center; gap:0; }

.bm-num{ display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
.bm-pct{ font-size:var(--fs-12); }
