<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https://translate.googleapis.com https://translate.google.com https://www.gstatic.com https://translate-pa.googleapis.com; style-src 'unsafe-inline' https://translate.googleapis.com https://www.gstatic.com; connect-src 'self' https://push-worker.27tb8s6fct.workers.dev https://translate.googleapis.com https://translate-pa.googleapis.com https://translate.google.com; img-src 'self' data: https://i.ibb.co https://translate.google.com https://translate.googleapis.com https://www.gstatic.com https://www.google.com https://fonts.gstatic.com; frame-src https://translate.google.com; object-src 'none'; base-uri 'self'; form-action 'none'; font-src https://fonts.gstatic.com;" />
  <title>Battle Plan – Server 2864</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #0d1117; --bg2: #161b22; --card: #1c2128; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #79c0ff;
      --army: #3fb950; --navy: #388bfd; --air: #d29922;
      --ce: #e3b341; --mm: #bc8cff; --tag: #21262d;
      --shadow: rgba(0,0,0,.45);
    }
    :root[data-theme="light"] {
      --bg: #f6f8fa; --bg2: #ffffff; --card: #ffffff; --border: #d0d7de;
      --text: #1f2328; --muted: #656d76; --accent: #1f75d4;
      --army: #1a7f37; --navy: #0550ae; --air: #9a6700;
      --ce: #7d4e00; --mm: #6e40c9; --tag: #eaeef2;
      --shadow: rgba(140,149,159,.2);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    header {
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: .85rem 2rem; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 200; box-shadow: 0 1px 0 var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 1.2rem; }
    .header-title { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    .header-sub { font-size: .75rem; color: var(--muted); margin-top: 3px; }
    .nav-link {
      font-size: .8rem; color: var(--muted); text-decoration: none; padding: .35rem .8rem;
      border: 1px solid var(--border); border-radius: 7px; transition: all .15s;
    }
    .nav-link:hover { border-color: var(--accent); color: var(--accent); }
    .hdr-btn {
      background: var(--tag); border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: .38rem .9rem; cursor: pointer; font-size: .8rem;
      display: flex; align-items: center; gap: .4rem; transition: all .15s; white-space: nowrap;
    }
    .hdr-btn:hover { border-color: var(--accent); color: var(--accent); }

    main { max-width: 1440px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }

    .squad-tabs {
      display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem;
      padding: .9rem 1.25rem; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; align-items: center;
    }
    .squad-tabs-label {
      font-size: .72rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em; margin-right: .25rem;
    }
    .tab-btn {
      padding: .4rem 1rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--tag); color: var(--muted); cursor: pointer;
      font-size: .82rem; font-weight: 500; transition: all .15s;
    }
    .tab-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    .empty-state {
      text-align: center; padding: 4rem 2rem; color: var(--muted);
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    }
    .empty-state h3 { font-size: 1rem; margin-bottom: .5rem; color: var(--text); }

    .plan-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
    @media (max-width: 960px) { .plan-layout { grid-template-columns: 1fr; } }

    .panel {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem;
    }
    .panel h3 {
      font-size: .72rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 1rem;
    }

    /* Tactical diamond map (in-game geometry: 8x8 grid rotated 45deg) */
    .dm-wrap {
      width: 100%; max-width: 460px; aspect-ratio: 1; margin: 0 auto;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--navy) 10%, transparent), transparent 62%);
      border-radius: 10px; container-type: inline-size;
    }
    .dm-grid {
      width: 70.5%; aspect-ratio: 1; display: grid;
      grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
      gap: 2px; transform: rotate(45deg);
    }
    .dm-cell { border-radius: 3px; background: var(--bg2); border: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
    .dm-zone { background: var(--card); display: flex; align-items: center; justify-content: center; }
    .dm-zone.empty { opacity: .55; }
    .dm-zc { transform: rotate(-45deg); text-align: center; line-height: 1.15; width: 23cqi; }
    .dm-zc .num { font-weight: 800; font-size: 4.6cqi; display: block; }
    .dm-zc .role { font-size: 2.1cqi; font-weight: 600; color: var(--muted); display: block; margin-top: 1px; }
    .dm-zc .player {
      font-size: 2.5cqi; font-weight: 700; display: block; margin-top: 3px;
      background: color-mix(in srgb, var(--text) 8%, transparent); border: 1px solid var(--border);
      color: var(--text); border-radius: 999px; padding: 1px 7px; width: fit-content;
      margin-left: auto; margin-right: auto; max-width: 22cqi;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .zCE { border: 2px solid var(--ce); box-shadow: 0 0 14px color-mix(in srgb, var(--ce) 25%, transparent), inset 0 0 12px color-mix(in srgb, var(--ce) 8%, transparent); }
    .zUC { border: 2px solid var(--army); box-shadow: 0 0 14px color-mix(in srgb, var(--army) 22%, transparent), inset 0 0 12px color-mix(in srgb, var(--army) 7%, transparent); }
    .zMM { border: 2px solid var(--mm); box-shadow: 0 0 14px color-mix(in srgb, var(--mm) 22%, transparent), inset 0 0 12px color-mix(in srgb, var(--mm) 7%, transparent); }
    .zCE .num { color: var(--ce); } .zUC .num { color: var(--army); } .zMM .num { color: var(--mm); }
    .dm-hub {
      background: var(--bg); border: 1px dashed var(--navy);
      box-shadow: 0 0 18px color-mix(in srgb, var(--navy) 20%, transparent);
      display: flex; align-items: center; justify-content: center;
    }
    .dm-hub .dm-zc { color: var(--accent); font-size: 2.2cqi; font-weight: 700; width: 26cqi; }
    .dm-fac { display: flex; align-items: center; justify-content: center; font-size: 2.9cqi; opacity: .85; }
    .dm-fac span { transform: rotate(-45deg); }
    .dm-fac.fU span { color: var(--army); font-weight: 800; font-size: 3.3cqi; }
    .map-legend { margin-top: .6rem; display: flex; flex-direction: column; gap: .35rem; align-items: center; }
    .legend-row { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; font-size: .7rem; color: var(--text); }
    .legend-row .k { display: inline-flex; align-items: center; gap: .35rem; }
    .legend-sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
    .legend-plus { color: var(--army); font-weight: 800; }
    .ref-link-row { margin-top: .8rem; text-align: center; }
    .ref-link {
      display: inline-flex; align-items: center; gap: .4rem; font-size: .72rem; color: var(--accent);
      border: 1px solid var(--border); border-radius: 999px; padding: .35rem .85rem;
      background: var(--bg2); cursor: pointer; font-family: inherit;
    }
    .ref-link:hover { border-color: var(--accent); }

    /* Signed-in "your spot" */
    .me-banner {
      display: flex; align-items: center; gap: .7rem; margin-bottom: 1.25rem;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
      border-radius: 10px; padding: .65rem .95rem;
    }
    .me-av {
      width: 36px; height: 36px; border-radius: 50%; background: var(--tag);
      border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: var(--accent); flex-shrink: 0;
    }
    .me-who { font-size: .85rem; color: var(--text); }
    .me-who b { color: var(--accent); }
    .me-squad { font-size: .7rem; color: var(--muted); margin-top: 1px; }
    .me-go {
      margin-left: auto; font-size: .7rem; color: var(--accent); cursor: pointer;
      border: 1px solid var(--border); background: var(--bg2); border-radius: 999px;
      padding: .32rem .75rem; font-family: inherit; white-space: nowrap;
    }
    .me-go:hover { border-color: var(--accent); }
    .me-zone { outline: 2px solid var(--accent); outline-offset: 2px; animation: mePulse 2.4s ease-in-out infinite; }
    .me-zone .player { background: var(--accent) !important; color: var(--bg) !important; border-color: var(--accent) !important; }
    @keyframes mePulse {
      0%, 100% { outline-color: color-mix(in srgb, var(--accent) 90%, transparent); }
      50% { outline-color: color-mix(in srgb, var(--accent) 35%, transparent); }
    }

    /* Roster sections */
    .assign-section { margin-bottom: 1rem; }
    .assign-section:last-child { margin-bottom: 0; }
    .assign-title {
      font-size: .78rem; font-weight: 700; color: var(--text); margin-bottom: .4rem;
      padding-bottom: .3rem; border-bottom: 1px solid var(--border);
    }
    .assign-note { font-size: .68rem; color: var(--muted); font-style: italic; margin-top: .25rem; }
    .assign-list { list-style: none; display: flex; flex-direction: column; gap: 3px; }
    .assign-item {
      display: flex; align-items: center; gap: .5rem; padding: .3rem .6rem;
      border-radius: 6px; font-size: .8rem; background: var(--bg2); border: 1px solid var(--border);
    }
    .slot-label { color: var(--muted); font-size: .68rem; min-width: 1.4rem; font-weight: 600; }
    .slot-player { font-weight: 600; }
    .slot-empty { color: var(--muted); font-style: italic; font-size: .75rem; }

    /* Notes */
    .notes-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem;
    }
    .notes-card h3 {
      font-size: .72rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: .8rem;
    }
    .notes-body { font-size: .85rem; line-height: 1.5; white-space: pre-wrap; color: var(--text); min-height: 40px; }
    .notes-empty { color: var(--muted); font-style: italic; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    @media (max-width: 640px) {
      main { padding: 1rem 1rem 2rem; }
      header { padding: .7rem 1rem; flex-wrap: wrap; gap: .5rem; }
    }
    .ref-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 500;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .ref-modal-overlay.open { opacity: 1; pointer-events: auto; }
    .ref-modal-overlay img {
      max-width: 90vw; max-height: 90vh; border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,.6);
    }
    .site-footer { text-align: center; padding: 1.5rem 2rem; font-size: .75rem; color: var(--muted); border-top: 1px solid var(--border); }
    .site-footer a { color: var(--accent); text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; }
    /* Google Translate overrides */
    body { top: 0 !important; }
    body > .skiptranslate { display: none !important; }
    #google_translate_element { position: absolute; left: -9999px; opacity: 0; pointer-events: none; }
    .lang-btn {
      background: var(--tag); border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: .38rem .7rem; cursor: pointer; font-size: .8rem;
      display: flex; align-items: center; gap: .35rem; font-family: inherit;
      font-weight: 600; letter-spacing: .02em; white-space: nowrap; transition: border-color .2s;
    }
    .lang-btn:hover { border-color: var(--accent); color: var(--text); }
    .lang-modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 400;
      background: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 1rem;
    }
    .lang-modal-overlay.active { display: flex; }
    .lang-modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 1.25rem; max-width: 400px; width: 100%; max-height: 80vh; overflow-y: auto;
      box-shadow: 0 8px 32px var(--shadow);
    }
    .lang-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .lang-modal-title { font-size: 1rem; font-weight: 700; color: var(--text); }
    .lang-modal-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.2rem; padding: .2rem; line-height: 1; }
    .lang-modal-close:hover { color: var(--text); }
    .lang-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; }
    .lang-option {
      display: flex; align-items: center; gap: .5rem; padding: .5rem .65rem;
      border-radius: 8px; border: 1px solid transparent; background: var(--bg);
      cursor: pointer; font-size: .82rem; color: var(--text); font-family: inherit;
      transition: border-color .15s, background .15s;
    }
    .lang-option:hover { border-color: var(--accent); background: var(--tag); }
    .lang-option.active { border-color: var(--accent); background: var(--tag); }
    .lang-option .lang-flag { font-size: 1.1rem; }
    .lang-option .lang-name { flex: 1; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div>
      <div class="header-title notranslate">&#9876; Battle Plan</div>
      <div class="header-sub">Server 2864 &ndash; Titan Canyon</div>
    </div>
    <a href="https://2864tw.com" class="nav-link" title="Home" style="padding:.35rem .6rem;display:inline-flex;align-items:center"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L10 3.5l7 7"/><path d="M5 9v7a1 1 0 001 1h3v-4h2v4h3a1 1 0 001-1V9"/></svg></a>
    <a href="titan-roster.html" class="nav-link">&larr; Rosters</a>
  </div>
  <div style="display:flex;gap:.6rem;align-items:center">
    <button class="lang-btn notranslate" id="langBtn" aria-label="Change language">
      <span id="langFlag">&#127482;&#127480;</span>
      <span id="langCode">/en</span>
    </button>
    <div id="google_translate_element"></div>
    <button class="hdr-btn" onclick="toggleTheme()">
      <span id="themeIcon">&#9728;&#65039;</span>
      <span id="themeLabel">Light Mode</span>
    </button>
  </div>
</header>

<main>
  <div class="squad-tabs">
    <span class="squad-tabs-label">Squad</span>
  </div>
  <div id="content"></div>
</main>

<div class="ref-modal-overlay" id="refModal" onclick="this.classList.remove('open')">
  <img src="https://i.ibb.co/HTM5MTLn/TC-Reference-Map.png" alt="Formation Reference Map" />
</div>

<div class="lang-modal-overlay" id="langModal">
  <div class="lang-modal">
    <div class="lang-modal-header">
      <span class="lang-modal-title">Select Language</span>
      <button class="lang-modal-close" id="langModalClose" aria-label="Close">&#10005;</button>
    </div>
    <div class="lang-grid" id="langGrid"></div>
  </div>
</div>

<footer class="site-footer">
  Brought to you by supporters of the fk boats movement<br>
  <a href="https://github.com/texnottexas/titan-canyon-rosters" target="_blank" rel="noopener noreferrer">GitHub</a>
</footer>

<script>
var TITAN_API = 'https://push-worker.27tb8s6fct.workers.dev';
const SQUADS = ["Dog Squad A","Dog Squad B","MSS Squad A","MSS Squad B","PRU Squad A","Cat Squad A","Cat Squad B"];
const SQUAD_SHORT = {"Dog Squad A":"Dog A (+10)","Dog Squad B":"Dog B (-2)","MSS Squad A":"MSS A (+2)","MSS Squad B":"MSS B (+10)","PRU Squad A":"PRU A (-6)","Cat Squad A":"Cat A (+2)","Cat Squad B":"Cat B (-2)"};

const POSITIONS = [
  { num: 1, role: "Bigger CE", color: "#3fb950", x: 22, y: 22 },
  { num: 2, role: "Medium-strong CE", color: "#3fb950", x: 78, y: 78 },
  { num: 3, role: "MM + Urgent Care", color: "#d29922", x: 5, y: 50 },
  { num: 4, role: "MM + Urgent Care", color: "#d29922", x: 50, y: 5 },
  { num: 5, role: "MM + Urgent Care", color: "#d29922", x: 50, y: 95 },
  { num: 6, role: "MM + Urgent Care", color: "#d29922", x: 95, y: 50 },
  { num: 7, role: "Any MM, no urgent care (4 towers)", color: "#3fb950", x: 22, y: 78 },
  { num: 8, role: "Any MM, no urgent care (4 towers)", color: "#d29922", x: 78, y: 22 },
];

const POS_GROUPS = [
  { title: "CE Positions (Map #1–2)", nums: [1, 2] },
  { title: "MM Positions (Map #3–8)", nums: [3, 4, 5, 6, 7, 8] },
];

const SECTIONS = [
  { key: "goon", title: "CE Goon Squad", note: "Go on offense / run around freely" },
  { key: "standby", title: "Standby (Fill as Needed)" },
  { key: "hover", title: "Hover Captains", note: "Make sure people get to hover station every round / notify when it's bounty time" },
  { key: "crystal", title: "Crystal Lab Captains", note: "Track open labs, share labs that need help" },
];

let planData = {};
let activeSquad = "";

let players = [];   // player-data.json (identity resolution only)
let me = null;      // { name } | null
let myAssign = null; // { squad, position|null, bucket|null, slot? } | null

function normName(s) { return String(s == null ? "" : s).toLowerCase().trim(); }
function isMe(name) { return !!(me && normName(name) === normName(me.name)); }
function isHexKey(s) { return typeof s === "string" && /^[a-f0-9]{16}$/.test(s); }

function getStoredIdentity() {
  try {
    const v = localStorage.getItem("playerIdentity");
    if (!v || v === "anonymous") return null;
    const id = JSON.parse(v);
    return (id && !id.guest && (id.siteKey || id.name)) ? id : null;
  } catch (e) { return null; }
}
function getPickedChoice() {
  try { return localStorage.getItem("titanRosterChoice") || ""; } catch (e) { return ""; }
}
function findPlayer(siteKey, name) {
  if (isHexKey(siteKey)) { for (const p of players) if (p.siteKey === siteKey) return p; }
  const nn = normName(name);
  if (nn) { for (const p of players) if (normName(p.name) === nn) return p; }
  return null;
}
// Same conventions as titan-roster.html: the explicit roster-page picker choice
// wins, else the site identity. Only the name is needed on this page.
function resolveMe() {
  const choice = getPickedChoice();
  if (choice) {
    const p = choice.indexOf("name:") === 0 ? findPlayer("", choice.slice(5)) : findPlayer(choice, "");
    if (p) return { name: p.name };
    if (choice.indexOf("name:") === 0) return { name: choice.slice(5) };
  }
  const id = getStoredIdentity();
  if (id) {
    const p = findPlayer(id.siteKey, id.name);
    if (p) return { name: p.name };
    if (id.name) return { name: id.name };
  }
  return null;
}
// First hit across all squads: numbered position, else a support bucket (slot = 1-based index).
function findMyAssignment(name) {
  const nn = normName(name);
  if (!nn) return null;
  for (const sq of SQUADS) {
    const d = planData[sq];
    if (!d) continue;
    if (d.positions) {
      for (const pos in d.positions) {
        if (d.positions.hasOwnProperty(pos) && normName(d.positions[pos]) === nn) {
          return { squad: sq, position: pos, bucket: null };
        }
      }
    }
    for (const s of SECTIONS) {
      const arr = (d[s.key] || []).filter(v => v);
      for (let k = 0; k < arr.length; k++) {
        if (normName(arr[k]) === nn) return { squad: sq, position: null, bucket: s.key, slot: k + 1 };
      }
    }
  }
  return null;
}
function zoneRole(num) { for (const z of ZONE_LAYOUT) if (String(z.num) === String(num)) return z.role; return ""; }
function sectionTitle(key) { for (const s of SECTIONS) if (s.key === key) return s.title; return key; }

function renderMeBanner() {
  if (!me || !myAssign) return "";
  const spot = myAssign.position
    ? `Position ${esc(myAssign.position)} · ${esc(zoneRole(myAssign.position))}`
    : `${esc(sectionTitle(myAssign.bucket))} #${myAssign.slot}`;
  const initial = esc((normName(me.name).charAt(0) || "?").toUpperCase());
  return `
    <div class="me-banner">
      <div class="me-av notranslate">${initial}</div>
      <div>
        <div class="me-who"><b class="notranslate">${esc(me.name)}</b> · your spot: <b>${spot}</b></div>
        <div class="me-squad">${esc(SQUAD_SHORT[myAssign.squad] || myAssign.squad)}</div>
      </div>
      <button class="me-go" onclick="goToMySquad()">View on map</button>
    </div>`;
}
function goToMySquad() {
  if (!myAssign) return;
  if (activeSquad !== myAssign.squad) selectSquad(myAssign.squad);
  const el = document.querySelector(".dm-wrap");
  if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
}

const ESC_MAP = {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"};
function esc(s) { return String(s??"").replace(/[&<>"']/g, c => ESC_MAP[c]); }

function toggleTheme() {
  const d = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", d ? "light" : "dark");
  document.getElementById("themeIcon").textContent = d ? "\uD83C\uDF19" : "\u2600\uFE0F";
  document.getElementById("themeLabel").textContent = d ? "Dark Mode" : "Light Mode";
}

function buildTabs() {
  const container = document.querySelector(".squad-tabs");
  SQUADS.forEach(sq => {
    const btn = document.createElement("button");
    btn.className = "tab-btn";
    btn.textContent = SQUAD_SHORT[sq];
    btn.dataset.squad = sq;
    btn.onclick = () => selectSquad(sq);
    container.appendChild(btn);
  });
}

function selectSquad(sq) {
  activeSquad = sq;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.squad === sq));
  render();
}

function render() {
  const el = document.getElementById("content");
  const data = planData[activeSquad];

  if (!data || !hasAnyData(data)) {
    el.innerHTML = renderMeBanner() + `<div class="empty-state"><h3>No battle plan yet</h3><p>No plan has been configured for ${esc(SQUAD_SHORT[activeSquad])} yet.</p></div>`;
    return;
  }

  el.innerHTML = renderMeBanner() + `
    <div class="plan-layout">
      <div class="panel">
        <h3>Battle Map &mdash; ${esc(SQUAD_SHORT[activeSquad])}</h3>
        <div class="dm-wrap"><div class="dm-grid" id="mapGrid"></div></div>
        <div class="map-legend">
          <div class="legend-row">
            <span class="k"><span class="legend-sw" style="background:var(--ce)"></span> CE positions</span>
            <span class="k"><span class="legend-sw" style="background:var(--army)"></span> MM + Urgent Care</span>
            <span class="k"><span class="legend-sw" style="background:var(--mm)"></span> Any MM (4 towers)</span>
          </div>
          <div class="legend-row">
            <span class="k">💪 Strengthening Tower</span>
            <span class="k">🚨 Weakening Tower</span>
            <span class="k"><span class="legend-plus">✚</span> Urgent Care</span>
          </div>
        </div>
        <div class="ref-link-row">
          <button class="ref-link" onclick="document.getElementById('refModal').classList.add('open')">🗺 Compare with in-game reference</button>
        </div>
      </div>
      <div class="panel">
        <h3>Roster Assignments</h3>
        ${SECTIONS.map(s => renderSection(s, data)).join("")}
        ${renderPositionSections(data)}
      </div>
    </div>
    ${data.notes ? `<div class="notes-card"><h3>Squad Notes</h3><div class="notes-body">${esc(data.notes)}</div></div>` : ""}
  `;

  renderMap(data);
}

function hasAnyData(d) {
  if (!d) return false;
  if (d.notes) return true;
  if (d.positions && Object.values(d.positions).some(v => v)) return true;
  for (const s of SECTIONS) { if (d[s.key] && d[s.key].some(v => v)) return true; }
  return false;
}

// The in-game Titan Canyon map is a 45deg-rotated 8x8 grid: 2x2 zone blocks
// with 1x1 tower cells in the lanes between them (verified against the
// in-game reference image). grid-area strings are rowStart/colStart/rowEnd/colEnd.
const ZONE_LAYOUT = [
  { num: 4, area: "1/1/3/3", cls: "zUC", role: "MM + UC" },
  { num: 8, area: "1/4/3/6", cls: "zMM", role: "Any MM ×4" },
  { num: 6, area: "1/7/3/9", cls: "zUC", role: "MM + UC" },
  { num: 1, area: "4/1/6/3", cls: "zCE", role: "Bigger CE" },
  { num: 2, area: "4/7/6/9", cls: "zCE", role: "Med-strong CE" },
  { num: 3, area: "7/1/9/3", cls: "zUC", role: "MM + UC" },
  { num: 7, area: "7/4/9/6", cls: "zMM", role: "Any MM ×4" },
  { num: 5, area: "7/7/9/9", cls: "zUC", role: "MM + UC" },
];
const HUB_AREA = "4/4/6/6";
// Tower types: S = 💪 Strengthening, W = 🚨 Weakening, U = ✚ Urgent Care.
// 28 lane cells total: 4 U (diagonal ring around the hub), 8 W (inner ring),
// 16 S (every remaining lane cell). No blank tiles.
const TOWER_CELLS = [
  { area: "3/3/4/4", t: "U" }, { area: "3/6/4/7", t: "U" }, { area: "6/3/7/4", t: "U" }, { area: "6/6/7/7", t: "U" },
  { area: "3/4/4/5", t: "W" }, { area: "3/5/4/6", t: "W" }, { area: "4/3/5/4", t: "W" }, { area: "5/3/6/4", t: "W" },
  { area: "4/6/5/7", t: "W" }, { area: "5/6/6/7", t: "W" }, { area: "6/4/7/5", t: "W" }, { area: "6/5/7/6", t: "W" },
  { area: "3/1/4/2", t: "S" }, { area: "3/2/4/3", t: "S" }, { area: "3/7/4/8", t: "S" }, { area: "3/8/4/9", t: "S" },
  { area: "6/1/7/2", t: "S" }, { area: "6/2/7/3", t: "S" }, { area: "6/7/7/8", t: "S" }, { area: "6/8/7/9", t: "S" },
  { area: "1/3/2/4", t: "S" }, { area: "2/3/3/4", t: "S" }, { area: "7/3/8/4", t: "S" }, { area: "8/3/9/4", t: "S" },
  { area: "1/6/2/7", t: "S" }, { area: "2/6/3/7", t: "S" }, { area: "7/6/8/7", t: "S" }, { area: "8/6/9/7", t: "S" },
];
const TOWER_GLYPH = { S: "💪", W: "🚨", U: "✚" };

function renderMap(data) {
  const grid = document.getElementById("mapGrid");
  if (!grid) return;
  let html = "";
  ZONE_LAYOUT.forEach(z => {
    const assigned = data.positions?.[z.num] || "";
    const mine = assigned && isMe(assigned);
    html += `<div class="dm-cell dm-zone ${z.cls}${assigned ? "" : " empty"}${mine ? " me-zone" : ""}" style="grid-area:${z.area}">` +
      `<div class="dm-zc">` +
        `<span class="num">${z.num}</span>` +
        `<span class="role">${esc(z.role)}</span>` +
        (assigned ? `<span class="player notranslate">${esc(assigned)}${mine ? " (you)" : ""}</span>` : "") +
      `</div></div>`;
  });
  html += `<div class="dm-cell dm-hub" style="grid-area:${HUB_AREA}"><div class="dm-zc">DISCARDED<br>REPOSITORY /<br>NEXUS HUB</div></div>`;
  TOWER_CELLS.forEach(c => {
    html += `<div class="dm-cell dm-fac f${c.t}" style="grid-area:${c.area}"><span>${TOWER_GLYPH[c.t]}</span></div>`;
  });
  grid.innerHTML = html;
}

function renderPositionSections(data) {
  if (!data.positions) return "";
  return POS_GROUPS.map(g => {
    const posInfo = POSITIONS.filter(p => g.nums.includes(p.num) && data.positions[p.num]);
    if (!posInfo.length) return "";
    return `
      <div class="assign-section">
        <div class="assign-title">${esc(g.title)}</div>
        <ul class="assign-list">
          ${posInfo.map(p => `
            <li class="assign-item">
              <span class="slot-label">#${p.num}</span>
              <span class="slot-player notranslate">${esc(data.positions[p.num])}</span>
            </li>
          `).join("")}
        </ul>
      </div>
    `;
  }).join("");
}

function renderSection(sec, data) {
  const slots = data[sec.key] || [];
  const filled = slots.filter(v => v);
  if (!filled.length) return "";
  return `
    <div class="assign-section">
      <div class="assign-title">${esc(sec.title)}</div>
      <ul class="assign-list">
        ${filled.map((v, i) => `
          <li class="assign-item">
            <span class="slot-label">#${i + 1}</span>
            <span class="slot-player">${esc(v)}</span>
          </li>
        `).join("")}
      </ul>
      ${sec.note ? `<div class="assign-note">${esc(sec.note)}</div>` : ""}
    </div>
  `;
}

async function loadData() {
  try {
    const parsed = await fetch(TITAN_API + '/titan/battleplan')
      .then(function (r) { if (!r.ok) throw new Error('worker'); return r.json(); })
      .catch(function () { return fetch('data/titan-battle-plan.json').then(function (r) { return r.json(); }); });
    planData = (parsed && typeof parsed === "object" && !Array.isArray(parsed)) ? parsed : {};
  } catch (e) { console.warn("Could not load plan data", e); }
}

async function init() {
  buildTabs();
  const results = await Promise.all([
    loadData(),
    fetch("player-data.json").then(r => r.json()).catch(() => [])
  ]);
  players = Array.isArray(results[1]) ? results[1] : [];
  me = resolveMe();
  myAssign = me ? findMyAssignment(me.name) : null;
  if (SQUADS.length) selectSquad(myAssign ? myAssign.squad : SQUADS[0]);
}

init();
</script>
<script>
(function() {
  var LANGUAGES = [
    { code: 'en', flag: '\u{1F1FA}\u{1F1F8}', name: 'English' },
    { code: 'es', flag: '\u{1F1EA}\u{1F1F8}', name: 'Espa\u00f1ol' },
    { code: 'fr', flag: '\u{1F1EB}\u{1F1F7}', name: 'Fran\u00e7ais' },
    { code: 'de', flag: '\u{1F1E9}\u{1F1EA}', name: 'Deutsch' },
    { code: 'pt', flag: '\u{1F1E7}\u{1F1F7}', name: 'Portugu\u00eas' },
    { code: 'it', flag: '\u{1F1EE}\u{1F1F9}', name: 'Italiano' },
    { code: 'ru', flag: '\u{1F1F7}\u{1F1FA}', name: '\u0420\u0443\u0441\u0441\u043a\u0438\u0439' },
    { code: 'ja', flag: '\u{1F1EF}\u{1F1F5}', name: '\u65E5\u672C\u8A9E' },
    { code: 'ko', flag: '\u{1F1F0}\u{1F1F7}', name: '\uD55C\uAD6D\uC5B4' },
    { code: 'zh-CN', flag: '\u{1F1E8}\u{1F1F3}', name: '\u4E2D\u6587' },
    { code: 'ar', flag: '\u{1F1F8}\u{1F1E6}', name: '\u0627\u0644\u0639\u0631\u0628\u064A\u0629' },
    { code: 'tr', flag: '\u{1F1F9}\u{1F1F7}', name: 'T\u00fcrk\u00e7e' },
    { code: 'vi', flag: '\u{1F1FB}\u{1F1F3}', name: 'Ti\u1EBFng Vi\u1EC7t' },
    { code: 'th', flag: '\u{1F1F9}\u{1F1ED}', name: '\u0E44\u0E17\u0E22' },
    { code: 'hi', flag: '\u{1F1EE}\u{1F1F3}', name: '\u0939\u093F\u0928\u094D\u0926\u0940' },
    { code: 'pl', flag: '\u{1F1F5}\u{1F1F1}', name: 'Polski' },
    { code: 'uk', flag: '\u{1F1FA}\u{1F1E6}', name: '\u0423\u043a\u0440\u0430\u0457\u043d\u0441\u044c\u043a\u0430' },
    { code: 'id', flag: '\u{1F1EE}\u{1F1E9}', name: 'Indonesia' }
  ];
  window._gtLoaded = false;
  function getLangData(code) {
    var base = code.split('-')[0];
    for (var i = 0; i < LANGUAGES.length; i++) {
      if (LANGUAGES[i].code === code || LANGUAGES[i].code === base) return LANGUAGES[i];
    }
    return null;
  }
  window.updateLangBtn = function(code) {
    var data = getLangData(code);
    var flagEl = document.getElementById('langFlag');
    var codeEl = document.getElementById('langCode');
    if (data && flagEl && codeEl) { flagEl.textContent = data.flag; codeEl.textContent = '/' + data.code; }
    else if (flagEl && codeEl) { flagEl.textContent = '\u{1F310}'; codeEl.textContent = '/' + code; }
    var options = document.querySelectorAll('.lang-option');
    for (var i = 0; i < options.length; i++) options[i].classList.toggle('active', options[i].getAttribute('data-lang') === code);
  };
  window.detectCurrentLang = function() {
    var match = document.cookie.match(/googtrans=\/en\/([a-zA-Z-]{2,10})/);
    if (match && match[1]) return match[1];
    return 'en';
  };
  function applyLangToCombo(code, delay, onSuccess) {
    var attempts = 0;
    var poll = setInterval(function() {
      var combo = document.querySelector('.goog-te-combo');
      if (combo) {
        combo.value = code; combo.dispatchEvent(new Event('change')); clearInterval(poll); window.updateLangBtn(code);
        if (onSuccess) onSuccess();
      }
      if (++attempts > 30) clearInterval(poll);
    }, delay || 200);
  }
  function selectLanguage(code) {
    if (code === 'en') { restoreEnglish(); return; }
    try { sessionStorage.setItem('pendingLang', code); } catch(e) {}
    applyLangToCombo(code, 200, closeLangModal);
  }
  function restoreEnglish() {
    try { sessionStorage.removeItem('pendingLang'); } catch(e) {}
    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=Lax; Secure';
    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.titan.2864tw.com; SameSite=Lax; Secure';
    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.2864tw.com; SameSite=Lax; Secure';
    closeLangModal(); location.reload();
  }
  var langModalEl = document.getElementById('langModal');
  function openLangModal() { if (langModalEl) langModalEl.classList.add('active'); }
  function closeLangModal() { if (langModalEl) langModalEl.classList.remove('active'); }
  var grid = document.getElementById('langGrid');
  if (grid) {
    var detected = window.detectCurrentLang();
    for (var i = 0; i < LANGUAGES.length; i++) {
      var l = LANGUAGES[i];
      var btn = document.createElement('button');
      btn.className = 'lang-option' + (l.code === detected ? ' active' : '');
      btn.setAttribute('data-lang', l.code);
      var flagSpan = document.createElement('span'); flagSpan.className = 'lang-flag'; flagSpan.textContent = l.flag;
      var nameSpan = document.createElement('span'); nameSpan.className = 'lang-name'; nameSpan.textContent = l.name;
      btn.appendChild(flagSpan); btn.appendChild(nameSpan);
      btn.addEventListener('click', (function(code) { return function() { selectLanguage(code); }; })(l.code));
      grid.appendChild(btn);
    }
    window.updateLangBtn(detected);
  }
  var langBtn = document.getElementById('langBtn');
  if (langBtn) langBtn.addEventListener('click', openLangModal);
  var langModalClose = document.getElementById('langModalClose');
  if (langModalClose) langModalClose.addEventListener('click', closeLangModal);
  if (langModalEl) langModalEl.addEventListener('click', function(e) { if (e.target === langModalEl) closeLangModal(); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && langModalEl && langModalEl.classList.contains('active')) { closeLangModal(); e.stopPropagation(); }
  });
  setTimeout(function() {
    if (!window._gtLoaded) { var btn = document.getElementById('langBtn'); if (btn) { btn.style.opacity = '0.5'; btn.style.cursor = 'default'; btn.title = 'Translation unavailable'; btn.removeEventListener('click', openLangModal); } }
  }, 15000);
})();
function googleTranslateElementInit() {
  window._gtLoaded = true;
  new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'google_translate_element');
  var pendingLang = null;
  try { pendingLang = sessionStorage.getItem('pendingLang'); sessionStorage.removeItem('pendingLang'); } catch(e) {}
  if (pendingLang) {
    applyLangToCombo(pendingLang, 250);
  } else {
    try {
      var dismissed = localStorage.getItem('translate-dismissed');
      if (!dismissed) {
        var lang = (navigator.language || navigator.userLanguage || 'en').split('-')[0];
        if (lang !== 'en') applyLangToCombo(lang, 250);
      }
    } catch(e) {}
    var detected = window.detectCurrentLang();
    if (detected !== 'en') window.updateLangBtn(detected);
  }
}
</script>
<script src="https://translate.googleapis.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
