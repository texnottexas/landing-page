<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fake game</title></head>
<body style="margin:0;background:#2f6f8f;height:100vh">
<canvas id="GameCanvas" style="width:100vw;height:100vh;display:block"></canvas>
<script>
  // A stand-in for the Top War page: just enough of the game objects the Ops Center reads.
  window.__fake = { uid: '1000000000001', name: 'Tester', base: false, defender: false, loaded: true };
  window.__require = function (name) {
    if (name !== 'DataCenter' || !__fake.loaded) return null;
    return { DATA: { UserData: { Name: __fake.name, StrUid: __fake.uid } } };
  };
  window.cc = {
    find: function (path) {
      if (path === 'Canvas/HomeMap') return __fake.base ? { getComponent: function () { return { armyInited: true, _BuildingComplete: true }; } } : null;
      if (path === 'UICanvas/PopLayer/prefabWorlddefenderMonsterFortress') return __fake.defender ? { activeInHierarchy: true } : null;
      return null;
    }
  };
  window.__OPS_BASE = location.origin + '/';
</script>
</body>
</html>
