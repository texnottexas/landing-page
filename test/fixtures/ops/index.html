<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fake game</title></head>
<body style="margin:0;background:#2f6f8f;height:100vh">
<canvas id="GameCanvas" style="width:100vw;height:100vh;display:block"></canvas>
<script>
  // A stand-in for the Top War page: just enough of the game objects the Ops Center reads.
  window.__fake = { uid: '1000000000001', name: 'Tester', base: false, defender: false, loaded: true, server: 2864 };
  window.__require = function (name) {
    if (!__fake.loaded) return null;
    if (name === 'DataCenter') return { DATA: { get ServerTime() { return Math.floor(Date.now() / 1000); }, UserData: { Name: __fake.name, StrUid: __fake.uid, Armys: __fake.armys || [], OriginServerId: __fake.server, Alliance: { Rank: __fake.allianceRank || 0 } } } };
    // the game's activities (events), only when a test sets them: otherwise the read fails, as on a page that isn't the game
    if (name === 'ActivityController' && __fake.activities) return { ActivityController: { Instance: { _activityList: __fake.activities } } };
    return null;
  };
  window.cc = {
    find: function (path) {
      if (path === 'Canvas/HomeMap') return __fake.base ? { getComponent: function () { return { armyInited: true, _BuildingComplete: true, _ArmyComplete: __fake.armyComplete !== false, ArmyItems: __fake.armyItems || {} }; } } : null;
      if (path === 'UICanvas/PopLayer/prefabWorlddefenderMonsterFortress') return __fake.defender ? { activeInHierarchy: true } : null;
      return null;
    }
  };
  window.__OPS_BASE = location.origin + '/';
</script>
</body>
</html>
