  var TABLE = { _tableMap: TABLES, getTableGroup: function (n) { return TABLES[n]; }, getTableDataById: function (n, id) { return (TABLES[n] || {})[String(id)] || null; } };

  // ---- the base grid
  var BT = {}, FREE = {};
  for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) if ((x + y) % 2 === 0) { var p = 1000 * x + y; BT[p] = x >= 24 && y >= 10 ? 2 : y < 10 ? 0 : 1; FREE[p] = true; }

  var U = { StrUid: F.uid, Name: F.name, Level: 100, Buildings: [], BuildBoxs: [], _museumData: [], collabDecorateBox: {}, DecorationSuits: [{ _suitId: 1216 }],

  function addBuilding(uuid, id, x, y) { var b = { Id: uuid, Pos: 1000 * x + y, Data: B[id] }; U.Buildings.push(b); occupy(b, true); return b; }
  function building(uuid) { return U.Buildings.filter(function (b) { return b.Id === String(uuid); })[0]; }
  function bag(id, n) {

  }
  function count(id) { var b = U.BuildBoxs.filter(function (x) { return x._itemId === id; })[0]; return b ? b._amount : 0; }
  F.count = count; F.building = building;
  F.setup = function () {
    U.Buildings = []; U.BuildBoxs = []; U.HomeItemPoints = {}; U.collabDecorateBox = {};

  U.updateMuseumOneData = function (ack) { U._museumData = U._museumData.map(function (l) { return l.labelId === ack.labelId ? ack : l; }); };
  U.DecorationExpandData = { get _dataMap() { var o = {}; o[5494] = { buildId: 48220, sublime_exp: F.up.exp }; return o; },
    getStateList: function () { return [{ state: F.up.state, buildCfg: B[48220], buildCfgLv1: B[48217], sublimationCfg: { building_number: 54, per_number: 1 }, exp: F.up.exp }]; } };

  // ---- the home map
  var HM = { _BuildingComplete: true, removed: [],
    checkNearByPos: function (pos, a, b, c, w, h, pt, mp) {
      return fp(pos.x, pos.y, w, h).every(function (q) {
        var x0 = Math.floor(q / 1000);
        if (BT[q] == null || BT[q] === 2 || !FREE[q]) return false;

    removeBuildingFromMap: function (id) { HM.removed.push(id); },

  // ---- the network
  function tabOf(id) { return U._museumData.filter(function (l) { return l.labelId === id; })[0]; }
  function json(rid, p) {
    var mode = F.mode[rid] || 'ok';
    if (mode === 'refuse') return { s: 3, d: '"refused_' + rid + '"' };
    if (mode !== 'nostate') {
      if (rid === 131) { if (building(p.id)) bag(building(p.id).Data.id, 1); }

      else if (rid === 130) { var r = B[p.buildId], nx = Object.keys(B).map(Number).filter(function (k) { return B[k].group === r.group && B[k].level === r.level + 1; })[0]; bag(p.buildId, -3 * p.num); bag(nx, p.num); }
    }
    if (rid === 104) { var b = building(p.id); return { s: 0, d: JSON.stringify({ x: Math.floor(b.Pos / 1000), y: b.Pos % 1000, building: { id: p.id, x: mode === 'nostate' ? Math.floor(b.Pos / 1000) : p.x, y: mode === 'nostate' ? b.Pos % 1000 : p.y } }) }; }

  }
  function pb(rid, p) {
    var mode = F.mode[rid] || 'ok';
    if (mode === 'refuse') return { s: 2 };
    var ack = {};
    if (rid === 4760) {
      if (mode !== 'nostate') {
        var id;
        if (p.type === 1) { var b = building(p.buildingUuid); id = b.Data.id; occupy(b, false); U.Buildings = U.Buildings.filter(function (q) { return q !== b; }); }

        else { id = p.boxBuildingId; bag(id, -1); }
        if (U.collabDecorateBox[p.specId]) bag(U.collabDecorateBox[p.specId].decorationId, 1);

    } else if (rid === 4754) {
      if (mode !== 'nostate') { bag(U.collabDecorateBox[p.specId].decorationId, 1); delete U.collabDecorateBox[p.specId]; }
    } else if (rid === 4755) {
      var t = tabOf(p.labelId);
      ack = { labelId: t.labelId, labelName: t.labelName, labelStoreData: t.labelStoreData.concat(mode === 'nostate' ? [] : [{ uuid: 'm' + (++F.seq), decorationId: p.decorationId, x: p.x, y: p.y }]) };
      if (mode !== 'nostate') bag(p.decorationId, -1);
    } else if (rid === 4757) {
      var t2 = tabOf(p.labelId), gone = t2.labelStoreData.filter(function (q) { return q.uuid === p.uuid; })[0];
      ack = { labelId: t2.labelId, labelName: t2.labelName, labelStoreData: t2.labelStoreData.filter(function (q) { return mode === 'nostate' || q !== gone; }) };
      if (mode !== 'nostate' && gone) bag(gone.decorationId, 1);
    } else if (rid === 4792) { if (mode !== 'nostate') F.up.state = 3; }
    else if (rid === 4793) { if (mode !== 'nostate') { bag(48217, -p.num); F.up.exp += p.num; F.up.state = count(48217) > 0 ? 4 : 3; } }
    return { s: 0, ack: ack };
  }
  function later(fn) { setTimeout(fn, 10); }

    send: function (rid, p, t, cb) {
