<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fake game</title></head>
<body>
<script>
// A fake Top War client: just enough of DataCenter, chat, NET, EventCenter, ActivityController,
// NWorldMapMarchModel (_myMarch), TableManager and LocalManager for the Map Collector, plus the bag, gems, VIP
// level and the VIP shop's Advanced March Speed-up for speed-ups (buy 818, use 920). For Mask Mystery Boxes:
// cities on any server in the 901 world view (a box hangs off its owner's city as cityReward) and the 2503 collect;
// world and alliance chat with the game's box cards (t:48) and base shares (t:0 st:4), and sendToWorldChannel.
// For Fun Stuff: the open chat (NowChoiceKey), the emoji sends (sendEmotionGroup / sendGIFGroup), the player's level
// and the animated-emoji level floor (GameTools config 630051).
// For the Alliance Defense Skipper: the siege state (activity type 26, alMonsterSiege), server time, alliance rank and
// the skip request (sendPB 3700): a window opens, a skip marches the boss, the wave resolves battleMs later.
window.__fake = { uid: 'test-owner-uid', name: 'Tex', left: 50, socket: 1, sent: [], answers: [], chat: [], handlers: {}, myMarch: {}, activity: true,
  gems: 1000, bag: 0, vip: 15, marchSecs: 2, buyMode: 'ok', useMode: 'ok', bagLagMs: 0, drift: 0, used: [], pending: [],
  cities: {}, claimed: {}, collects: 0, limitAfter: 0, viewError: '', lose901: 0, emptyReward: false, nullItem: false,
  serverNum: {}, serverIds: [], shares: [], msgSeq: 0,
  choice: null, level: 100, gifLevel: '20', emoji: [], emojiThrows: false, toasts: [],
  known: { emotion_new: [192, 193, 303], emoji_gif: [10005] },   // ids the game's tables hold
  siege: null, rank: 5, battleMs: 500, waitSec: 60, loseAt: 0, refuseSkip: false, opens: {},
  // like the real client after login: world chat already holds history
  world: [{ _msgId: 'w0', _time: Math.floor(Date.now() / 1000) - 30, _worldId: '2864', _msgType: 0, _msg: 'hello world', _chatShareLinkData: null }] };
// a test can keep this game logged out across reloads (a reconnect that does not work)
try { if (localStorage.getItem('fake_down')) { window.__fake.socket = 3; window.__fake.kickBox = true; } } catch (e) {}
(function () {
  var F = window.__fake;
  var ec = {
    on: function (n, f) { (F.handlers[n] = F.handlers[n] || []).push(f); },
    off: function (n, f) { F.handlers[n] = (F.handlers[n] || []).filter(function (x) { return x !== f; }); },
    emit: function (n, a) { (F.handlers[n] || []).slice().forEach(function (f) { f(a); }); }
  };
  F.emit = ec.emit;
  var ws = {}; Object.defineProperty(ws, 'readyState', { get: function () { return F.socket; } });
  var NET = {
    _socket: { _webSocket: ws },
    dispose: function () { F.disposed = true; F.socket = 3; },
    checkRequestIdNoRes: function (rid) { return F.pending.indexOf(rid) >= 0; },
    send: function (rid, p, target, cb) {
      F.sent.push({ rid: rid, p: JSON.parse(JSON.stringify(p)), at: Date.now(), target: typeof target });
      var n = F.sent.length, ans;
      if (rid === 818) {                                   // buy one Advanced March Speed-up from the VIP shop
        if (F.buyMode === 'fail') ans = { s: 3, d: 'shop_error' };
        else {
          var add = function () { F.bag += 1; F.gems -= 37 + F.drift; };
          if (F.bagLagMs) setTimeout(add, F.bagLagMs); else add();
          if (F.buyMode === 'lost') return true;             // bought, but the answer never arrives
          ans = { s: 0, d: JSON.stringify({ reward: { items: [{ itemId: 520002, itemCount: 1 }] } }) };
        }
      } else if (rid === 920) {                            // use one on a march
        if (F.bag > 0) { F.bag -= 1; F.used.push(p.marchId); if (F.useMode === 'lost') return true; ans = { s: 0, d: '{}' }; }
        else ans = { s: 3, d: 'item_not_enough' };
      } else if (rid === 901) {                            // world view: like the live answer, {c, o, d} with no s
        if (F.lose901 > 0) { F.lose901--; return true; }      // sent, never answered
        if (F.viewError) { setTimeout(function () { cb({ c: 901, s: 3, d: F.viewError }); }, 20); return true; }
        var pts = [];
        Object.keys(F.cities).forEach(function (key) {      // key 'server:x:y'
          var a = key.split(':').map(Number), c = F.cities[key], pp = { pid: c.pid, w: a[0], playerInfo: JSON.stringify({ username: c.host || 'Host' }) };
          if (a[0] !== p.k) return;
          if (c.itemId) pp.cityReward = { itemId: c.itemId, instanceId: c.instanceId, players: [], num: 5, endTimeMilli: c.endMs || 0 };
          pts.push({ v: 1, x: a[1], y: a[2], k: a[0], pointType: 1, p: pp });
        });
        setTimeout(function () { cb({ c: 901, o: String(n), d: JSON.stringify({ rtype: 2, pointList: pts }) }); }, 20);
        return true;
      } else {
        var nowSec = Math.floor(Date.now() / 1000);
        ans = F.answers.length ? F.answers.shift() : { s: 0, d: JSON.stringify({ marchInfo: { marchStartTime: nowSec, marchArrive: nowSec + F.marchSecs, marchId: 'm' + n } }) };
      }
      setTimeout(function () { cb(ans); }, 20);
      return true;
    },
    sendPBV2: function (rid, p, target, cb) {
      F.sent.push({ rid: rid, p: JSON.parse(JSON.stringify(p)), at: Date.now(), target: typeof target });
      var city = null, ans;
      Object.keys(F.cities).forEach(function (k) { if (String(F.cities[k].pid) === String(p.targetUidStr)) city = F.cities[k]; });
      if (rid !== 2503) ans = { c: rid, s: 3, pbAckV2: { header: { s: 3, d: 'unknown_request' } } };
      else if (F.limitAfter && F.collects >= F.limitAfter) ans = { c: 2503, s: 3, pbAckV2: { header: { s: 3, d: 'mask_limit_1' } } };
      else if (!city || !city.itemId || F.claimed[city.instanceId]) ans = { c: 2503, s: 3, pbAckV2: { header: { s: 3, d: 'pubilc911' } } };
      else if (F.emptyReward) ans = { c: 2503, s: 0, pbAckV2: { header: { s: 0 }, data: {} } };
      else {
        F.claimed[city.instanceId] = 1; F.collects++;
        var nn = Object.assign({}, F.serverNum); nn[city.itemId] = (nn[city.itemId] || 0) + 1;   // like the 10053 push
        setTimeout(function () { F.serverNum = nn; F.serverIds = F.serverIds.concat([String(city.instanceId)]); }, 30);
        var item = { itemId: city.itemId - 260617001 + 260604016, itemCount: 1 };
        ans = { c: 2503, s: 0, pbAckV2: { header: { s: 0 }, data: { rewardResult: { items: F.nullItem ? [null, item] : [item] } } } };
      }
      setTimeout(function () { cb(ans); }, 20);
      return true;
    }
  };
  // ---- Alliance Defense siege: open a wave's window, march, resolve
  var MARCHING = 2147483647;
  function nowSec() { return Math.floor(Date.now() / 1000); }
  F.openWindow = function () { if (!F.siege) return; F.siege.nextTime = nowSec() + F.waitSec; F.opens[F.siege.round] = Date.now(); ec.emit('ACTIVITY_STATE_UPDATE', {}); };
  F.march = function () {
    if (!F.siege || F.siege.nextTime === MARCHING) return;
    F.siege.nextTime = MARCHING; ec.emit('ACTIVITY_STATE_UPDATE', {});
    var r = F.siege.round;
    setTimeout(function () {
      if (!F.siege || F.siege.round !== r) return;
      if (F.loseAt === r) F.siege.loseTimes++; else F.siege.winTimes++;
      F.siege.round = r + 1;
      if (F.siege.round > F.siege.maxRound) { F.siege.isEnd = 1; ec.emit('ACTIVITY_STATE_UPDATE', {}); return; }
      F.openWindow();
    }, F.battleMs);
  };
  setInterval(function () { if (F.siege && F.siege.nextTime < MARCHING && nowSec() >= F.siege.nextTime) F.march(); }, 100);   // the timer runs out
  NET.sendPB = function (rid, p, target, cb) {
    F.sent.push({ rid: rid, p: JSON.parse(JSON.stringify(p)), at: Date.now(), target: typeof target });
    var ok = rid === 3700 && !F.refuseSkip && F.siege && F.siege.nextTime !== MARCHING && nowSec() < F.siege.nextTime;
    if (ok) { F.siege.nextTime = nowSec(); setTimeout(F.march, 100); }
    setTimeout(function () { cb({ pbAck: { header: ok ? { s: 0 } : { s: 3, d: 'defend_quick_07' } } }); }, 20);
    return true;
  };
  var activity = { showUiType: 'ActivityTitanBlessing', id: 1, extra: {} };
  Object.defineProperty(activity.extra, 'left', { get: function () { return F.left; } });
  var chatInst = { _allianceRoomId: '102_2_2864_1', _userChatList: { '2102_2_2864_1': F.chat, '0102_1_2864g123': F.world },
    // like the game: the post goes to world chat and comes back as a message there
    sendToWorldChannel: function (link) {
      if (F.shareThrows) throw new Error('chat panel not ready');
      link.uts = 1;
      var copy = JSON.parse(JSON.stringify(link));
      F.shares.push({ at: Date.now(), link: copy });
      F.world.push({ _msgId: 'mine' + (++F.msgSeq), _time: Math.floor(Date.now() / 1000), _worldId: '2864', _msgType: 1, _msg: 'link', custom: { fUid: F.uid }, _chatShareLinkData: copy });
      ec.emit('newChatPush', {});
    },
    sendEmotionGroup: function (ch, id, uid, name) { emojiSend('emotion', ch, id, uid, name); },
    sendGIFGroup: function (ch, id, uid, name) { emojiSend('gif', ch, id, uid, name); } };
  function emojiSend(fn, ch, id, uid, name) {
    if (F.emojiThrows) throw new Error('chat panel not ready');
    // like the game: an id its table doesn't hold shows a toast (emotions) or does nothing (GIFs), and returns
    if (F.known[fn === 'gif' ? 'emoji_gif' : 'emotion_new'].indexOf(Number(id)) < 0) { if (fn !== 'gif') F.toasts.push('config error emotion id = ' + id); return; }
    F.emoji.push({ fn: fn, ch: ch, id: id, uid: uid, name: name, at: Date.now() });
  }
  Object.defineProperty(chatInst, 'NowChoiceKey', { get: function () { return F.choice; } });   // null: chat panel closed
  var PARTY = { 2: 1, 3: 2, 4: 3 };
  window.__require = function (name) {
    if (name === 'DataCenter') return { DATA: { get ServerTime() { return nowSec(); }, UserData: { Name: F.name, StrUid: F.uid, _resourceData: { get _gold() { return F.gems; } },
      getItemAmount: function (id) { return id === 520002 ? F.bag : 0; }, get VipLevel() { return F.vip; }, get Level() { return F.level; }, get Alliance() { return { Rank: F.rank }; },
      get itemCityRewardReceivedNum() { return F.serverNum; }, get itemCityRewardReceivedInstIds() { return F.serverIds; } } } };
    if (name === 'newChatController') return { newChatController: { _instance: chatInst } };
    if (name === 'NetMgr') return { NET: NET };
    if (name === 'GameTools') return { default: { getDataConfigData: function (id) { return id === 630051 ? F.gifLevel : null; } } };
    if (name === 'EventCenter') return { EventCenter: { getInst: function () { return ec; } } };
    if (name === 'ActivityController') return { ActivityController: { Instance: { _activityList: F.activity ? [activity] : [],
      getActivityByActivitytype: function (t) { return t === 26 && F.siege ? { id: 153, alMonsterSiege: F.siege } : null; } } } };
    if (name === 'NWorldMapMarchModel') return { default: { instance: { _myMarch: F.myMarch } } };
    if (name === 'PlayerInfo') return { default: function () { var u = ''; this.update = function (s) { try { u = JSON.parse(s).username; } catch (e) { u = ''; } }; this.getDisplayName = function () { return u; }; } };
    if (name === 'TableManager') return { TABLE: { getTableDataById: function (t, id) {
      if (t === 'vip_shop' && id === 70202) return { id: 70202, item_id: 520002, need_vip_level: 2, price_shop: 37 };
      if ((t === 'emotion_new' || t === 'emoji_gif') && F.known[t].indexOf(Number(id)) >= 0) return { id: Number(id) };
      if (t === 'mask_mystery_party' && PARTY[id]) { var ty = PARTY[id]; return { id: id, type: ty, item_id: 260617001 + ty, msg_banner: 'shareIcon' + (ty + 1), share_msg_key: 'JMR_bs_00' + ty, msg_type: 62 + ty, daily_limit: 20 }; }
      if (t === 'item' && id >= 260604017 && id <= 260604019) return { name: 'mask_reward_' + (id - 260604016) };
      return t === 'item' && id === 79200004 ? { name: 'equip_box_16' } : null; } } };
    var TEXT = { equip_box_16: 'Blessing Key', mask_reward_1: 'Mask Treasure', mask_reward_2: 'Mask HT', mask_reward_3: 'Mask RSS',
      pubilc911: 'Reward claimed', mask_limit_1: 'Daily limit reached', view_too_fast: 'Too frequent' };
    if (name === 'LocalManager') return { LOCAL: { getText: function (k) { return TEXT[k] || k; } } };
    return null;
  };
  // the game's "Multiple active logins" box, shown when another device logs in
  var kickNode = { activeInHierarchy: true, _components: [{ ownerCaller: { options: { content: 'Multiple active logins detected for this account. Please verify if they are all initiated by you for security purposes.' } } }] };
  window.cc = { game: { pause: function () { F.paused = true; } }, find: function (path) { return F.kickBox && path === 'New Node/New Node/MsgBoxComponent' ? kickNode : null; } };
  // the game's box card ("X's Base has transformed into a Treasure Map!") in world ('w') or alliance ('a') chat
  F.card = function (room, server, x, y, type, endMs, host) {
    (room === 'a' ? F.chat : F.world).push({ _msgId: 'c' + (++F.msgSeq), _time: Math.floor(Date.now() / 1000), _worldId: '2864', _msgType: 1, _msg: 'link',
      _chatShareLinkData: { p: { x: x, y: y, z: 0 }, s: 'JMR_bs_00' + type, t: 48, uts: 1, icon: 'm/UserItemCityReward/images/shareIcon' + (type + 1), actt: 62 + type,
        extra: { shareIconPath: 'image/NChat/chat_v3_share_icon_pos5', btnKey: '102385', expireTime: endMs / 1000, shareBgPath: 'image/NChat/chat_v3_share_bg11', jumpServerId: server, aid: 0, shareTitleColor: '#5674d2', contentParams: [host || 'Host'] } } });
    ec.emit('newChatPush', {});
  };
  // a plain base share (t:0 st:4), ageSec seconds old
  F.base = function (room, server, x, y, ageSec) {
    (room === 'a' ? F.chat : F.world).push({ _msgId: 'b' + (++F.msgSeq), _time: Math.floor(Date.now() / 1000) - (ageSec || 0), _worldId: '2864', _msgType: 1, _msg: 'link',
      _chatShareLinkData: { t: 0, st: 4, p: { x: x, y: y, z: server }, s: 'Lv.30[DOG]Someone', icon: '', pid: '1' } });
    ec.emit('newChatPush', {});
  };
  F.notice = function (id, name, x, y) {
    F.chat.push({ _msgId: String(id), _mt: '523', _time: Math.floor(Date.now() / 1000), _msg: '<color=#f77a0b>' + name + "</c>'s Titan Gift Treasure Map appeared at server 2864 (" + x + ', ' + y + ').' });
    ec.emit('newChatPush', {});
  };
})();
</script>
</body></html>
