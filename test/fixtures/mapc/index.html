<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fake game</title></head>
<body>
<script>
// A fake Top War client: just enough of DataCenter, chat, NET, EventCenter, ActivityController,
// NWorldMapMarchModel (_myMarch), TableManager and LocalManager for the Map Collector, plus the bag, gems, VIP
// level and the VIP shop's Advanced March Speed-up for speed-ups (buy 818, use 920).
window.__fake = { uid: 'test-owner-uid', name: 'Tex', left: 50, socket: 1, sent: [], answers: [], chat: [], handlers: {}, myMarch: {}, activity: true,
  gems: 1000, bag: 0, vip: 15, marchSecs: 2, buyMode: 'ok', useMode: 'ok', bagLagMs: 0, drift: 0, used: [], pending: [] };
// a test can keep this game logged out across reloads (a reconnect that does not work)
try { if (localStorage.getItem('fake_down')) { window.__fake.socket = 3; window.__fake.kickBox = true; } } catch (e) {}
(function () {
  var F = window.__fake;
  var ec = {
    on: function (n, f) { (F.handlers[n] = F.handlers[n] || []).push(f); },
    off: function (n, f) { F.handlers[n] = (F.handlers[n] || []).filter(function (x) { return x !== f; }); },
    emit: function (n, a) { (F.handlers[n] || []).slice().forEach(function (f) { f(a); }); }
  };
  F.emit = ec.emit;
  var ws = {}; Object.defineProperty(ws, 'readyState', { get: function () { return F.socket; } });
  var NET = {
    _socket: { _webSocket: ws },
    dispose: function () { F.disposed = true; F.socket = 3; },
    checkRequestIdNoRes: function (rid) { return F.pending.indexOf(rid) >= 0; },
    send: function (rid, p, target, cb) {
      F.sent.push({ rid: rid, p: JSON.parse(JSON.stringify(p)), at: Date.now(), target: typeof target });
      var n = F.sent.length, ans;
      if (rid === 818) {                                   // buy one Advanced March Speed-up from the VIP shop
        if (F.buyMode === 'fail') ans = { s: 3, d: 'shop_error' };
        else {
          var add = function () { F.bag += 1; F.gems -= 37 + F.drift; };
          if (F.bagLagMs) setTimeout(add, F.bagLagMs); else add();
          if (F.buyMode === 'lost') return true;             // bought, but the answer never arrives
          ans = { s: 0, d: JSON.stringify({ reward: { items: [{ itemId: 520002, itemCount: 1 }] } }) };
        }
      } else if (rid === 920) {                            // use one on a march
        if (F.bag > 0) { F.bag -= 1; F.used.push(p.marchId); if (F.useMode === 'lost') return true; ans = { s: 0, d: '{}' }; }
        else ans = { s: 3, d: 'item_not_enough' };
      } else {
        var nowSec = Math.floor(Date.now() / 1000);
        ans = F.answers.length ? F.answers.shift() : { s: 0, d: JSON.stringify({ marchInfo: { marchStartTime: nowSec, marchArrive: nowSec + F.marchSecs, marchId: 'm' + n } }) };
      }
      setTimeout(function () { cb(ans); }, 20);
      return true;
    }
  };
  var activity = { showUiType: 'ActivityTitanBlessing', id: 1, extra: {} };
  Object.defineProperty(activity.extra, 'left', { get: function () { return F.left; } });
  var chatInst = { _allianceRoomId: '102_2_2864_1', _userChatList: { '2102_2_2864_1': F.chat } };
  window.__require = function (name) {
    if (name === 'DataCenter') return { DATA: { UserData: { Name: F.name, StrUid: F.uid, _resourceData: { get _gold() { return F.gems; } },
      getItemAmount: function (id) { return id === 520002 ? F.bag : 0; }, get VipLevel() { return F.vip; } } } };
    if (name === 'newChatController') return { newChatController: { _instance: chatInst } };
    if (name === 'NetMgr') return { NET: NET };
    if (name === 'EventCenter') return { EventCenter: { getInst: function () { return ec; } } };
    if (name === 'ActivityController') return { ActivityController: { Instance: { _activityList: F.activity ? [activity] : [] } } };
    if (name === 'NWorldMapMarchModel') return { default: { instance: { _myMarch: F.myMarch } } };
    if (name === 'TableManager') return { TABLE: { getTableDataById: function (t, id) {
      if (t === 'vip_shop' && id === 70202) return { id: 70202, item_id: 520002, need_vip_level: 2, price_shop: 37 };
      return t === 'item' && id === 79200004 ? { name: 'equip_box_16' } : null; } } };
    if (name === 'LocalManager') return { LOCAL: { getText: function (k) { return k === 'equip_box_16' ? 'Blessing Key' : k; } } };
    return null;
  };
  // the game's "Multiple active logins" box, shown when another device logs in
  var kickNode = { activeInHierarchy: true, _components: [{ ownerCaller: { options: { content: 'Multiple active logins detected for this account. Please verify if they are all initiated by you for security purposes.' } } }] };
  window.cc = { game: { pause: function () { F.paused = true; } }, find: function (path) { return F.kickBox && path === 'New Node/New Node/MsgBoxComponent' ? kickNode : null; } };
  F.notice = function (id, name, x, y) {
    F.chat.push({ _msgId: String(id), _mt: '523', _time: Math.floor(Date.now() / 1000), _msg: '<color=#f77a0b>' + name + "</c>'s Titan Gift Treasure Map appeared at server 2864 (" + x + ', ' + y + ').' });
    ec.emit('newChatPush', {});
  };
})();
</script>
</body></html>
