name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site files
        run: |
          mkdir _site
          cp pages/index.html pages/push-admin.html pages/armory-report.html pages/tex-armory.html pages/roadmap.html pages/battle-report.html pages/decor-index.html pages/bases.html pages/heroes.html pages/easter-wishing.html pages/enigma-viewer.html pages/battle-replay.html pages/ht-chips.html pages/passwords.html pages/auction.html pages/heroes-awakening.html pages/titan-roster.html pages/titan-battle-plan.html pages/titan-admin.html pages/titan-signup.html pages/titan-changelog.html pages/rockfield.html pages/great-offers-preview.html pages/rockfield-optimizer.html pages/titan.html pages/transfer.html pages/transfer-admin.html pages/transfer-armory.html pages/eternal-themes.html pages/eternal-land-calendar.html pages/eternal-land-matchup.html pages/report-render.js _site/
          cp favicon.ico manifest.json seal-stone-calendar.json player-data.json sw.js feedback-widget.js titan-cab-sync.js titan-cab-bookmarklet.txt all-bookmarklet.js all-bookmarklet.txt dismantle-bookmarklet.js dismantle-bookmarklet.txt merge-bookmarklet.js merge-bookmarklet.txt defense-skip-bookmarklet.js defense-skip-bookmarklet.txt rockfield-core.js _site/
          mkdir -p _site/data
          mkdir -p _site/assets
          # rickandroll.mp4 (84MB) is NOT bundled here — it is hosted in the
          # texnottexas/rickroll repo and served via jsDelivr (see passwords.html).
          # Keeping it out of the artifact keeps the Pages sync well under the size
          # where it intermittently fails with "Deployment failed, try again later".
          mkdir -p _site/assets/cnc-icons && cp assets/cnc-icons/*.png _site/assets/cnc-icons/
          mkdir -p _site/assets/auction-icons && cp assets/auction-icons/*.png _site/assets/auction-icons/
          mkdir -p _site/assets/march-skin-icons && cp assets/march-skin-icons/*.png _site/assets/march-skin-icons/
          mkdir -p _site/assets/titan-slot-icons && cp assets/titan-slot-icons/*.png _site/assets/titan-slot-icons/
          mkdir -p _site/assets/heroes-awakening && cp assets/heroes-awakening/* _site/assets/heroes-awakening/
          mkdir -p _site/assets/hero-awake-icons && cp assets/hero-awake-icons/*.png _site/assets/hero-awake-icons/
          mkdir -p _site/assets/hero-awake-skills && cp assets/hero-awake-skills/*.png _site/assets/hero-awake-skills/
          mkdir -p _site/assets/hero-awake-bgs && cp assets/hero-awake-bgs/*.png _site/assets/hero-awake-bgs/
          mkdir -p _site/assets/hero-awake-items && cp assets/hero-awake-items/*.png _site/assets/hero-awake-items/
          mkdir -p _site/assets/hero-grand-slam && cp assets/hero-grand-slam/*.png _site/assets/hero-grand-slam/
          mkdir -p _site/assets/formation-icons && cp assets/formation-icons/*.png _site/assets/formation-icons/
          mkdir -p _site/assets/bookmarklet-guide && cp assets/bookmarklet-guide/*.png _site/assets/bookmarklet-guide/ 2>/dev/null || true
          mkdir -p _site/assets/caveman && cp assets/caveman/*.webp assets/caveman/*.png _site/assets/caveman/ 2>/dev/null || true
          mkdir -p _site/assets/inventory-icons && cp assets/inventory-icons/*.png _site/assets/inventory-icons/ 2>/dev/null || true
          mkdir -p _site/assets/rockfield && cp assets/rockfield/* _site/assets/rockfield/
          cp data/release-notes.json data/all-heroes.json data/hero-awakening-skills.json data/hero-skills.json data/supportive-skills.json data/hero-talents.json data/auction.json data/march-skins.json data/elemental-enhancements.md data/heroes-awakening.json data/formation-v2.json data/item-table.json data/building-table.json data/army-icon-map.json data/decor-category-map.json data/decoration-levels.json data/decoration-index.json data/decoration-mutual-exclusive.json data/decor-lookups.json data/rune-types.json data/enigma-platforms.json data/enigma-field-conditions.json data/enigma-platform-enhance.json data/titan-roster.json data/titan-battle-plan.json data/titan-changelog.json data/transfer-roster-1805.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      # The Pages sync step (deploy-pages) occasionally fails with a transient
      # "Deployment failed, try again later". Retry up to 3 times before giving up.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before final retry
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4

